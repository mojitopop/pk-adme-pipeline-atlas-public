<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PK/ADME Pipeline Atlas</title>
<style>
:root{
  --bg:#0a0e16; --bg1:#0d1420; --bg2:#111a29; --raised:#152135;
  --line:#1e2a3d; --line2:#28374f;
  --tx:#e7eefc; --dim:#93a4c0; --faint:#5f7188;
  --dim2:#6d7f9c; --faint2:#4a5a76;
  --mono:ui-monospace,"Cascadia Code","JetBrains Mono","SF Mono",Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --flow:#dff6ff;
  --s0:#64748b;
  --s1:#2dd4bf; --s2:#38bdf8; --s3:#818cf8; --s4:#a78bfa;
  --s5:#e879f9; --s6:#fb7185; --s7:#fb923c; --s8:#fbbf24;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:
   radial-gradient(1200px 700px at 78% -10%, #12203a 0%, rgba(18,32,58,0) 60%),
   radial-gradient(900px 600px at 5% 110%, #14243c 0%, rgba(20,36,60,0) 55%),
   var(--bg);
  color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.45;
  overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}
a{color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#24344c;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- header ---------- */
.hd{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(20,30,48,.65),rgba(12,18,28,.4));backdrop-filter:blur(6px);flex:0 0 auto}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--mono);font-weight:600;letter-spacing:.14em;font-size:13px;
  background:linear-gradient(90deg,var(--s1),var(--s3),var(--s5),var(--s7),var(--s8));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{color:var(--dim2);font-size:11px;letter-spacing:.02em;margin-top:2px}
.hd .sp{flex:1}
.seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{background:transparent;color:var(--dim);border:0;padding:7px 13px;font-family:var(--mono);
  font-size:12px;letter-spacing:.04em;cursor:pointer;transition:.15s}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--tx)}
.seg button:hover{color:var(--tx)}
.mobtog{display:none;background:var(--bg1);border:1px solid var(--line2);color:var(--dim);
  border-radius:9px;padding:7px 10px;font-family:var(--mono);font-size:12px;cursor:pointer;align-items:center;gap:5px}
.mobtog:hover{color:var(--tx)}
.panel-close{display:none}
.search{position:relative}
.search input{background:var(--bg1);border:1px solid var(--line2);border-radius:9px;color:var(--tx);
  padding:7px 11px 7px 30px;font-family:var(--mono);font-size:12px;width:210px;outline:none;transition:.15s}
.search input:focus{border-color:var(--s4);box-shadow:0 0 0 3px rgba(167,139,250,.16)}
.search svg{position:absolute;left:9px;top:8px;width:14px;height:14px;color:var(--dim2)}
.sres{position:absolute;top:38px;right:0;width:320px;max-height:340px;overflow:auto;background:var(--bg2);
  border:1px solid var(--line2);border-radius:10px;z-index:40;box-shadow:0 20px 50px rgba(0,0,0,.5);display:none}
.sres.on{display:block}
.sres div{padding:7px 11px;font-family:var(--mono);font-size:12px;cursor:pointer;border-bottom:1px solid var(--line);
  display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sres div:hover{background:var(--raised)}
.sres .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.sres .rp{color:var(--dim2);font-size:10px;margin-left:auto;flex:0 0 auto}
.counts{font-family:var(--mono);font-size:11px;color:var(--dim2);text-align:right;line-height:1.35}
.counts b{color:var(--dim)}

/* ---------- spine rail ---------- */
.rail{flex:0 0 auto;padding:12px 16px 8px;border-bottom:1px solid var(--line);position:relative}
.railflow{position:absolute;left:16px;right:16px;top:50%;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--s1),var(--s2),var(--s3),var(--s4),var(--s5),var(--s6),var(--s7),var(--s8));
  opacity:.25;pointer-events:none}
.railflow.dash{background-image:repeating-linear-gradient(90deg,#fff0 0 8px,rgba(223,246,255,.55) 8px 16px);
  background-size:32px 100%;opacity:.5;animation:flow 1s linear infinite}
@keyframes flow{to{background-position:32px 0}}
.stops{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;position:relative;z-index:2}
.stop{background:linear-gradient(180deg,var(--bg2),var(--bg1));border:1px solid var(--line);border-radius:12px;
  padding:9px 8px 8px;cursor:pointer;position:relative;transition:.22s;overflow:hidden}
.stop:hover{border-color:var(--line2);transform:translateY(-1px)}
.stop .bar{position:absolute;left:0;top:0;height:3px;width:100%;background:var(--hue);opacity:.5}
.stop .sn{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--hue);font-weight:600}
.stop .sl{font-size:12px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .sc{font-family:var(--mono);font-size:10px;color:var(--faint2);margin-top:3px}
.stop[aria-current=true]{border-color:var(--hue);background:
   linear-gradient(180deg,color-mix(in srgb,var(--hue) 16%,var(--bg2)),var(--bg1));
   box-shadow:0 0 0 1px var(--hue), 0 8px 26px -8px var(--hue)}
.stop[aria-current=true] .bar{opacity:1;height:3px;box-shadow:0 0 12px var(--hue)}
.stop[aria-current=true] .sl{color:var(--tx)}
.stop .arti{position:absolute;right:7px;bottom:6px;font-family:var(--mono);font-size:9px;color:var(--faint2)}

/* ---------- main 3-col ---------- */
.main{flex:1 1 auto;display:grid;grid-template-columns:322px 1fr 348px;min-height:0}
.pane{min-height:0;overflow:auto;padding:16px}
.left{border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(14,20,32,.5),rgba(10,14,22,.2))}
.right{border-left:1px solid var(--line);background:linear-gradient(180deg,rgba(14,20,32,.5),rgba(10,14,22,.2))}
.center{position:relative;overflow:hidden;padding:0}

/* left panel content */
.sbig{display:flex;align-items:baseline;gap:10px}
.sbig .num{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:.04em;color:var(--hue);
  text-shadow:0 0 22px color-mix(in srgb,var(--hue) 55%,transparent)}
.sbig .rp{font-family:var(--mono);font-size:11px;color:var(--dim2);border:1px solid var(--line2);
  border-radius:20px;padding:2px 9px}
.stitle{font-size:16.5px;font-weight:600;margin:10px 0 2px;letter-spacing:-.01em;line-height:1.25}
.soneline{color:var(--hue);font-size:12.5px;font-family:var(--mono);margin-bottom:12px;opacity:.95}
.snarr{color:var(--dim);font-size:13px;line-height:1.62;margin-bottom:16px}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--faint2);text-transform:uppercase;
  margin:16px 0 7px;display:flex;align-items:center;gap:8px}
.lbl::after{content:"";flex:1;height:1px;background:var(--line)}
.io{display:flex;flex-direction:column;gap:5px}
.chip{font-family:var(--mono);font-size:11.5px;padding:5px 9px;border-radius:8px;border:1px solid var(--line2);
  background:var(--bg1);display:flex;gap:8px;align-items:center}
.chip .k{font-size:9px;letter-spacing:.08em;color:var(--faint2);text-transform:uppercase;margin-left:auto}
.chip.db{border-left:2px solid var(--s2)}
.chip.file{border-left:2px solid var(--s7)}
.chip.artifact,.chip.source{border-left:2px solid var(--dim2)}
.flowrow{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:12px;margin:2px 0}
.steps{counter-reset:st;display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:10px;padding:6px 0;font-size:12.5px;color:var(--dim);position:relative}
.step::before{counter-increment:st;content:counter(st);font-family:var(--mono);font-size:10px;color:var(--hue);
  border:1px solid var(--line2);border-radius:50%;width:18px;height:18px;display:grid;place-items:center;flex:0 0 auto;margin-top:1px}
.step code{font-family:var(--mono);color:var(--tx);font-size:11.5px}
.handoff{margin-top:14px;padding:10px 12px;border:1px dashed var(--line2);border-radius:10px;
  font-size:12px;color:var(--dim);background:rgba(223,246,255,.03)}
.handoff b{color:var(--flow);font-weight:500;font-family:var(--mono);font-size:11px}
.nav{display:flex;gap:8px;margin-top:18px}
.nav button{flex:1;background:var(--bg1);border:1px solid var(--line2);color:var(--dim);border-radius:9px;
  padding:9px;font-family:var(--mono);font-size:12px;cursor:pointer;transition:.15s}
.nav button:hover:not(:disabled){color:var(--tx);border-color:var(--s4)}
.nav button:disabled{opacity:.35;cursor:default}
.play{flex:0 0 auto!important;width:44px}

/* ---------- graph ---------- */
.gwrap{position:absolute;inset:0}
svg.graph{width:100%;height:100%;display:block;cursor:grab}
svg.graph.grab{cursor:grabbing}
#mesh3d{position:absolute;inset:0;width:100%;height:100%;display:none;cursor:grab;touch-action:none}
#mesh3d.on{display:block}
#mesh3d.grab{cursor:grabbing}
.shapes{display:flex;gap:0;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.shapes button{background:transparent;border:0;color:var(--dim);font-family:var(--mono);font-size:11px;
  padding:5px 10px;cursor:pointer;transition:.15s}
.shapes button[aria-pressed=true]{background:var(--raised);color:var(--tx)}
.shapes button:hover{color:var(--tx)}
.dthumb{margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;
  background:#0b111c;transition:.18s}
.dthumb:hover{border-color:var(--hue);transform:translateY(-1px)}
.dthumb svg{width:100%;height:auto;display:block}
.dthumb .dcap{font-family:var(--mono);font-size:10px;color:var(--faint2);padding:6px 9px;border-top:1px solid var(--line);
  display:flex;gap:6px;align-items:center}
.dthumb:hover .dcap{color:var(--dim)}
.dstrip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.dstrip button{background:var(--bg1);border:1px solid var(--line2);color:var(--dim);border-radius:8px;
  padding:6px 11px;font-family:var(--mono);font-size:11px;cursor:pointer;transition:.15s}
.dstrip button[aria-pressed=true]{border-color:var(--hue);color:var(--tx);background:var(--raised)}
.dstrip button:hover{color:var(--tx)}
.ghint{position:absolute;left:14px;bottom:12px;font-family:var(--mono);font-size:11px;color:var(--faint2);
  pointer-events:none;z-index:3;max-width:60%}
.gtop{position:absolute;left:14px;top:12px;z-index:3;display:flex;gap:8px;align-items:center}
.gbadge{font-family:var(--mono);font-size:11px;color:var(--dim);background:rgba(13,20,32,.7);
  border:1px solid var(--line);border-radius:8px;padding:5px 10px;backdrop-filter:blur(4px)}
.gbadge b{color:var(--hue)}
.legend{position:absolute;right:14px;top:12px;z-index:3;background:rgba(13,20,32,.72);border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;backdrop-filter:blur(4px);font-size:11px;color:var(--dim);max-width:190px}
.legend .lr{display:flex;align-items:center;gap:7px;margin:3px 0}
.legend .sw{width:10px;height:10px;border-radius:50%}
.legend .ln{width:16px;height:0;border-top:2px solid var(--flow)}
.node{cursor:pointer}
.node circle{transition:opacity .3s, r .18s, stroke-width .15s}
.node text{font-family:var(--mono);fill:var(--dim);pointer-events:none;transition:opacity .3s}
.edge{fill:none;stroke:var(--line2);transition:opacity .3s, stroke .2s}
.edge.bridge{stroke:var(--flow);stroke-width:1.5;stroke-dasharray:5 5;filter:drop-shadow(0 0 4px rgba(223,246,255,.55))}
.edge.bridge.anim{animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-20}}
.gstage-enter .node{opacity:0;transform:scale(.9)}
.tip{position:absolute;z-index:50;pointer-events:none;background:var(--bg2);border:1px solid var(--line2);
  border-radius:9px;padding:8px 10px;font-family:var(--mono);font-size:11.5px;max-width:280px;
  box-shadow:0 14px 34px rgba(0,0,0,.5);opacity:0;transition:opacity .12s;transform:translateY(-50%)}
.tip.on{opacity:1}
.tip .tf{color:var(--tx);font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip .tm{color:var(--dim2);font-size:10.5px}

/* right panel */
.rhead{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--faint2);text-transform:uppercase;margin-bottom:10px}
.mfile{font-family:var(--mono);font-size:15px;color:var(--tx);word-break:break-all;line-height:1.3;margin-bottom:8px}
.mmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:7px;border:1px solid var(--line2);color:var(--dim)}
.tag.hue{border-color:var(--hue);color:var(--hue)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--bg1);border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center}
.stat b{display:block;font-family:var(--mono);font-size:18px;color:var(--tx)}
.stat span{font-size:9.5px;letter-spacing:.08em;color:var(--faint2);text-transform:uppercase}
.conn{display:flex;flex-direction:column;gap:3px}
.crow{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;font-family:var(--mono);
  font-size:11.5px;cursor:pointer;border:1px solid transparent;transition:.12s}
.crow:hover{background:var(--raised);border-color:var(--line2)}
.crow .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.crow .rl{margin-left:auto;color:var(--faint2);font-size:9.5px;letter-spacing:.04em}
.crow.br{background:rgba(223,246,255,.05)}
.crow.br .rl{color:var(--flow)}
.gdoc{display:flex;flex-direction:column;gap:2px}
.empty{color:var(--faint2);font-size:12px;font-style:italic;padding:8px 0}
.godscript{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px;background:var(--bg1)}
.godscript .gf{font-family:var(--mono);font-size:12px;color:var(--tx);word-break:break-all}
.godscript .gr{font-size:11px;color:var(--dim);margin-top:2px}
.godscript .gfn{font-family:var(--mono);font-size:10.5px;color:var(--dim2);margin-top:4px;padding-left:8px;border-left:1px solid var(--line2)}
.godscript .gfn b{color:var(--hue);font-weight:500}

/* ---------- extra views: scoring + diagrams ---------- */
.viewpane{position:absolute;inset:0;overflow:auto;padding:20px 26px 40px;display:none}
.viewpane.on{display:block}
.main.wide{grid-template-columns:1fr}
.main.wide .left,.main.wide .right{display:none}
.vhead{font-family:var(--mono);font-size:19px;letter-spacing:.02em;color:var(--tx);margin-bottom:4px}
.vsub{color:var(--dim2);font-size:12.5px;max-width:900px;line-height:1.6;margin-bottom:14px}
.caveat{border:1px solid #4a3a1a;background:rgba(251,191,36,.07);border-left:3px solid var(--s8);
  border-radius:9px;padding:10px 13px;font-size:12.5px;color:#e8d9b0;max-width:980px;margin-bottom:16px;line-height:1.55}
.caveat b{color:var(--s8)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chipbtn{background:var(--bg1);border:1px solid var(--line2);color:var(--dim);border-radius:20px;
  padding:6px 13px;font-family:var(--mono);font-size:11.5px;cursor:pointer;transition:.15s}
.chipbtn:hover{color:var(--tx)}
.chipbtn[aria-pressed=true]{background:var(--raised);color:var(--tx);border-color:var(--gh,var(--s4))}
.gsel{background:var(--bg1);border:1px solid var(--line2);color:var(--tx);border-radius:8px;padding:6px 10px;
  font-family:var(--mono);font-size:11.5px;max-width:min(620px,70vw);cursor:pointer;outline:none}
.gsel:focus{border-color:#e879f9;box-shadow:0 0 0 3px rgba(232,121,249,.15)}
.gsel option{background:#111a29;color:var(--tx)}
.chartbox{background:linear-gradient(180deg,rgba(17,26,41,.7),rgba(11,17,28,.5));border:1px solid var(--line);
  border-radius:14px;padding:16px 10px 8px;margin-bottom:18px}
.chartbox svg{width:100%;height:340px;display:block;overflow:visible}
.ax{stroke:var(--dim2);stroke-width:1.8}
.axlbl{font-family:var(--mono);font-size:11.5px;fill:var(--dim)}
.gridln{stroke:var(--line2);stroke-width:1.3;stroke-dasharray:2 4}
.pt{cursor:pointer;transition:r .15s}
.pt:hover{r:8}
.slbl{font-family:var(--mono);font-size:12px;fill:var(--tx)}
.vlbl{font-family:var(--mono);font-size:10.5px;font-weight:600}
.armleg{display:flex;flex-wrap:wrap;gap:5px 16px;margin:2px 2px 10px;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.armleg span{display:inline-flex;align-items:center;gap:6px}
.armleg i{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.stbl{width:100%;border-collapse:collapse;font-size:12px}
.stbl th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint2);
  text-align:left;padding:7px 9px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--bg1)}
.stbl td{padding:6px 9px;border-bottom:1px solid var(--line);color:var(--dim);vertical-align:top}
.stbl tr:hover td{background:rgba(255,255,255,.02)}
.stbl .v{font-family:var(--mono);color:var(--tx);white-space:nowrap}
.stbl .num{font-family:var(--mono);text-align:right;color:var(--tx)}
.stbl .st{font-family:var(--mono);font-size:10px}
.st-PASSED{color:#34d399}.st-FAILED,.st-SHELVED{color:#fb7185}.st-diagnostic,.st-baseline{color:var(--s2)}
.st-offline{color:var(--faint2)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.dcard{background:var(--bg1);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;
  transition:.2s;display:flex;flex-direction:column}
.dcard:hover{border-color:var(--s4);transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.4)}
.dcard .dt{font-family:var(--mono);font-size:12px;color:var(--tx);padding:10px 13px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px}
.dcard .dt i{font-style:normal;color:var(--faint2);font-size:10px;margin-left:auto}
.dcard .dsvg{padding:8px;background:#0b111c}
.dcard .dsvg svg{width:100%;height:auto;display:block}
.dfocus{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:10px}
.dfocus svg{width:100%;height:auto;display:block}
.backbtn{background:var(--bg1);border:1px solid var(--line2);color:var(--dim);border-radius:9px;padding:7px 13px;
  font-family:var(--mono);font-size:12px;cursor:pointer;margin-bottom:12px}
.backbtn:hover{color:var(--tx);border-color:var(--s4)}
@media (max-width:1180px){
  .main{grid-template-columns:1fr}
  .left,.right{display:none}
  .left.show,.right.show{display:block;position:absolute;z-index:30;top:0;bottom:0;width:min(92vw,360px);
    box-shadow:0 0 60px rgba(0,0,0,.6)}
  .left.show{left:0}.right.show{right:0}
  .mobtog{display:inline-flex}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="hd">
    <div class="brand"><b>PK/ADME · PIPELINE ATLAS</b><small>8-stage extraction pipeline over a 9-repo knowledge graph</small></div>
    <button class="mobtog" id="tLeft" aria-label="stage detail">ⓘ&nbsp;stage</button>
    <div class="sp"></div>
    <button class="mobtog" id="tRight" aria-label="scripts">≣&nbsp;scripts</button>
    <div class="seg" role="group" aria-label="view mode">
      <button id="mGuided" aria-pressed="true">▸ Guided</button>
      <button id="mDiag" aria-pressed="false">▤ Diagram</button>
      <button id="mMesh" aria-pressed="false">◇ Full mesh</button>
      <button id="mScore" aria-pressed="false">↗ Scoring</button>

assignment is a three-hop chain driven off pk_text: compound_detect/02_detect_compounds_shard.py runs a qwen2.5 model on the cluster to detect each row's parent + active metabolites + co-actives, 03_load_compounds_to_db.py loads that back into raw_llm_txt.detected_compounds and emits roster.json, and pktext_enrichment.py resolves every compound's own identifiers into raw_llm_txt.compound_enrichment by calling metabolite_resolver.resolve() (tier 1 exact-name, tier 2 metabolite-specific NCATS/ChEMBL, tier 3 substring/synonym LIKE = fuzzy, tier 4 InChIKey/CAS structure bridge) with the parent passed in so the inherited-identity guard fires. build_compound_identity.py finally explodes that enrichment sidecar into the one-row-per-compound compound_identity table, NULLing a metabolite's own ids unless genuinely resolved (v66 no-inherit fix), demoting combination brands to compound_kind='product', and flagging same_as_parent / is_biologic. pubchem_names_ids.py is a read-only lead generator for the tier<=2 gaps and manual_overrides.csv (tier-0 authoritative) lets a human hand-fill ids the local DBs cannot resolve. Everything but the GPU detection step is local, deterministic and rebuildable; manual overrides are re-applied on every enrichment run so they survive full rebuilds.","blurb":"Stage S1 'Acquire' turns regulator drug labels from six sources into two artifacts: raw text (the pk_text column of table raw_llm_txt.txt, one row per drug-per-source) and a normalized compound-identity table (raw_llm_txt.compound_identity) carrying CID/UNII with a resolver_tier trust concept.","inputs":[["EMA · MHRA · FDA · ANSM · emc · Wikipedia","source"]],"outputs":[["txt.pk_text","db_table"],["compound_identity","db_table"]],"substeps":["scrape + section-slice each source","GPU compound detect (qwen)","tiered identity resolve (resolver_tier)","build_compound_identity → one row/compound"],"spine":["txt.pk_text"],"diagrams":["02_db_handoff_spine","07_db_id_crosswalk","05_identity_reliability_gate","01_end_to_end_flow"],"handoff_in":"External regulator sources (EMA EPAR PDF, UK emc HTML, UK MHRA PDF, FR ANSM .htm RCP, FDA SPL JSON, Wikipedia/HSDB) land as raw documents; SmPC sources pass through pharmacologie.smpc_section (written by extract_sections.py, keyed by source+doc_ref+section_code) before insert_to_corpus.py upserts them into raw_llm_txt.txt. S1 is the first stage, so there is no prior-stage table — the true boundary-in is the scraped document set keyed to raw_llm_txt.txt.row_id (the AUTO_INCREMENT PK, MAX+1 convention).","handoff_out":"Two joined artifacts on row_id: (1) raw_llm_txt.txt.pk_text = the raw PK/ADME text a row supplies; (2) raw_llm_txt.compound_identity (+ views mono_substance_identity, combination_products) = per-compound CID/UNII/role/parent_unii with resolver_tier + inherited_flag. Downstream PK-value extraction (pk_new_nu_model_vNN) builds its input CSV from raw_llm_txt.txt rows keyed by row_id/meta_source and reads pk_text; identity consumers join on row_id and on unii. FK compound_identity.row_id -> txt.row_id (ON DELETE CASCADE) is the enforced join key.","db_tables":[{"name":"raw_llm_txt.txt (col pk_text)","mode":"read/write","writer_script":"smpc_corpus/insert_to_corpus.py (SmPC rows; other db_source rows via FDA/wiki/HSDB/RCP loaders); read by all identity scripts on row_id"},{"name":"raw_llm_txt.compound_identity","mode":"write","writer_script":"build_compound_identity.py (DROP+CREATE+populate)"},{"name":"raw_llm_txt.compound_enrichment","mode":"write","writer_script":"pktext_enrichment.py (REPLACE INTO sidecar)"},{"name":"raw_llm_txt.detected_compounds","mode":"write","writer_script":"compound_detect/03_load_compounds_to_db.py"},{"name":"pharmacologie.smpc_section","mode":"read/write","writer_script":"smpc_corpus/smpc_scraper/extract_sections.py (write); insert_to_corpus.py (read)"},{"name":"pubchem.* / drugbank_extracted / FDA substances_names / NCATS analyte / ChEMBL","mode":"read","writer_script":"metabolite_resolver.py (read-only tiered SELECTs)"}],"invariants":["Metabolite-no-inherit (v66 fix): a compound's own unii/cid/chembl/cas/inchikey/drugbank columns are populated ONLY when identity_resolved is genuinely true; unresolved/bare-generic/inherited compounds keep own-ids NULL and preserve linkage via inherited_flag + parent_unii — a metabolite NEVER carries the parent's UNII.","resolver_tier trust boundary: tier 1 (exact name) and tier 2 (metabolite-specific NCATS/ChEMBL) are trusted; tier 3 is substring/synonym LIKE (fuzzy, untrusted, e.g. the Kaftrio bortezomib/bivalirudin false-positive landmine); tier 4 is structure-bridge backfill. A tier-1 exact hit is never flagged inherited.","Combination-brand demotion: a combo whose parent has no own unii, or whose unii is merely one component's (entresto->valsartan), becomes compound_kind='product' with all own ids NULLed and is dropped as a link-back target.","same_as_parent honesty flag: when a metabolite/co-active's own (correct) unii coincides with its attributed or row-primary parent's unii, it is flagged (not deleted) — the parent row itself is never flagged.","is_biologic: vaccines/biologics/parenteral-nutrition/panels are flagged and excluded from mono_substance_identity, never deleted.","compound_identity is fully derived + reproducible: DROP+CREATE rebuildable at will; scripts are READ-ONLY on everything except their own output table; DRY-RUN is the default and --commit is required to write.","Manual overrides survive rebuilds: manual_overrides.csv is tier-0 authoritative and re-applied on every pktext_enrichment run (edit as UTF-8, never Excel).","Non-destructive upsert: insert_to_corpus.py keeps existing SmPC row_ids (UPDATE in place, no DELETE) so FK-cascade never wipes downstream compound_detect / metabolite-UNII / manual_overrides work keyed on row_id; stale prior rows are left untouched, not deleted.","PubChem lead generation is strictly read-only (no DB/CSV writes) and precision-first: 0 CIDs=honest-NULL, >1=ambiguous with nothing fetched (never guess which CID).","GSRS/Wikipedia RCP UNII resolution is exact-match-only precision-over-recall: keep a UNII only on exactly one exact name match (salts, stereoisomers, hydrates excluded); ambiguous/none left blank for manual fill.","Naming correction: the diagram's 'txt.pk_text' is actually the pk_text COLUMN of table raw_llm_txt.txt (DB raw_llm_txt), not a table named txt.pk_text; smpc_section lives in the separate pharmacologie DB.","FK column type discipline: detected_compounds/compound_identity FK row_id is INT UNSIGNED to match txt.row_id int(10) unsigned (a signed FK fails errno 150).","inchikey_skeleton derived as pure string op inside the rebuild so it needs no post-rebuild ALTER+UPDATE backfill."],"godDoc":{"god_node":"build_compound_identity.py","why":"It is the terminal node of the identity chain and produces raw_llm_txt.compound_identity — the one-row-per-compound table (plus mono_substance_identity / combination_products views) that every downstream stage joins on via row_id and unii. Its explode_row() encodes the stage's core honesty rules (metabolite-no-inherit, product-id-nulling, same_as_parent, is_biologic) and stamps resolver_tier/confidence/inherited_flag, making it the authoritative definition of what 'compound identity' means for the whole pipeline. The CORPUS_REFRESH_RUNBOOK.md is the companion anchor doc, but this script is the code that emits the stage's canonical output.","scripts":[{"file":"build_compound_identity.py","role":"God node: explode compound_enrichment sidecar into the normalized one-row-per-compound raw_llm_txt.compound_identity table + mono/combination views.","key_functions":[{"name":"explode_row","loc":"L117","does":"Yield one insert-tuple per compound in a row's compounds_json; assigns role, NULLs own ids unless identity_resolved (metabolite-no-inherit), demotes combo brand parent to compound_kind='product', computes same_as_parent, links metabolite to longest-prefix parent/co-active Ids":["db_crossref::build_compound_identity.py","db_crossref::pktext_enrichment.py","db_crossref::metabolite_resolver.py","db_crossref::smpc_corpus/insert_to_corpus.py","db_crossref::smpc_corpus/smpc_scraper/extract_sections.py","db_crossref::smpc_corpus/smpc_scraper/run.py","db_crossref::compound_detect/02_detect_compounds_shard.py","db_crossref::compound_detect/03_load_compounds_to_db.py","db_crossref::gsrs_unii_scraper.py","db_crossref::wiki_rcp.py","db_crossref::fr_parse.py","db_crossref::pubchem_names_ids.py","db_crossref::lombardo_human_pk.py"]},{"id":"s2","label":"Clean & excise","repo":"llm_table_parse","dir":"llm_table_parse","resolved_dir":"llm_table_parse","title":"raw text  →  table-excised prose variants","hue":"#38bdf8","one_line":"Excise tables from raw pk_text into aligned v1/v2/v3 variants + a row_id-joinable raw-table corpus.","narrative":"Stage S2 \"Clean & excise\" takes the raw per-document PK text produced upstream (raw_llm_txt.txt.pk_text, one row per document keyed by row_id) and produces three byte-aligned variants of each label plus a raw-table corpus. It runs in two writer legs. Leg 1 is the table corpus: build_table_corpus.py (extract_fda/extract_ema/extract_rcp/extract_wiki/extract_smpc_emc/extract_smpc_mhra/extract_smpc_ema) pulls every raw <table> from each source database/PDF, joins it to txt.row_id via meta_source (FDA set_id, EMA medicine#, SmPC doc_uid/emc_id, RCP cis), assigns the stable id {row_id}#t{i} through the shared _emit helper, dedups within-row numeric duplicates (_dedup_rows), and writes data/triage/table_corpus.csv; load_table_corpus_to_db.py reloads that CSV into raw_llm_txt.extracted_tables (id PK, joinable to txt by row_id). Leg 2 is the god node, build_pk_text_variants.py: for every txt row with extracted_tables it locates each table's flattened footprint inside pk_text (locate_all: manual override, exact whitespace-tolerant substring, numeric-cluster find_span_by_numbers) and emits v1 (byte copy of pk_text), v2 (each located span -> [TABLE:Tn]), v3 (each [TABLE:Tn] -> table prose only when number_conservation confirms every distinct value survives), plus table_map {Tn: extracted_tables.id} and safety_flags, into raw_llm_txt.pk_text_variants (row_id PK). FDA rows take an exact path (fda_ordered_from_cache replays extract_fda's _FDA_MASKS id-assignment walk against the cached label JSON so positions, not table text, key each id). Tables the deterministic locator cannot place are flagged \"appended\"; qwen_excise_tables.py drives a local qwen2.5 (Ollama, ExcisionLLM) over the whole pk_text to propose garbled-table spans, then verify_spans keeps only byte-exact substrings and reconcile_to_table_ids maps them to appended ids, emitting *_qwen_eyeball.csv for human review (apply_manual_spans.py). materialize_pk_text_clean.py finishes the last mile, resolving residual [TABLE:Tn] in v3 (inline -> restore byte-identical v1 span, appended -> drop) and writing txt.pk_text_clean non-destructively. The remaining top scripts (clean.py, fda_reader.py, wikipedia_reader.py, llm.py, groundtruth.py, triage_core.py) are the older per-table clean-to-prose-and-verify path that produces/verifies the prose bodies leg 2 later splices.","blurb":"Stage S2 \"Clean & excise\" takes the raw per-document PK text produced upstream (raw_llm_txt.txt.pk_text, one row per document keyed by row_id) and produces three byte-aligned variants of each label plus a raw-table corpus. It runs in two writer legs.","inputs":[["txt.pk_text","db_table","s1"]],"outputs":[["extracted_tables","db_table"],["pk_text_variants","db_table"]],"substeps":["detect + excise table spans","build_table_corpus → load to db","build_pk_text_variants (v1/v2/v3)","qwen_excise_tables"],"spine":["extracted_tables","pk_text_variants"],"diagrams":["02_db_handoff_spine","01_end_to_end_flow"],"handoff_in":"Raw text arrives from S1 as raw_llm_txt.txt, one row per document keyed by row_id (with db_source, meta_source, drug_name, unii, pk_text). Raw tables are joined in from each source database/PDF via meta_source (FDA set_id, EMA medicine#, SmPC emc_product_id/doc_uid/ema_product_number, RCP cis) -> row_id, using txt_indexes()/by_meta in build_table_corpus.py.","handoff_out":"S2 hands to S3 (extraction) on the row_id key: raw_llm_txt.pk_text_variants (row_id PK) carries the three aligned variants v1/v2/v3 + table_map {Tn: extracted_tables.id} + safety_flags; raw_llm_txt.extracted_tables (id={row_id}#t{i}, row_id FK) carries every raw table's html/prose; and txt.pk_text_clean (row_id) is the materialized extractor-ready clean text. table_map is the join key from a variant's [TABLE:Tn] placeholder back to the extracted_tables id.","db_tables":[{"name":"raw_llm_txt.txt","mode":"read"},{"name":"raw_llm_txt.extracted_tables","mode":"read/write","writer_script":"load_table_corpus_to_db.py (creates+loads from table_corpus.csv); html_table/prose/flag read by build_pk_text_variants.py, qwen_excise_tables.py, materialize_pk_text_clean.py"},{"name":"raw_llm_txt.pk_text_variants","mode":"read/write","writer_script":"build_pk_text_variants.py (DROP+CREATE+INSERT, DDL at L454); read by qwen_excise_tables.fetch_rows and materialize_pk_text_clean.py"},{"name":"raw_llm_txt.txt.pk_text_clean (added column)","mode":"write","writer_script":"materialize_pk_text_clean.py (ALTER TABLE ADD COLUMN + UPDATE, non-destructive)"},{"name":"pharmacologie_fda.fda_labels","mode":"read"},{"name":"pharmacologie.uk_emc_smpc / uk_mhra_doc / ema_smpc","mode":"read"}],"invariants":["LLM = lead generator, not source of truth: qwen_excise_tables proposes spans, but verify_spans keeps only whitespace/confusable-normalized byte-exact substrings of pk_text and always returns pk_text's own slice, never qwen's copy.","Number conservation: v3 prose may replace a table span only if it keeps every distinct number the extractor would have seen (value-aware: 034.2==34.2, 1.00==1.0); default strict (tolerance 0, no noise waiver). Failing tables keep the literal [TABLE:Tn].","numbers_in(pk_text) subseteq numbers_in(pk_text_clean): materialize_pk_text_clean's acceptance gate asserts no real raw number is lost and 0 [TABLE:Tn] leaks before --commit.","FDA ids are position-keyed, not text-keyed: fda_ordered_from_cache replays extract_fda's exact _FDA_MASKS walk so byte-identical duplicate tables (repeated verbatim across masks) each keep their own {row_id}#t{i}; a prior text-keyed dict orphaned ids on 5/356 rows.","clinical_pharmacology_table slots are traversed but dropped (_FDA_DROP) to keep the id counter stable while never inserting a table whose prose has no home in pk_text.","Ground truth comes from structured Records, never the raw blob: bare trailing digits are never footnote markers (only sup/symbol runs are), so marker digits can't pollute the value set.","Non-destructive last mile: txt.pk_text is never mutated; pk_text_clean is an added column (revert = DROP COLUMN); pk_text_variants is DROP+CREATE idempotent, extracted_tables reload is idempotent.","Locator precedence is manual > exact > numeric with overlap suppression; the numeric-cluster locator (find_span_by_numbers) is duplicated verbatim as a private copy in qwen_excise_tables to avoid rippling into the frozen path.","skip-flagged non-PK tables denoise to the bracket-wrapped SKIP_PROSE_SENTINEL (single source of truth), never the retired bare word 'skipped' which is indistinguishable from real clinical prose."],"godDoc":{"god_node":"build_pk_text_variants.py","why":"Single source of truth for table LOCATION and the three aligned label variants (v1 pk_text / v2 [TABLE:Tn] / v3 prose) plus table_map. Both qwen_excise_tables.py and materialize_pk_text_clean.py import its helpers (_norm_map, table_cells, _specific_numbers, table_footprint, numbers_in, number_conservation, is_noise_number) rather than reimplementing them, and its locate_all/build_variants define the whole stage's data model and honesty guards.","scripts":[{"file":"build_pk_text_variants.py","role":"God node: locate each table in pk_text and emit the three aligned variants (v1/v2/v3) + table_map + safety_flags into pk_text_variants.","key_functions":[{"name":"locate_all","loc":"L338","does":"Three-tier locator (manual override, exact whitespace-tolerant substring, numeric-cluster) returning placed spans, notfound set, per-Ti method; places manual first, then exact, then numeric, dropping overlaps."},{"name":"build_variants","loc":"L386","does":"Builds v2 (right-to-left [TABLE:Tn] substitution + appended trailer) and v3 (prose swap gated by number_conservation), returns stats/flags."},{"name":"number_conservation","loc":"L104","does":"Value-aware guard deciding whether prose may replace a span: prose must keep every distinct number (034.2==34.2), with optional noise/tolerance leniency."},{"name":"table_footprint","loc":"L114","does":"Reconstructs the exact text a table contributes to pk_text via BeautifulSoup get_text(separator=newline)+strip, matching how generate_set.ipynb built pk_text."},{"name":"fda_ordered_from_cache","loc":"L152","does":"FDA-exact excision: replays extract_fda's _FDA_MASKS id-assignment walk against the cached label JSON so position (not table text) keys each {row_id}#t{i} id, avoiding content-duplicate collapse."},{"name":"find_span_by_numbers","loc":"L298","does":"Numeric-cluster fallback locator for flattened EMA/mhra/RCP tables: sliding window over distinctive numbers then grow to boundary with a density gate."}],"interacts_with":["raw_llm_txt.txt","raw_llm_txt.extracted_tables","raw_llm_txt.pk_text_variants","build_table_corpus (_FDA_MASKS/_FDA_DROP)","placeholder_guard","add_table_blob_columns.backfill","manual_spans.csv"]},{"file":"build_table_corpus.py","role":"Build the one raw-table corpus across every db_source, keyed to txt.row_id via meta_source; writes table_corpus.csv.","key_functions":[{"name":"extract_fda","loc":"L119","does":"Pulls latest-version fda_labels *_table masks, joins by set_id=meta_source, assigns {row_id}#t{i} over _merge_fda_tables order (clinical_pharmacology slots burned but dropped)."},{"name":"_emit","loc":"L148","does":"Assigns new {row_id}#{tletter}{i} ids per row (ordered by legacy_id), fills meta_source/drug_name from txt; tletter 's' for smpc_ema to avoid PK collision."},{"name":"_merge_fda_tables","loc":"L90","does":"Returns [(html, keep)] across _FDA_MASKS in order, keep=False for clinical_pharmacology so id slots stay stable."},{"name":"extract_smpc_emc","loc":"L254","does":"Parses PK-relevant <table>s from emc HTML docs, content-routes each to 5.2/4.5/unsure via _smpc_section."},{"name":"_dedup_rows","loc":"L364","does":"Within one row_id drops numerically-identical duplicate tables (FDA left intact); survivors keep ids."}],"interacts_with":["raw_llm_txt.txt (txt_indexes)","pharmacologie_fda.fda_labels","pharmacologie SmPC tables","triage_core.build_rcp_source_map/build_wiki_source_map","smpc_corpus pdf_tables","data/triage/*_source.csv","table_corpus.csv"]},{"file":"load_table_corpus_to_db.py","role":"Idempotently load table_corpus.csv into raw_llm_txt.extracted_tables (DROP+CREATE+INSERT) and sanity-check row_id orphans against txt.","key_functions":[{"name":"main","loc":"L41","does":"Recreates extracted_tables from the DDL, batch-inserts CSV rows, prints per-db_source counts and orphan (row_id not in txt) count."},{"name":"_val","loc":"L35","does":"Coerces row_id to int-or-NULL and empties to NULL for insertion."}],"interacts_with":["data/triage/table_corpus.csv","raw_llm_txt.extracted_tables","raw_llm_txt.txt"]},{"file":"qwen_excise_tables.py","role":"LLM-assisted excision of garbled/flattened table spans the deterministic locator missed (the appended tier); qwen proposes, deterministic code verifies + reconciles to extracted_tables ids.","key_functions":[{"name":"verify_spans","loc":"L286","does":"Keeps only proposed spans that are a whitespace/confusable-normalized byte-exact substring of pk_text (returns pk_text's own slice), drops overlaps; recor lm_table_parse::load_table_corpus_to_db.py","llm_table_parse::qwen_excise_tables.py","llm_table_parse::materialize_pk_text_clean.py","llm_table_parse::clean.py","llm_table_parse::fda_reader.py","llm_table_parse::llm.py","llm_table_parse::groundtruth.py","llm_table_parse::triage_core.py","llm_table_parse::wikipedia_reader.py","llm_table_parse::placeholder_guard.py"]},{"id":"s3","label":"Prose","repo":"gold_extraction","dir":"gold_extraction_pipeline","resolved_dir":"gold_extraction_pipeline","title":"garbled tables  →  faithful prose, folded into frozen text","hue":"#818cf8","one_line":"Garbled PK tables -> number-conserving Sonnet/qwen prose, folded back into txt.frozen_cleaned_pk_text for the extractor.","narrative":"Stage S3 turns garbled/flattened PK tables into faithful English prose and folds that prose back into the label text so the downstream extractor reads clean, number-conserving input instead of numeric soup. Prose is authored two ways, both reusing one strict table-to-prose rule set (sonnet_rescue.system_for() in llm_table_parse): sonnet_rescue.py re-summarizes the tables a human escalated from the triage app (calling claude-sonnet-4-6, clustering byte-identical duplicates so one call fills all twins), and prose_tables_sonnet.py (gold_extraction_pipeline) runs the same prompt on a WHOLE corpus row for transplant test drugs not in the triage app. Every Sonnet result is scored by the same number gate the triage uses (groundtruth.numbers_in / sonnet_rescue.score): every extracted mock value must reappear or the row FAILs. add_prose_column.py is the single authoritative writer that folds triage finals + Sonnet CSVs into raw_llm_txt.extracted_tables.prose (+ prose_source), joining by id-or-legacy_id and passing text through arrow_normalize.normalize_arrows. materialize_pk_text_clean.py then materializes the number-conserving intermediate txt.pk_text_clean from the three aligned variants built upstream by build_pk_text_variants.py (v1 pk_text, v2 pk_text_no_tables with [TABLE:Tn], v3 pk_text_clean), resolving every residual [TABLE:Tn] where inline placeholders restore the byte-identical original v1 span via recover_inline_spans(), appended ones are dropped, and flag='skip' tables collapse to SKIP_PROSE_SENTINEL, asserting the raw pk_text numbers are a subset of pk_text_clean numbers with zero [TABLE:] leaks. materialize_frozen_cleaned_pk_text.py produces the FINAL extraction-ready txt.frozen_cleaned_pk_text by assembling v2 + extracted_tables.(caption, prose, footnotes) per placeholder (skip becomes [TABLE OMITTED - NOT RELEVANT], prose becomes caption/prose/footnote, no-prose inline restores the raw span, appended is dropped), diverging from pk_text_clean by actually removing garbled table text wherever a reviewed/prosed replacement exists. qwen_excise_tables.py is the local-LLM sibling that helps the earlier locator place appended-tier tables the deterministic locator missed under the same LLM-proposes/deterministic-verifies rule, and placeholder_guard.py is the defense-in-depth detector both materializers run before writing model input.","blurb":"Stage S3 turns garbled/flattened PK tables into faithful English prose and folds that prose back into the label text so the downstream extractor reads clean, number-conserving input instead of numeric soup.","inputs":[["extracted_tables","db_table","s2"],["pk_text_variants","db_table","s2"]],"outputs":[["extracted_tables.prose","db_table"],["txt.frozen_cleaned_pk_text","db_table"]],"substeps":["prose_tables_sonnet / sonnet_rescue","add_prose_column (numbers conserved)","materialize_pk_text_clean --commit","materialize_frozen_cleaned_pk_text --commit"],"spine":["extracted_tables.prose","txt.pk_text_clean","txt.frozen_cleaned_pk_text"],"diagrams":["02_db_handoff_spine","01_end_to_end_flow"],"handoff_in":"From S2 (tables): rows arrive as raw_llm_txt.pk_text_variants (v1 pk_text, v2 pk_text_no_tables with [TABLE:Tn], v3 pk_text_clean, table_map JSON, safety_flags) joined to raw_llm_txt.txt on row_id, plus raw_llm_txt.extracted_tables (html_table, caption, footnotes, flag) linked via table_map \"Tn\" -> extracted_tables.id. Prose-author inputs also arrive as data/triage + data_mmpk/triage escalate/final CSVs keyed by extracted_tables id/legacy_id, and gold_annotation*/data/txt_enriched.jsonl keyed by row_id.","handoff_out":"To S4 (extraction): txt.frozen_cleaned_pk_text (FINAL extraction-ready text) and the intermediate txt.pk_text_clean, both keyed by txt.row_id - every [TABLE:Tn] resolved, no placeholder leaks, raw pk_text numbers a subset of clean numbers. extracted_tables.prose (keyed by extracted_tables.id, back-joined via pk_text_variants.table_map) is the cleaned-table column consumed by the materializers.","db_tables":[{"name":"raw_llm_txt.extracted_tables","mode":"read/write","writer_script":"add_prose_column.py (writes prose, prose_source); apply_review_skips.py (flag='skip', prose=SKIP_PROSE_SENTINEL)"},{"name":"raw_llm_txt.pk_text_variants","mode":"read","writer_script":"build_pk_text_variants.py (S2; read-only here)"},{"name":"raw_llm_txt.txt","mode":"read/write","writer_script":"materialize_pk_text_clean.py (writes pk_text_clean); materialize_frozen_cleaned_pk_text.py (writes frozen_cleaned_pk_text); pk_text read-only"}],"invariants":["Numbers conserved: materialize_pk_text_clean asserts the raw pk_text numbers are a subset of pk_text_clean numbers - every REAL raw number survives (STRICT tolerance 0 default; small unit-free integers waivable only under --ignore-noise via is_noise_number).","Sonnet/qwen = lead generator, deterministic code = source of truth: prose PASSes only if the number gate (sonnet_rescue.score / groundtruth) reproduces every extracted mock value; qwen spans must byte-exact-verify against pk_text before use, never guessed.","No [TABLE:Tn] ever leaks into final model input - both materializers run placeholder_guard.scan_text and print a '0 [TABLE:] leaks' acceptance gate before --commit.","Inline residual tables restore the byte-identical original v1 span (recover_inline_spans via v1/v2 alignment); appended tables are dropped (raw table was never inline in pk_text).","Skip sentinel single source of truth: apply_review_skips.SKIP_PROSE_SENTINEL='[TABLE OMITTED - NOT RELEVANT]' (bracket-wrapped, replacing ambiguous bare 'skipped'); its dropped numbers are intentional (skip_lost), excluded from num-loss.","Non-destructive + reversible: materializers only ADD columns (pk_text_clean / frozen_cleaned_pk_text); txt.pk_text never mutated (revert = DROP COLUMN). Dry-run by default; --commit required to write.","Single authoritative prose writer: extracted_tables.prose written ONLY by add_prose_column.py (triage 'done' wins over Sonnet); it does not re-locate or re-choose prose.","Train==inference prompt import: prose_tables_sonnet.py reuses sonnet_rescue.system_for verbatim so the whole-row and triage-escalate arms transform tables under identical rules.","frozen_cleaned_pk_text intentionally differs from pk_text_clean: it REMOVES garbled table text wherever a reviewed/prosed replacement exists (caption/prose/footnote), whereas pk_text_clean keeps the number-conserving raw fallback.","All assembled text is arrow/glyph normalized (normalize_arrows) on both sides so a glyph-to-char shift never reads as a false number loss; AMBIGUOUS_PUA_CODES are never auto-converted and are reported."],"godDoc":{"god_node":"llm_table_parse/materialize_frozen_cleaned_pk_text.py","why":"It writes the stage terminal output, txt.frozen_cleaned_pk_text, the FINAL single extraction-ready text the downstream extractor consumes. All upstream products converge here: pk_text_variants (v1/v2 + table_map + safety_flags) plus extracted_tables.(flag, caption, prose, footnotes), resolved per-placeholder into clean prose. It reuses the core resolver (recover_inline_spans, table_footprint) and the SKIP_PROSE_SENTINEL + placeholder_guard invariants, embodying the whole fold-prose-back-into-frozen-cleaned-text contract.","scripts":[{"file":"llm_table_parse/materialize_frozen_cleaned_pk_text.py","role":"God node: assembles FINAL txt.frozen_cleaned_pk_text from v2 + extracted_tables.(caption,prose,footnotes), removing garbled table text where a reviewed/prosed replacement exists.","key_functions":[{"name":"replacement_text","loc":"L66","does":"Per-table replacement: flag='skip' -> SKIP_PROSE_SENTINEL; else caption, prose body, footnotes (deduped via _append_unique); empty when no prose."},{"name":"assemble_variant","loc":"L87","does":"Resolves each [TABLE:Tn] in v2: prose->replacement, appended->drop, inline no-prose->byte-identical v1 span, else footprint fallback/drop; tallies counts."},{"name":"main","loc":"L146","does":"Loads extracted_tables+pk_text_variants+txt, assembles per row (raw pk_text fallback), normalize_arrows, placeholder_guard, --commit writes txt.frozen_cleaned_pk_text."}],"interacts_with":["materialize_pk_text_clean.recover_inline_spans","build_pk_text_variants.table_footprint","apply_review_skips.SKIP_PROSE_SENTINEL","placeholder_guard.scan_text","arrow_normalize.normalize_arrows","extracted_tables","pk_text_variants","txt"]},{"file":"llm_table_parse/materialize_pk_text_clean.py","role":"Materializes number-conserving intermediate txt.pk_text_clean (v3 with residual [TABLE:Tn] resolved); enforces raw numbers subset of clean numbers, 0 leaks.","key_functions":[{"name":"recover_inline_spans","loc":"L50","does":"Aligns v2 non-table segments (byte-identical substrings of v1) to recover each inline table's ORIGINAL v1 span; shared by frozen materializer."},{"name":"resolve","loc":"L82","does":"Per placeholder: inline->byte-identical v1 span (footprint fallback), appended->drop, skip_ids->SKIP_SENTINEL (numbers logged as intentional skip_lost)."},{"name":"main","loc":"L128","does":"Reads pk_text_variants+extracted_tables, resolves, checks REAL number loss (noise waiver optional), placeholder_guard, --commit writes txt.pk_text_clean."}],"interacts_with":["build_ lity verifier: table values must reappear in prose sentences; supplies numbers_in used across the rescue/scoring path.","key_functions":[{"name":"numbers_in","loc":"L28","does":"Parses multiset of numeric tokens, comma/point decimal folded (French strips thousands, comma->point)."},{"name":"check_table","loc":"L73","does":"Per-cell + global multiset coverage: FAIL if any structured Record value absent from its sentence; extra qualifier numbers are warnings only."}],"interacts_with":["clean.Record","sonnet_rescue.score","triage_core","compare.py"]},{"file":"llm_table_parse/placeholder_guard.py","role":"Detector-only defense-in-depth: flags leftover [TABLE:Tn] or retired bare 'skipped' before assembled text is written as model input; never edits text.","key_functions":[{"name":"scan_text","loc":"L42","does":"Returns hit dicts for unresolved_table_placeholder and/or legacy_skip_word; kinds narrows which to check."},{"name":"warn_hits","loc":"L58","does":"Prints one loud greppable warning per hit; non-raising."}],"interacts_with":["materialize_pk_text_clean.main","materialize_frozen_cleaned_pk_text.main","build_pk_text_variants"]},{"file":"llm_table_parse/apply_review_skips.py","role":"Marks owner-reviewed non-PK tables flag='skip' and stamps prose=SKIP_PROSE_SENTINEL='[TABLE OMITTED - NOT RELEVANT]', the single source of truth for the skip sentinel both materializers import.","key_functions":[{"name":"SKIP_PROSE_SENTINEL","loc":"L32","does":"The bracket-wrapped skip marker (replaced the ambiguous bare word 'skipped') spliced wherever a non-PK table is denoised."}],"interacts_with":["extracted_tables (flag,prose,prose_source)","materialize_pk_text_clean","materialize_frozen_cleaned_pk_text","placeholder_guard"]},{"file":"llm_table_parse/qwen_excise_tables.py","role":"Local qwen2.5 (Ollama) sibling proposing garbled-table spans the deterministic locator appended-tier missed; verifies byte-exact substring, reconciles to extracted_tables ids by numeric overlap, flags detec fix_auc_type_scope_and_add_auc_t_hours.py","gold_extraction::fix_dose_regimen_wrong_family_scope.py","gold_extraction::fix_sample_origin_scope.py","gold_extraction::migrate_event_shape_v5.py","gold_extraction::reextract_3_trunc.py","gold_extraction::reextract_changed.py","gold_extraction::reextract_sources.py","gold_extraction::remove_new_steady_state_field.py","gold_extraction::rename_source_note_to_verbatim_source.py","gold_extraction::reorder_to_canonical_template_order.py","gold_extraction::revert_auc_0_tau_collapse.py","gold_extraction::trim_header_metadata.py","gold_extraction::validate_verbatim_exactness.py","gold_extraction::verify_event_shape_v5_llm_redo.py","gold_extraction::_prose_remaining_priority18.py","gold_extraction::arms/assemble_input.py","gold_extraction::arms/build_shared_from_db_clean.py","gold_extraction::arms/build_sonnet_gold_hint.py","gold_extraction::arms/doctor.py","gold_extraction::arms/extract_qwen.py","gold_extraction::arms/import_nuextract3_cluster_results.py","gold_extraction::arms/nuextract_arm.py","gold_extraction::arms/nuner_spike/build_ner_spike_data.py","gold_extraction::arms/qwen_prose.py","gold_extraction::arms/render_html_table.py","gold_extraction::arms/score.py","gold_extraction::arms/set_sonnet_aside.py","gold_extraction::build_distillation_review_csv.py","gold_extraction::build_silver74_review_csv.py","gold_extraction::check_prompt_has_ddi_no_change.py","gold_extraction::cli_extract.py","gold_extraction::dbtable_rescue.py","gold_extraction::dump_sources.py","gold_extraction::event_shape_v5_packetize.py","gold_extraction::normalize_oldcorpus_to_v108_candidate.py","gold_extraction::recall_oracle.py","gold_extraction::span_verbatim_qa.py","gold_extraction::_redistribute_widenet_4way.py","gold_extraction::arms/nuner_spike/ner_spike.py","gold_extraction::audit_field_names.py","gold_extraction::build_deferred_table_candidates.py","gold_extraction::codex_pipeline_tools.py","gold_extraction::normalize_widenet_to_v108_candidate.py","gold_extraction::numeric_grounding_check.py","gold_extraction::progress_table.py","gold_extraction::round4_audit.py","gold_extraction::scratchpad_build_23847.py","gold_extraction::verbatim_note_reviewer.py"],"godModuleId":"llm_table_parse::materialize_frozen_cleaned_pk_text.py","featuredIds":["llm_table_parse::materialize_frozen_cleaned_pk_text.py","llm_table_parse::add_prose_column.py","llm_table_parse::sonnet_rescue.py","gold_extraction::prose_tables_sonnet.py","llm_table_parse::apply_review_skips.py"]},{"id":"s4","label":"Extract","repo":"pipeline","dir":"pk_new_nu_model_v*","resolved_dir":"pk_new_nu_model_v109","title":"NuExtract pass0 → pass4  →  ADME values + grounding/verify","hue":"#a78bfa","one_line":"S4 Extract: NuExtract pass0->pass4 turns frozen PK text into grounded/verified ADME values, now with excreted_as species labels and a gated ratio_to_parent[] surface","narrative":"Stage S4 is the core extractor: main.py's extract_single() (L991) drives one drug row from cleaned PK text (pk_text, sourced upstream from frozen_cleaned_pk_text) to a merged ADME value dict. It opens with combined Pass 0+1, passes/pass0.py detect_and_filter() (L930), which runs compound_detect() (L800) to build the compound roster and asks qwen2.5:32b (cfg.chat_model) via _detect_filter_system() (L915) to copy ADME-relevant sentences verbatim per compound, then grounding-checks the summary. In the default 'full' arm run_per_category_full() (L710) calls passes/pass1.py route_and_run_pass1() (L851) for scenario tagging + per-category verbatim slices with ContextTags envelopes, then passes/pass2_router.py nuextract_per_category() (L728) runs one NuExtract-2.0-8B (cfg.nuextract_model) call per (scenario x compound) via _extract_adme() (L528) / _extract_ddi_one() (L587); the always-on baseline arm passes/pass2.py nuextract_per_compound() (L899) is injected as the extract_json_ADME column. Every emitted value is validated against the Pydantic schema.py _PKV (L99) / _Compound (L531) models (PKV_FIELDS L591, 13 params, is the highest-degree node). Pass 3 passes/pass3.py grounding_check_counts() (L125) deterministically checks each number/quote is verbatim in the source, with _GR_VERBATIM (L116) forcing exact-substring match on verbatim_source/source_snippet and _GR_SKIP (L91) exempting derived enums like excreted_as; Pass 4 passes/pass4.py llm_verify_values() (L2033) has mistral-nemo:12b (cfg.verify_model) score each value 0..1 against a claim built by passes/verify_questions.build_claim() (L448), optionally pre-filtered by the deterministic field-topic guard _field_topic_mismatch_reason() (L686, cfg.field_topic_guard default OFF). Pass 4b correct_low_score_values() (L2575) re-extracts any value below cfg.correction_threshold using its own separate _FIELD_TEMPLATE_BASE (L2138) template. TWO NEW EXTRACTION SURFACES landed since 2026-07-18. excreted_as/excretion_note are per-value subfields on the three elimination PKVs only (urinary/fecal/biliary), shipped UNGATED inside prompts._ELIM_PKV (L632) — there is no cfg flag; they name WHICH SPECIES an elimination % refers to (unchanged|metabolites|total|unspecified), are value-anchored not clause-level, and are deterministically backstopped by schema.recover_excreted_as_from_source() (L2533) via the value-scoped parser parse_excreted_as() (L2492), called from main.py L873. ratio_to_parent[] is a standalone metabolite-only list on _Compound (L575), modelled by _RatioToParent (L499) with ratio/min_val/max_val/unit plus ratio_kind/parent_compound_key/study_condition/precision; it is DDI_LIST_FIELDS-shaped (L617), NOT a PKV field, gated by cfg.capture_ratio_to_parent (L383, default False) AND a compound_type metabolite gate (_is_metabolite_type, widened 2026-07-21 in pass2.py L586 / pass2_router.py L506), and is STATED-only — never computed by dividing two AUCs. Finally main.py unions values onto one compound per name and materializes per-value context/context_note/context_signature_key, and utils/export.py writes the input CSV/XLSX back in place plus a lossless *.extractions.jsonl resume sidecar, *_flat.csv (carrying _ELIM_EXTRA L52), and *.json feeding Stage 5 distillation and Stage 8 enrichment. A separate side entrypoint slice_only_extract.py (890 lines) runs Pass 0+1 -> Pass 1 -> Pass 2 ONLY, emitting one resumable JSONL record per (row_id, compound, category) slice for training/eval data; it never imports passes.pass4.","blurb":"Stage S4 is the core extractor: main.py's extract_single() (L991) drives one drug row from cleaned PK text (pk_text, sourced upstream from frozen_cleaned_pk_text) to a merged ADME value dict.","inputs":[["txt.frozen_cleaned_pk_text","db_table","s3"]],"outputs":[["extraction CSV / XLSX","file"],["*.extractions.jsonl","file"],["*_flat.csv · *.json","file"]],"substeps":["Pass 0+1 detect_and_filter (pass0:818)","Pass 2 nuextract_per_compound (pass2:668)","Pass 2-router per_category (pass2_router:634)","Pass 3 grounding_check_counts (pass3:115)","Pass 4 llm_verify_values (pass4:1844)","Pass 4b correct_low_score_values (pass4:2143)"],"spine":["extraction CSV/JSONL"],"diagrams":["03_pass0_4_flow","02_db_handoff_spine","01_end_to_end_flow"],"handoff_in":"Stage S3 delivers per-drug frozen cleaned PK text (pk_text / frozen_cleaned_pk_text) plus resolved identity (cid, unii, inchikey, drug_name) as CSV/XLSX rows keyed on row_id / id_row, with meta_source and db_source carried alongside; optionally a stored Pass 0+1 summary (pk_text_summary, detected_compounds, summary_done) from S4's own --phase summarise run, rehydrated from the *.extractions.jsonl sidecar rather than from a prior shard CSV.","handoff_out":"Stage S4 emits, per row_id, the merged extracted_dict JSON (compounds[] each with grounded+verified ADME PKV value lists carrying excreted_as/excretion_note on elimination values, an optional metabolite-only ratio_to_parent[] list, materialized context, _provenance and _pk_source_text) written to <csv>.json, a *_flat.csv, per-category extract_json_* columns in the CSV/XLSX, and the lossless *.extractions.jsonl sidecar keyed on row_id. These grounded/scored values feed Stage 5 (Sonnet distillation target), event_compiler.py's event rows, and Stage 8 (values to enrich). The side entrypoint slice_only_extract.py emits a PARALLEL, non-merged JSONL keyed on (row_id, compound_name, category) for slice-training/eval only — it never touches the normal export path or _OUTPUT_COLS.","db_tables":[{"name":"frozen_cleaned_pk_text (upstream text store, read as pk_text)","mode":"read","writer_script":"Stage S3 text pipeline (not in this stage)"},{"name":"input CSV/XLSX (row-store written back in place)","mode":"read/write","writer_script":"utils/csv_utils.write_csv (called from main.py extract_csv/summarise_csv)"}],"invariants":["Pass order is fixed: Pass 0+1 detect_and_filter -> Pass 1 route_and_run_pass1 -> Pass 2 (baseline nuextract_per_compound + router nuextract_per_category) -> Pass 3 grounding_check_counts -> Pass 4 llm_verify_values -> Pass 4b correct_low_score_values, then union+materialize (verified in run_per_category_full L710).","No hard-stripping: the full raw label text flows through Pass 0; qwen2.5:32b returns ADME-categorised verbatim, and both arms ground/verify against the full _original_pk_text.","The baseline nuextract_per_compound (extract_json_ADME) front-end is held CONSTANT across the full and baseline arms; only the enhanced router/verify machinery differs (ablation control).","ratio_to_parent[] is STATED-only. No code anywhere in the pipeline derives `ratio` — it may never be computed by dividing two independently-extracted AUC/Cmax PKVs (_RatioToParent docstring, schema.py L499; SCHEMA_v4_field_reference §5.3 'I-forbidden').","ratio_to_parent is metabolite-only and DOUBLE-gated: cfg.capture_ratio_to_parent (default FALSE) AND _is_metabolite_type(compound_type). The slot is only ever added to a metabolite-shaped template, never a parent one. _coerce_ratio_to_parent never INJECTS the key when absent, so the flag-OFF path stays byte-identical.","excreted_as is UNGATED — it ships inside prompts._ELIM_PKV (L632) and has no cfg flag. Its label is VALUE-anchored, not clause-level: one mass-balance sentence yields a different species per number it carries (25.3% of gold PKVs share clause text with a differently-labelled sibling). `unchanged` must never be inferred from the ABSENCE of a species statement; a bare number defaults to `total`.","excreted_as is in pass3._GR_SKIP (L102) because it is a controlled enum usually DERIVED by recover_excreted_as_from_source, not quoted — but excretion_note is deliberately NOT skipped and stays grounded as verbatim text.","Every new field must be wired end-to-end (pass0 retention -> pass2 + pass2_router templates -> schema -> pass3 grounding -> pass4 verify -> pass4b correction-retry template -> export) or its value is silently dropped. Pass 4b _correct_one_field uses its OWN _FIELD_TEMPLATE_BASE (L2138), separate from prompts.py.","A template slot with no worked few-shot demo is not reliably emitted by NuExtract (the v77 lesson) — hence both apply_excretion_species_example and _correction_retry_example_excretion. The latter is deliberately NAME-FREE because the EXAMPLE_DRUG few-shot leak into live verbatim_source (MASTER_TODO row 2501) is still open.","verbatim_source / source_snippet are checked by _GR_VERBATIM (L116) as an exact case-sensitive source substring, so Pass 0/2 must not translate, paraphrase, or correct evidence text.","slice_only_extract.py must never import passes.pass4 or call run_per_category_full — AST-proven in V108_CHANGES.md. Its dropped-verbatim sidecar is audit-only and never re-enters verbatim_slice, prompts, parsed JSON or any export. Malformed resume JSONL and duplicate resume keys abort loudly rather than silently skipping.","Table-sharding routes through run_baseline_arm (L915), which never runs Pass 4 at all — a known, separately-tracked limitation, not a bug in this stage.","An Ollama connection failure hard-halts the whole run (OllamaUnavailable, main.py L83) BEFORE the current row is written, so re-running the same command resumes from it; the lossless *.extractions.jsonl sidecar (not the truncatable xlsx) is the resume source of truth.","Per-value context/context_note/context_signature_key are materialized deterministically AFTER the per-category Pass 4 loop; the combination-product flag stays compound-level only and never enters the signature key."],"godDoc":{"god_node":"schema.py","why":"Highest-degree node: the Pydantic _PKV (L99) / _Compound (L531) ADME schema plus PKV_FIELDS (L591) and DDI_LIST_FIELDS (L617) is imported and iterated by every pass (pass2/pass2_router emit into it, pass3 grounds it, pass4 verifies/corrects it), by main.py (union/materialize/dedup loops), and by utils/export.py + eval. It also owns per-value context materialization (materialize_value_context L2946, context_signature_key L2798), the deterministic recover_*/derive_*/stamp_* backstops, and ExtractionRow (L3232, the row/output-column contract). Both new surfaces are defined here first: _RatioToParent (L499) and the excreted_as species parser (L2492/L2533). Changing a field here ripples through the whole stage, per HOW_TO_ADD_EXTRACTION_FIELDS.md.","scripts":[{"file":"main.py","role":"CLI entry (--phase summarise|extract) + single-row orchestrator; runs Pass 0->4b, unions/materializes values, fires the deterministic excreted_as / ratio_to_parent backstops","key_functions":[{"name":"extract_single","loc":"L991","does":"Single-row pipeline: clean text -> Pass 0+1 detect_and_filter -> baseline Pass 2 -> arm dispatch (full/baseline/table_shard) -> assemble ExtractionRow"},{"name":"run_per_category_full","loc":"L710","does":"Full arm: route_and_run_pass1 -> nuextract_per_category -> inject baseline ADME column -> per-category Pass 3/4/4b -> union+materialize"},{"name":"run_baseline_arm","loc":"L915","does":"Control arm: baseline NuExtract only + Pass 3 grounding (no router, no verify/correct). Table-sharding routes here, which is why it never runs Pass 4"},{"name":"recover_excreted_as_from_source call site","loc":"L867-875","does":"Ungated post-extraction backstop stamping excreted_as/excretion_note onto every urinary/fecal/biliary PKV NuExtract left blank"},{"name":"ratio_to_parent backstops","loc":"L876-885","does":"Runs stamp_ratio_to_parent_source + recover_parent_compound_key unconditionally; both no-op when ratio_to_parent[] is empty"},{"name":"_materialize_value_contexts","loc":"L402","does":"Writes full context, context_note and context_signature_key onto every PKV value after union"}],"interacts_with":["passes/pass0.py","passes/pass1.py","passes/pass2.py","passes/pass2_router.py","passes/pass3.py","passes/pass4.py","schema.py","config.py","utils/export.py"]},{"file":"schema.py","role":"God node: Pydantic ADME schema, PKV_FIELDS/DDI_LIST_FIELDS, the new _RatioToParent model + excreted_as species parser, per-value context materialization, ExtractionRow output contract","key_functions":[{"name":"_PKV","loc":"L99","does":"Per-value model: value/value_type/unit/range, verbatim_source, half_life_type, precision_type, concentration_dependent, auc_type, context_signature_key. excreted_as/excretion_note ride as extra keys on elimination PKVs"},{"name":"_RatioToParent","loc":"L499","does":"NEW metabolite-only STATED M/P ratio: ratio + min_val/max_val/unit (fold|%), ratio_kind, parent_compound_key, study_condition, precision. Never computed from two AUCs"},{"name":"PKV_FIELDS / DDI_LIST_FIELDS","loc":"L591 / L617","does":"13 canonical ADME params iterated by every pass; ratio_to_parent is registered in DDI_LIST_FIELDS (L625), NOT PKV_FIELDS, so it grounds via the DDI path"},{"name":"parse_excreted_as / recover_excreted_as_from_source","loc":"L2492 / L2533","does":"NEW value-anchored species parser: one clause can yield a different label per number it carries (total|unchanged|metabolites|unspecified). Idempotent, never overwrites an explicit value"},{"name":"stamp_ratio_to_parent_source / recover_parent_compound_key","loc":"L2603 / L2576","does":"Idempotent backstops: stamp provenance NuExtract is never asked to emit, and resolve a null parent_compound_key from the row's own roster"},{"name":"materialize_value_context / context_signature_key","loc":"L2946 / L2798","does":"Compound-default override merge into full ContextTags, plus the deterministic scenario+modifier hash used for dedup and the L2 encoder self-join"}],"interacts_with":["main.py","passes/pass2.py","passes/pass2_router.py","passes/pass3.py","passes/pass4.py","utils/export.py","prompts.py"]},{"file":"passes/pass0.py","role":"Pass 0+1: LLM compound detection + verbatim ADME-sentence filter (qwen2.5:32b), no hard-strip; now also builds the side-mode ratio_to_parent slice","key_functions":[{"name":"detect_and_filter","loc":"L930","does":"Combined Pass 0+1: compound_detect + verbatim per-compound filter -> working_text, per_compound_text, detected, grounding score. Adds per_compound_adme_text when cfg.expose_per_compound_adme_text is ON"},{"name":"compound_detect","loc":"L800","does":"LLM roster detection: parent, parent_type, metabolites, coactives, combination-product flag"},{"name":"_detect_filter_system","loc":"L915","does":"Builds DETECT_FILTER_SYSTEM prompt + gated addenda (_ACCUM_TTS_ADDENDUM, _VERBATIM_SOURCE_ADDENDUM), both now default-ON"},{"name":"augment_ratio_to_parent_slice","loc":"L724","does":"NEW sibling of augment_verbatim_from_source: admits only sentences naming BOTH this metabolite and its parent, carrying a numeric ratio cue, surviving the DDI + animal guards. Not a relaxation of the v79 single-owner guard"},{"name":"augment_verbatim_from_source","loc":"L664","does":"v78 lossless mode (cfg.verbatim_lossless, default OFF): recovers ADME sentences the filter LLM dropped so pass 2 still sees them"},{"name":"grounding_check_summary","loc":"L203","does":"Numeric-retention grounding of the verbatim summary vs raw source"}],"int
