the gold set, returning kept/dropped counts and the dropped id set (row 2501/posaconazole is the recorded leak the pool eval still excludes by hand)."},{"name":"main","loc":"L83","does":"Drives the trim across the distillation files, producing the *_trimmed*.jsonl names the priority18 configs point at."}],"interacts_with":["finetune/convert_sonnet_distillation_to_nuextract.py","finetune/sonnet_distillation_*_trimmed_verbatim.jsonl","wip_gold_claude_set.json"]}]},"moduleIds":["lora_training::train_lora.py","lora_training::plot_gen_eval.py","lora_training::score_all_params_v2.py","lora_training::audit_example_loss.py","lora_training::scripts/probe_lora_targets.py","lora_training::configs/real_run_armB_absorption_recall.yaml","lora_training::configs/default_nuextract2_lora.yaml","lora_training::configs/smoke_test_priority18_cali3.yaml","lora_training::scripts/bootstrap_cali3.sh","lora_training::README.md","lora_training::configs/real_run_armB_distribution_recall.yaml","lora_training::configs/real_run_armB_elimination_recall.yaml","lora_training::scripts/run_cali3_smoke.sbatch","lora_training::ARM_A_VS_ARM_B_TRAINING_RUNBOOK_20260722.md","lora_training::CLUSTER_DEPENDENCIES_RUNBOOK_20260721.md","lora_training::HANDOFF_20260718.md","lora_training::_pkg","lora_training::configs/real_run_priority18_cali3.yaml","lora_training::configs/smoke_test_priority18.yaml","lora_training::scripts/bootstrap_cali3_clone.sh","lora_training::scripts/bootstrap_wsl.sh","lora_training::scripts/check_cali3_env.sh","lora_training::LORA_FINETUNE_ORIENTATION_20260721.md","lora_training::INVESTIGATION_BRIEF_slice_outputs_20260721.md","lora_training::configs/smoke_test_priority18_summary_sliced.yaml","lora_training::scripts/check_env.sh","lora_training::finalize_run.py"],"godModuleId":"lora_training::train_lora.py","featuredIds":["lora_training::train_lora.py","lora_training::plot_gen_eval.py","lora_training::score_all_params_v2.py","lora_training::audit_example_loss.py","lora_training::scripts/probe_lora_targets.py"]},{"id":"s8","label":"Evaluate","repo":"lora_eval","dir":"lora_eval_cluster_bundle","resolved_dir":"lora_eval_cluster_bundle","title":"LoRA adapter → generate on hand gold → all-parameter F1 + arm comparison","hue":"#fbbf24","one_line":"Judge a fine-tuned LoRA adapter against the real hand gold: generate, marshal, score every PK parameter.","narrative":"The Evaluate stage judges a fine-tuned LoRA adapter (from S7) against the real 38-row hand gold, on the SAME prompt machinery training used so the number reflects the model, not prompt drift. `build_eval_prompts.py` (arm A) and `build_eval_prompts_armb.py` (arm B, slice-shaped) reconstruct the training prompt via `convert_synthgen_to_nuextract.build_compound_prompt` → `prompts.build_nuextract_prompt`. `run_eval_generation.py` loads NuExtract-2.0-8B in 4-bit, optionally applies the adapter, and greedy-decodes one completion per prompt on GPU — run once with `--adapter` (the fine-tuned arm) and once without (the stock baseline), so any delta is the adapter, not sampling. `merge_armb_predictions.py` unions arm B's three per-ADME-slice predictions back into one object per compound (mandatory: the scorer keeps one object per compound, so skipping the merge silently caps recall near a third), and `preds_to_armdir.py` marshals completions into `allparam_arms/<arm>/extract_<row_id>_*.json`. `score_all_params_v2.py` — the governed trio-v2 scorer and this stage's god node — then scores every PK parameter: each PKV is one comparable interval, item↔item matched within a tolerance, with a `--compound-aware` mode keying bags by (compound,param) versus the default row×param 'routed' mode (a different metric definition, never mixed). `split_gold_by_verdict.py` carves the gold into table- vs narrative-derived subsets and `score_by_dbsource.py` buckets by db_source — both reuse the scorer's own functions so the numbers match the headline. `soup_checkpoints.py` averages plateau checkpoints into one adapter, `build_oracle_manifest.py` builds the arm-E count-priming FLOOR manifest, and `verbatim_field_grounding.py` first-passes text-field grounding. The per-arm `out/*.json` score files this stage writes are exactly what the atlas Scoring view (arms.json / params.json / breakdowns.json) consumes.","blurb":"The Evaluate stage judges a fine-tuned LoRA adapter (from S7) against the real 38-row hand gold, on the SAME prompt machinery training used so the number reflects the model, not prompt drift.","inputs":[["final_adapter/ (PEFT LoRA)","artifact","s7"],["hand gold (wip_gold_claude_set.json)","file"]],"outputs":[["allparam_arms/<arm>/*_pred.json","file"],["out/*.json (P/R/F1 + by_param)","file"]],"substeps":["build_eval_prompts → NuExtract prompts per row/arm","run_eval_generation (adapter/stock) → predictions","preds_to_armdir / merge_armb_predictions → allparam_arms/","score_all_params_v2 (routed / compound-aware) → P/R/F1","score_by_dbsource / split_gold_by_verdict → breakdowns"],"spine":[],"diagrams":["08_evaluate_flow","01_end_to_end_flow"],"handoff_in":"From S7 Fine-tune: the trained final_adapter/ (PEFT LoRA + tokenizer) is loaded onto the 4-bit NuExtract-2.0-8B base by run_eval_generation.py; the hand gold (data/wip_gold_claude_set.json, keyed by row_id + compound) is the reference.","handoff_out":"A QA leaf — hands no data to a downstream pipeline stage (the terminal S9 flatten consumes S4's extraction, not this). Emits allparam_arms/<arm>/*_pred.json + out/*.json score files (per-arm P/R/F1 + by_param, keyed by arm + comparable_key); these feed the atlas Scoring view (arms.json / params.json / breakdowns.json).","db_tables":[],"invariants":["--exclude-rows 2501: row 2501 is in BOTH the training corpus AND the eval gold (a 1-row leak) — always excluded from a scored eval.","compound-aware vs routed (row×param) is a DIFFERENT metric definition, not a knob to average — the two full-gold lenses are separate comparable groups.","Eval sets are not mutually comparable (synthetic ~0.84–0.96 F1 vs real hand gold ~0.25–0.79); a cross-set delta is never presented as progress.","Arm B's three per-slice predictions MUST be merged before scoring or recall silently caps near one-third (merge_armb_predictions.py).","Eval prompts are built by the SAME builder as training/inference, so a number reflects the model, not prompt drift.","On a filtered-gold subset (category / db_source) precision is confounded — read RECALL."],"godDoc":{"god_node":"score_all_params_v2.py","why":"The one governed all-parameter scorer every arm routes through; it defines the headline metric (routed vs compound-aware), and score_by_dbsource + the dashboard import its functions to stay bit-identical to the headline.","scripts":[{"file":"score_all_params_v2.py","role":"Governed trio-v2 all-parameter scorer: one interval per PKV, item↔item tolerance match, routed vs compound-aware, misattribution + GMFE overlay.","key_functions":[{"name":"score_param","loc":"L248","does":"match one param's gold vs arm item bags within tol → tp/fp/fn (item or number granularity)"},{"name":"row_bags","loc":"L174","does":"bag a row's items by param; compound_aware keys by (compound,param) else row×param"},{"name":"align_compound_bags","loc":"L213","does":"name-aligner pairing gold and arm compounds before scoring (compound-aware mode)"},{"name":"gold_bag_canonical","loc":"L311","does":"collapse gold to canonical rep values so a subgrouped label counts once"},{"name":"misattributions","loc":"L334","does":"flag an unmatched arm value that matches gold under ANOTHER param (unit-gated)"},{"name":"find_arm_file","loc":"L373","does":"glob <arms-dir>/<arm>/extract_<row_id>_*.json — the per-arm predictions to score"}],"interacts_with":["allparam_arms/<arm>/*.json","the hand gold JSON","score_by_dbsource.py","build_dashboard.py"]},{"file":"run_eval_generation.py","role":"GPU stage: load NuExtract-2.0-8B 4-bit (+ optional LoRA adapter), greedy-decode one completion per prompt; run with/without --adapter for arm vs stock.","key_functions":[{"name":"main","loc":"L73","does":"load model+adapter, render + batch-generate, write predictions JSONL (resumable)"},{"name":"generate_batch","loc":"L171","does":"greedy decode (do_sample=False) a batch of prompts — reproducible, no sampling noise"},{"name":"load_done_keys","loc":"L58","does":"resume support: skip prompts already generated"}],"interacts_with":["final_adapter/ (from s7)","eval prompts JSONL","predictions JSONL"]},{"file":"build_eval_prompts.py","role":"Arm A: one prompt per (gold row × compound) via the SAME builder training + live inference use, so eval measures the model not prompt drift.","key_functions":[{"name":"main","loc":"L50","does":"emit one prompt per (row,compound) through build_compound_prompt → build_nuextract_prompt"},{"name":"load_csv_rows","loc":"L39","does":"load the gold rows the prompts are built from"}],"interacts_with":["convert_synthgen_to_nuextract.build_compound_prompt","prompts.build_nuextract_prompt"]},{"file":"build_eval_prompts_armb.py","role":"Arm B: slice-shaped prompts that reproduce the arm-B TRAINING prompt exactly (FIELD_GROUP_* templates, no vsrc, no few-shot) so eval isn't measuring a train/infer mismatch.","key_functions":[{"name":"build_gold_alias_map","loc":"L118","does":"map slice compound names to gold compounds via paren/salt variants"},{"name":"resolve_compound","loc":"L161","does":"pick the right gold compound for a slice by field-count rule"}],"interacts_with":["prompts.FIELD_GROUP_ABSORPTION/_DISTRIBUTION/_ELIMINATION","finetune/build_armB_slice_training.py","build_oracle_manifest.py (--manifest)"]},{"file":"merge_armb_predictions.py","role":"Union arm B's three per-ADME-slice predictions into ONE object per compound — mandatory, or the scorer keeps only the last and recall caps near a third.","key_functions":[{"name":"parse_completion","loc":"L80","does":"parse a generation completion JSON string into an object"},{"name":"_salvage_json","loc":"L42","does":"recover a truncated/dirty completion into valid JSON"},{"name":"main","loc":"L110","does":"group the 3 slice predictions per compound and union their families"}],"interacts_with":["preds_to_armdir.py","score_range_capture.py"]},{"file":"preds_to_armdir.py","role":"Turn a prediction JSONL into the per-row export dir the scorer globs (one file per row_id, {compounds:[...]}).","key_functions":[{"name":"main","loc":"L28","does":"parse each completion, group by row_id, write allparam_arms/<arm>/extract_<row_id>_*.json"}],"interacts_with":["score_all_params_v2.find_arm_file"]},{"file":"split_gold_by_verdict.py","role":"Carve the hand gold into table-derived / narrative-derived subsets by each item's owner_verdict; the scorer reads the filtered gold unmodified.","key_functions":[{"name":"filter_row","loc":"L26","does":"keep only the row's items matching the chosen mode (table/narrative/all)"},{"name":"_is_table","loc":"L18","does":"an item is table-derived iff owner_verdict looks like a table id (NNNN#…)"},{"name":"main","loc":"L47","does":"write out/gold_table.json (or gold_narrative.json) for the scorer's --gold"}],"interacts_with":["score_all_params_v2.py (--gold)","out/gold_table.json"]},{"file":"score_by_dbsource.py","role":"Per-db_source breakdown reusing score_all_params_v2's EXACT functions so numbers match the headline; read RECALL (subset precision confounded).","key_functions":[{"name":"fam","loc":"L14","does":"collapse SmPC section variants into one db_source family"},{"name":"main","loc":"L27","does":"bucket each gold row by db_source and score each bucket via the imported scorer"}],"interacts_with":["score_all_params_v2 (row_bags/find_arm_file/score_param)","data/gold39_row_source.json"]},{"file":"soup_checkpoints.py","role":"Elementwise-average the LoRA adapters of several plateau checkpoints of ONE run into a single soup adapter (CPU tensor math).","key_functions":[{"name":"load_adapter","loc":"L38","does":"load a checkpoint's LoRA safetensors"},{"name":"main","loc":"L50","does":"mean the adapter tensors across checkpoints → checkpoint-soup adapter"}],"interacts_with":["run_eval_generation.py (--adapter)"]},{"file":"build_oracle_manifest.py","role":"Rebuild the arm-E count-priming manifest across ALL count-prime families; emits a FLOOR ('at least N') directive, never an exact target.","key_functions":[{"name":"alias","loc":"L42","does":"canonicalize a param name for the manifest"},{"name":"main","loc":"L46","does":"for each (table_id,compound,param) with a table value, emit the true count as a floor"}],"interacts_with":["build_eval_prompts_armb.py (--manifest)","out/gold_table.json"]},{"file":"eval_abc_gold39.sh / eval_pool_armB.sh / eval_specialists_gold39.sh","role":"Cluster orchestrators wiring the generate → merge → marshal → score chain per arm (shell, so not a graph node).","key_functions":[],"interacts_with":["run_eval_generation.py","merge_armb_predictions.py","preds_to_armdir.py","score_all_params_v2.py"]}]},"moduleIds":["lora_eval::score_all_params_v2.py","lora_eval::run_eval_generation.py","lora_eval::build_eval_prompts.py","lora_eval::build_eval_prompts_armb.py","lora_eval::merge_armb_predictions.py","lora_eval::preds_to_armdir.py","lora_eval::split_gold_by_verdict.py","lora_eval::score_by_dbsource.py","lora_eval::soup_checkpoints.py","lora_eval::build_oracle_manifest.py","lora_eval::convert_synthgen_to_nuextract.py","lora_eval::review_sheets/README.md","lora_eval::ALLPARAM_COMPARISON_20260723.md","lora_eval::eval_specialists_gold39.sh","lora_eval::EVAL_RESULTS_armAB_20260723.md","lora_eval::config.py","lora_eval::convert_sonnet_distillation_to_nuextract.py","lora_eval::score_range_capture.py","lora_eval::adapt_stock_export_to_preds.py","lora_eval::prompts.py","lora_eval::review_sheets/winner_review_audit_summary_20260730.md","lora_eval::review_sheets/reslice_eval_review_20260730.md","lora_eval::analyze_range_vs_value_20260723.py","lora_eval::csv_encoding.py","lora_eval::variability_compiler.py","lora_eval::view_eval.py","lora_eval::autotag_gold_table_verdict.py","lora_eval::export_gold39_tables.py","lora_eval::sync_owner_verdict_from_review.py","lora_eval::verbatim_field_grounding.py"],"godModuleId":"lora_eval::score_all_params_v2.py","featuredIds":["lora_eval::score_all_params_v2.py","lora_eval::run_eval_generation.py","lora_eval::build_eval_prompts.py","lora_eval::build_eval_prompts_armb.py","lora_eval::merge_armb_predictions.py","lora_eval::preds_to_armdir.py","lora_eval::split_gold_by_verdict.py","lora_eval::score_by_dbsource.py","lora_eval::soup_checkpoints.py","lora_eval::build_oracle_manifest.py"]},{"id":"s9","label":"Enrich & flatten","repo":"prototype_silver","dir":"prototype silver set","resolved_dir":"prototype silver set","title":"silver merge → identity gate → reference fan-out → ML tables","hue":"#a3e635","one_line":"Merge extractor outputs, gate identity by reliability tier, fan out to reference DBs, flatten to ML CSVs","narrative":"Stage S9 is the final \"enrich & flatten\" stage: it takes the compiled extractor outputs and turns them into identity-resolved, ML-ready flat tables. It begins outside the driver with build_silver_merged.py, which reads gold_extraction_pipeline/outputs/compiled/compiled_*.json (each file already carries parsed.compounds = raw ADME and compiler_minted = the event view) and merges them per drug into silver_merged.json keyed by row_id, deliberately leaving each compound's identity:{} empty and parking event-compounds absent from the parsed roster into orphan_ddi_compounds (needs_id_inference). enrich_identity.py is then run as a re-runnable post-processor on silver_merged.json, filling drug-level cid/unii/drugbank from raw_llm_txt.txt by row_id and per-compound identity from raw_llm_txt.compound_identity matched by (row_id, compound_name) so a metabolite gets its OWN id and never inherits the parent's; a resolver_tier>=3 (REJECT_TIER_GE) gate drops fuzzy substring matches (e.g. Kaftrio TEZ->bortezomib) to honest-NULL, maps/identity_overrides.csv (or the DB mirror) wins per field, and French RCP rows fall back through rcp_principal_identity by name. driver.py then runs the pipeline package: step1_roster explodes silver_merged.json into work/records.jsonl + work/compound_roster.jsonl (minting external_ddi/orphan mentions), step2_resolve_ids resolves each mention's identity through db.py's DbResolver.resolve_identity (whose SQL applies the same resolver_tier<=max_tier=2 reliability gate at ~L124/L140), writing work/ids.jsonl. step3_compound_master.py is the reference-DB fan-out and identity-merge engine: for every mention it probes pchem_roadmap (compound_master/physchem/conformers_3d/compound_xrefs), pharmacologie_fda, drugbank, chemoinfo, comptox and hmdb, then deduplicates mentions into cmp_NNNNN compound_master rows using stereo-safe exact-id keys (full InChIKey/CID before connectivity skeleton) and writes compound_master.csv, compound_xref.csv and work/compound_lookup.json. steps 4/5/6 flatten the events into adme_parameters, population_arms/exposure_comparison_arms and ddi_arms (joining compound_ids via lookup_compound_id and standardizing units/populations/parameters through pipeline/common.py helpers), step7_canonical_map harvests unmapped free-text, and step10_ml_dataset.py assembles the four label-ready ML tables under out/ml/ plus a next_action_worklist. pipeline/common.py is the shared plumbing every step imports; missing identity/structure/physchem is always emitted as honest-NULL with *_source and confidence columns rather than fabricated.","blurb":"Stage S9 is the final \"enrich & flatten\" stage: it takes the compiled extractor outputs and turns them into identity-resolved, ML-ready flat tables.","inputs":[["extraction values","file","s4"],["compound_identity","db_table","s1"]],"outputs":[["silver_merged.json","file"],["out/ml/*.csv (label_ready)","file"]],"substeps":["build_silver_merged","enrich_identity (row_id join)","resolver_tier ≤ 2 gate (db:140)","step3_compound_master fan-out","step4/5/6 → step10 ml/*.csv"],"spine":[],"diagrams":["05_identity_reliability_gate","07_db_id_crosswalk","01_end_to_end_flow"],"handoff_in":"From S7: gold_extraction_pipeline/outputs/compiled/compiled_*.json (and deferred/) — each file already carries BOTH layers (parsed.compounds = raw ADME, compiler_minted = event view). build_silver_merged.py joins them by the compiled record's row_id (str(d['row_id'])), producing silver_merged.json keyed by row_id. The driver's own input_json (config paths.input_json = silver_merged.json) then enters step1 keyed by that same row_id.","handoff_out":"To downstream ML/PBPK: out/ml/*.csv label tables (ml_adme_labels, ml_population_effect_labels, ml_ddi_effect_labels, ml_compound_features) plus out/{adme_parameters,population_arms,ddi_arms,compound_master,compound_xref}.csv/.parquet. Join keys: compound_id (cmp_NNNNN, minted in step3 and propagated via work/compound_lookup.json by_row_name '{row_id}|{norm_name(compound_name)}' and by_global_name), the source drug row_id/drug_id, and per-value param_row_id/pop_arm_id/ddi_arm_id; label_ready + next_action flags mark which rows are training-ready vs curation to-dos. Scope is asserted against scope_manifest.json via out/coverage_stats.json.","db_tables":[{"name":"raw_llm_txt.txt","mode":"read"},{"name":"raw_llm_txt.compound_identity","mode":"read"},{"name":"raw_llm_txt.identity_overrides","mode":"read"},{"name":"raw_llm_txt.rcp_principal_identity","mode":"read"},{"name":"pchem_roadmap.compound_master","mode":"read"},{"name":"pchem_roadmap.physchem","mode":"read"},{"name":"pchem_roadmap.compound_xrefs","mode":"read"},{"name":"pchem_roadmap.conformers_3d","mode":"read"},{"name":"pchem_roadmap.ddi","mode":"read"},{"name":"pharmacologie_fda.substance_strucres_and_moieties","mode":"read"},{"name":"pharmacologie.drugbank_extracted","mode":"read"},{"name":"pharmacologie.chemoinfo_extracted","mode":"read"},{"name":"comptox.tox_drug_id","mode":"read"},{"name":"hmdb.main_hmdb","mode":"read"},{"name":"drug_ncats.targets","mode":"read"},{"name":"pubchem.drug_infos_long","mode":"read"}],"invariants":["RELIABILITY GATE (resolver_tier): compound_identity rows with resolver_tier>=3 are fuzzy substring false positives (Kaftrio TEZ->bortezomib, IVA->bivalirudin) and are DROPPED to honest-NULL. Enforced twice: enrich_identity.py REJECT_TIER_GE=3 (L40, L192-195) and db.py DbResolver.resolve_identity max_resolver_tier=2 (config id_resolution.max_resolver_tier=2; SQL at L124-126 row-exact and L140 name-fallback).","METABOLITE-NO-INHERIT (v83 H2): a metabolite gets its OWN identity from compound_identity matched per (row_id, compound_name); it NEVER inherits the parent drug's cid/unii. enrich_identity.py L187-216; step3 L464-469 also nulls a parent link on a row whose role is itself parent (N6 guard).","HONEST-NULL, never fabricate: every DB helper returns None/[] on failure and downstream emits NULL + a *_source/identity_source/confidence note rather than a guessed id (db.py module docstring; step3 id_source='unresolved').","identity is a metadata plane attached DOWNSTREAM, not extracted: build_silver_merged.py leaves compound.identity={} on purpose (L137); enrichment is a separate re-runnable post-processor.","OVERRIDES ARE AUTHORITATIVE and durable: maps/identity_overrides.csv (or raw_llm_txt.identity_overrides DB mirror) and compound_aliases id columns WIN per-field over DB-resolved values; the pipeline never writes maps/, so they survive every rebuild.","STEREO-SAFE dedup: dedup_key and _consolidate_by_shared_identity merge on full InChIKey / CID / UNII (stereo-specific) BEFORE the connectivity-only inchikey_skeleton, so enantiomers (citalopram/escitalopram, amlodipine/levamlodipine) are never merged (step3 L72-84, L162-209).","DETERMINISTIC merges: PubChem UNII-section pick and cid->UNII load ORDER BY cid,value so a CID with >1 UNII resolves reproducibly across runs (step3 L227-230).","ORPHAN parking: an event-compound absent from the parsed roster is NOT merged as a tracked compound; it goes to orphan_ddi_compounds with needs_id_inference=true (build_silver_merged.py L142-150).","STRICT label_ready: ML labels require numeric normalized/effect values plus compound features; a censored bound (threshold_op gt/lt) blocks label_ready so a >99 can't ship as an exact point (step10 L295-299).","next_action is REPORTER-ONLY (LOCKED v99 vocab RESOLVE_IDENTITY/CONFIRM_UNIT); it never changes label_ready/missing_reason/any value (step10 L161-198).","RELIABILITY guards fail LOUD before mutating: assert_db_reachable refuses a DB-dependent run when MariaDB is down (avoids silent 141/0-xref builds unless --offline), assert_work_fresh refuses a partial run against a work/ cache built from a different input_json sha, assert_scope fails on out/ row-count collapse/>20% drift vs scope_manifest.json (common.py L549-683)."],"godDoc":{"god_node":"pipeline/common.py","why":"Highest-degree node of the stage: imported by driver.py and every pipeline step (and by db.py). It centralizes config load/paths (load_config, pth, ensure_dirs), all table IO (write_table emitting CSV+parquet, read_jsonl/write_json), the canonicalizers used by the flatten steps (norm_name, standardize_unit, canonical_parameter, canonical_population, ratio_from_endpoint, extract_targets, lookup_compound_id) and the three reliability guards (assert_db_reachable, assert_work_fresh, assert_scope) that enforce the stage's honesty/scope invariants. Nothing in the stage runs without it.","scripts":[{"file":"build_silver_merged.py","role":"Stage entry (pre-driver): merges the two layers of each compiled_*.json (parsed.compounds raw ADME + compiler_minted events) into silver_merged.json keyed by row_id, identity left {} on purpose, orphan event-compounds parked.","key_functions":[{"name":"(module main loop)","loc":"L111-164","does":"Globs compiled outputs, builds per-drug records with compounds[{raw_adme,events,identity:{}}] and orphan_ddi_compounds, writes silver_merged.json + silver_example_2875.json."},{"name":"_db_source_for","loc":"L28","does":"Corrects db_source from raw_llm_txt.txt by row_id (the compiled JSON's source_txt is wrong), offline regex fallback (RCP/FDAlabels/SmPC_*/EMA)."},{"name":"load_meta_sources","loc":"L72","does":"Batch-fetches meta_source for the row_ids from raw_llm_txt.txt (falls back to {} offline)."},{"name":"nested_meta_source","loc":"L59","does":"Extracts meta_source from nested meta/source/metadata blocks of a compiled record."}],"interacts_with":["gold_extraction_pipeline/outputs/compiled/*.json","raw_llm_txt.txt","silver_merged.json","enrich_identity.py"]},{"file":"enrich_identity.py","role":"Re-runnable post-processor filling identity into silver_merged.json - drug-level from txt, per-compound from compound_identity (metabolite-no-inherit), tier>=3 gated to honest-NULL, overrides win, RCP name-fallback.","key_functions":[{"name":"run","loc":"L116","does":"Loads txt/compound_identity/identity_overrides/rcp_principal_identity for the row_ids and rewrites each record's drug-level cid/unii/drugbank_id + per-compound identity; --apply backs up to .bak_pre_identity."},{"name":"(per-compound gate)","loc":"L187-216","does":"Metabolite-no-inherit: matches identity by (row_id, compound_name); drops resolver_tier>=REJECT_TIER_GE(3) rows (Kaftrio TEZ->bortezomib) so unresolved stays {}, override per-field cascade over the gated DB row."},{"name":"load_overrides_db","loc":"L95","does":"Reads raw_llm_txt.identity_overrides as the runtime SoT for overrides."},{"name":"load_overrides","loc":"L75","does":"CSV fallback for maps/identity_overrides.csv when the DB table is absent; overrides AUTHORITATIVE and survive rebuilds."}],"interacts_with":["silver_merged.json","raw_llm_txt.txt","raw_llm_txt.compound_identity","raw_llm_txt.identity_overrides","raw_llm_txt.rcp_principal_identity","maps/identity_overrides.csv"]},{"file":"db.py","role":"MariaDB resolver layer (DbResolver) for the driver pipeline; offline-safe (returns None/[] on failure) carrying the resolver_tier reliability gate plus every reference-DB probe.","key_functions":[{"name":"DbResolver.resolve_identity","loc":"L100","does":"Resolves (row_id,name) against raw_llm_txt.compound_identity; RELIABILITY GATE drops resolver_tier>max_tier(default 2) - row-exact check L124-126, global-name SQL clause L140 'AND (resolver_tier IS NULL OR resolver_tier <= %s)'."},{"name":"fetch_pchem_master","loc":"L155","does":"Probes pchem_roadmap.compound_master by unii/cid/chembl/drugbank/inchikey/name, stamping pchem_match_method."},{"name":"fetch_physchem","loc":"L194","does":"Fetches pchem_roadmap.physchem by internal_id/molregno, preferring source='chembl'."},{"name":"fetch_fda_structure","loc":"L260","does":"Pulls SMILES/molfile/MW from pharmacologie_fda by UNII, preferring component_type='PARENT'."},{"name":"fetch_drugbank/fetch_chemoinfo/fetch_comptox_identity/fetch_hmdb","loc":"L284/L320/L354/L387","does":"Reference-DB fan-out probes into drugbank_extracted, chemoinfo_extracted, comptox.tox_drug_id, hmdb.main_hmdb, each stamping a *_match_method."},{"name":"resolve_target","loc":"L423","does":"Resolves a DDI target label to drug_ncats.targets then pchem_roadmap.ddi, returning an unresolved honest-NULL row if neither hits."}],"interacts_with":["pipeline/common.py (norm_name)","pipeline/step2_resolve_ids.py","pipeline/step3_compound_master.py","pipeline/step6_ddi_arms.py","raw_llm_txt.*","pchem_roadmap.*","pharmacologie_fda","pharmacologie","comptox","hmdb","drug_ncats"]},{"file":"driver.py","role":"Orchestrator: loads config.yaml, runs the ordered STEPS, fires the pre-run reliability guards (DB reachability, map restore, work-freshness) and post-run scope assertion.","key_functions":[{"name":"main","loc":"L58","does":"Selects enabled steps, calls assert_db_reachable/restore_maps_if_missing/assert_work_fresh, imports+runs each step's run(cfg), stamps input manifest after step1, then assert_scope after step8."}],"interacts_with":["config.yaml","pipeline/common.py","sync_maps.py","all pipeline/step*.py","scope_manifest.json"]},{"file":"pipeline/step1_roster.py","role":"Explodes silver_merged.json into work/records.jsonl + work/compound_roster.jsonl, minting one mention per compound plus external_ddi (named perpetrators) and orphan mentions.","key_functions":[{"name":"run","loc":"L40","does":"Reads input_json, emits records.jsonl + compound_roster.jsonl keyed by mention_id; driver then write_input_manifest to bind work/ to this input."},{"name":"role_class","loc":"L8","does":"Classifies a mention as external_ddi/metabolite/combo_member/parent from compound_type+role+source_kind."},{"name":"roster_row","loc":"L20","does":"Builds a mention row carrying row_id, drug, db_source, meta_source, parent_compound_name, needs_id_inference."}],"interacts_with":["silver_merged.json","work/records.jsonl","work/compound_roster.jsonl","pipeline/common.py"]},{"file":"pipeline/step2_resolve_ids.py","role":"Resolves each roster mention's identity through DbResolver (gated) and applies owner-curated compound_aliases id overrides, writing work/ids.jsonl.","key_functions":[{"name":"run","loc":"L30","does":"Per mention: alias name-remap, resolver.resolve_identity (skip drug_class/product/ignore), copy ID_FIELDS, then alias_identity_overrides (AUTHORITATIVE, resolver_tier=1/confidence=1.0); writes ids.jsonl."}],"interacts_with":["work/compound_roster.jsonl","work/ids.jsonl","db.py (DbResolver)","maps/compound_aliases.csv","pipeline/common.py"]},{"file":"pipeline/step3_compound_master.py","role":"Reference-DB fan-out + stereo-safe identity merge: enriches every mention from all reference DBs, dedups into cmp_NNNNN compound_master rows, emits compound_master/compound_xref + work/compound_lookup.json.","key_functions":[{"name":"run","loc":"L352","does":"Enriches ids.jsonl mentions via all DbResolver.fetch_* probes, groups by dedup_key -> fold twins -> consolidate by shared exact id, mints cmp_ ids, writes compound_master/compound_xref + compound_lookup.json + compound_enriched.jsonl."},{"name":"dedup_key","loc":"L72","does":"Stereo-safe merge key: full InChIKey then CID BEFORE connectivity inchikey_skeleton (never merges enantiomers), name-only last."},{"name":"_consolidate_by_shared_identity","loc":"L162","does":"Union-find merge of groups sharing an exact CID/InChIKey/UNII across any enrichment block (folds the 2 tacrolimus UNIIs, EN+FR ciclosporin)."},{"name":"merge_group","loc":"L241","does":"Collapses a group into one master row, picking canonical UNII from the PubChem UNII-section (unii_alt keeps the displaced one) and cascading physchem/structure across sources with *_source provenance."},{"name":"_load_pubchem_unii_section","loc":"L212","does":"Deterministic cid->canonical UNII from pubchem.drug_infos_long (ORDER BY cid,value)."},{"name":"(parent-link honesty)","loc":"L464-469","does":"Assigns parent_compound_id after all cmp ids exist and nulls a parent link on a row whose own role is parent (N6 round-5 guard)."}],"interacts_with":["work/ids.jsonl","db.py","pchem_roadmap.*","pharmacologie_fda","pharmacologie","comptox","hmdb","pubchem.drug_infos_long","out/compound_master.*","out/compound_xref.*","work/compound_lookup.json"]},{"file":"pipeline/step4_adme_params.py","role":"Flattens raw_adme values from work/records.jsonl into out/adme_parameters, standardizing units/parameters/populations and joining compound_ids via compound_lookup.json.","key_functions":[{"name":"run","loc":"L94","does":"Reads records.jsonl + compound_lookup.json, standardizes each value (unit factor, canonical parameter, population_id, fed_state, value_type/precision), writes adme_parameters + UNMAPPED_units/populations."}],"interacts_with":["work/records.jsonl","work/compound_lookup.json","maps/units.csv","maps/parameters.csv","maps/population_scenarios.csv","out/adme_parameters.*","pipeline/common.py"]},{"file":"pipeline/step5_population_arms.py","role":"Flattens population/exposure comparison events into out/population_arms and out/exposure_comparison_arms, computing ratio_vs_baseline.","key_functions":[{"name":"run","loc":"L124","does":"Reads records.jsonl + compound_lookup.json, builds population arm rows (scenario_id, direction, magnitude, ratio_vs_baseline via ratio_from_endpoint) and exposure comparison rows."}],"interacts_with":["work/records.jsonl","work/compound_lookup.json","out/population_arms.*","out/exposure_comparison_arms.*","pipeline/common.py"]},{"file":"pipeline/step6_ddi_arms.py","role":"Flattens drug_drug_interaction events into out/ddi_arms, resolving victim/perpetrator compound_ids, perpetrator role/enzyme/transporter and DDI targets.","key_functions":[{"name":"run","loc":"L81","does":"Reads records.jsonl + compound_lookup.json, extracts victim/perpetrator/target tokens (extract_enzyme/extract_targets, resolve_target), computes ratio, writes ddi_arms."}],"interacts_with":["work/records.jsonl","work/compound_lookup.json","db.py (resolve_target)","maps/compound_aliases.csv","maps/target_aliases.csv","out/ddi_arms.*","pipeline/common.py"]},{"file":"pipeline/step10_ml_dataset.py","role":"Assembles the four label-ready ML tables (compound features + adme/population/ddi effect labels) under out/ml/ and the next_action curation worklist; strict label_ready gating.","key_functions":[{"name":"run","loc":"L492","does":"Reads compound_master + adme/population/ddi tables, builds ML tables, writes out/ml/*.csv + ml_dataset_summary.json + ML_DATASET.md + next_action_worklist."},{"name":"build_features","loc":"L234","does":"Per-compound ml_feature_ready = has_structure AND has_physchem; emits RESOLVE_IDENTITY next_action when cid+unii+inchikey all NULL (reporter-only)."},{"name":"build_adme_labels","loc":"L271","does":"Per-value label with strict label_ready (numeric standardized value/range + unit + compound_features + no censored bound), carrying source_tier and CONFIRM_UNIT next_action."},{"name":"build_ddi_labels","loc":"L419","does":"DDI effect labels requiring vi  approximate-review reconciliations. Purpose is pass0/vsrc evidence comparison, not blind model scoring.","source_line":3118}],"notes":["THE TWO GROUPS ARE NOT COMPARABLE. Synthetic sets (seed_777/seed_888/retriage_136/granularity_eval15/auc_focus) are scored by evaluate_full.py against a generated gold and land at F1 0.84-0.95. The real hand-gold sets (25/26/39-row) are scored by score_trio_vs_gold.py with value-level (value,unit) matching and land at F1 0.25-0.39. Different scorer, different matching semantics, different gold. Never plot them as one continuous series.","Even within the real-gold group, arms differ structurally: the v107 retest rows run the full router + verify/correct path, while table_shard and baseline_control use run_baseline_arm() (single-pass, no router, no Pass 4). The ledger explicitly says those are not comparable to each other.","Event-layer runs (v85/v89/v87-followup) score composed EVENTS by (event_type, owner_compound) against a 38-event frozen gold — a third, separate metric.","Grounding-diagnostic runs (NuExtract-3 vision and TEXT arms) report grounded-value RATES or raw COUNTS, not gold P/R/F1. An over-extractor scores higher on counts. Do not chart them against F1.","Where the master table and the per-version detail disagree, the more precise value was chosen per row and the conflict is disclosed in that run's key_move: v65.1 uses the detail L1-PKV figures (0.9586/0.765/0.851), while v77 keeps the incl-DDI master-table figures (0.953/0.897/0.924) with its overall_pkv numbers named in key_move.","v71-Slice04 (field-group recovery) FAILED its A/B (+32 FP for +1 TP) and was SHELVED in a git stash, never committed.","The 25-row and 39-row stock baselines (F1 0.357 and 0.292) plus the verify-OFF 0.247 were later declared KNOWN-STALE: a pass4.py retry-accept bug minted ungrounded phantoms and a score_trio_vs_gold.py bug double-counted range bounds (one hallucinated range could become 5 scored tuples).","The v108-prep verify-OFF run is 33 rsion, the last differs by both scorer and pipeline (pass4 fix + rebuilt input text). Never compare across those keys.","table_shard / baseline_control run through run_baseline_arm() (single-pass NuExtract + Pass 3 grounding only, no router, no Pass 4). The ledger states explicitly they are NOT comparable to the v107-retest or v108-prep numbers, which use run_per_category_full(). Separate comparable_key enforced.","The v108-prep verify-OFF run is 33 rows, the v107 retest is ~38-39 rows. The ledger calls them the closest apples-to-apples comparator but they are NOT identical conditions, so they carry different comparable_keys here. Treat the 0.304 -> 0.305 comparison as the ledger's own qualified reading, not a same-key head-to-head.","EN and FR are separate arms by ledger warning: eval_combined.json deduplicates on drug_name, so EN+FR sharing 30 names collapses to EN only (n_drugs_matched=30 not 60). The 4-arm model-replacement benchmark ran 30 EN + 30 FR per arm but only EN precision CIs are recorded in the ledger; no FR numbers appear. The trio-scorer 26-row gold is 16 EN / 10 FR and per-language P/R/F1 lives in UPDATED_SCORES_FOR_SLIDES_20260710.md, NOT in this ledger.","Qwen14B and Mistral7B ran in the 2026-06-18 4-arm benchmark but the ledger records no numeric result for them; their rows are placeholders with all metrics null.","NuExtract-3 vision/text numbers are GROUNDING RATES and GROUNDED-VALUE COUNTS, not gold-scored P/R/F1. The ledger warns an over-extractor scores higher on counts, and that the only metric comparable across single-shot NX3 vs the v88 multi-cell pipeline is the grounding RATE, not raw counts. These can never be plotted as F1.","Trio-scorer absolutes are PROVISIONAL: gold_fair_pruned.json is 26 rows with only 3 'done' and 23 'in_progress'. Known scorer biases inflate the model-vs-Sonnet gap (range-harvesting, whole-string unit match penalizing L/hr vs L/h, gold-granularity subgroups inflating FN) - see SCORER_SEMANTICS_what_the_eval_captures.md.","Trio scorer v2 GMFE (matched continuous pairs): within 2-fold 97-100% for the local arms - recorded here as a note rather than an arm_run because the ledger gives no per-arm breakdown. Reading: the residual is coverage, not numeric accuracy; both local arms are recall-starved.","The stock-NuExtract baseline arms measure 'NuExtract-2.0-8B + qwen2.5:32b verify/correct' as a SYSTEM, not a pure NuExtract-only number (extract_csv() runs verify+correct unconditionally). The verify-OFF arm (cfg.skip_verify_correct) is the closest thing to a pure extractor number.","Rows 2566 and 22710 score tp0/fp0/fn0 in every 25/39-row run - a scorer coverage blind spot (their gold content is entirely pk_events; score_trio_vs_gold.py's collect() walks canonical fields.* only), not a pipeline result.","The synthetic version-progression master table (v65.1 -> v80 on seed_777 / seed_888 / retriage_136) is version-level, not arm-level, and is deliberately NOT expanded here - only its explicit head-to-head A/B arms (v77-OFF vs v78 vs v79 vs v80 on retriage_136, pre-fix vs fixed augment) were extracted.","v79 full-stack fp is written as a range '8-10' in the A/B#2 text while the master table row for v79 records fp 10; fp left null on that row rather than picking one.","Several precision/grounding/event arms report only counts or rates (precision emit/match %, grounded value counts, DDI capture x/60, phantom counts, inheritance %). Those rows have p/r/f1 = null with the numbers in context and a non-F1 metric_kind, per the rules.","Source line numbers refer to SCORING_EVOLUTION.md as of 2026-07-18 (1177 lines).","COMPARABILITY (hard): the v77 auc_type 0.0 and the v79 auc_type 1.0 were measured on DIFFERENT sets (granularity_eval15, 4 scored vs auc_focus 8-drug, 12/12). They now sit in separate comparable groups — the ledger's \"0.0 → 1.0\" is a narrative claim across sets, not a same-set A/B.","COMPARABILITY (soft) owner_truth_64values precision_type: arms 1 and 3 run on GARBLED source text while arm 2 (92.2%) runs on prose-linearized input, so the 40.6% → 92.2% → 100% chain mixes a method change with an input change. Only arms 1 and 3 are a clean method head-to-head.","COMPARABILITY (soft) grounding_10row_size_gradient: the nuextract3_vision arm resolved only 10 compounds vs 17 for the other three, so its grounding RATE uses a materially different denominator population.","RECOVERY SWEEP 2026-07-18 (bounded hunt over the eval-artifact dirs). CONFIRMED NEVER MEASURED — no artifact exists: v82.1 precision-salvage + H2 identity (real_24_record_set); the model-replacement 4-arm benchmark (Qwen14B / Mistral7B); and all three v87 holdouts (holdout_event_gold_38, holdout_flat_precision_65, owner_variability_truth_64). These stay null by fact, not by omission.","TRAP: benchmark/ contains two metrics.json files that are gold-vs-gold IDENTITY self-scores (pred path == gold path, F1 = 1.0 trivially, no model arms). They are NOT the 4-arm model-replacement result. The 4-arm matrix exists only as a PROPOSED run matrix in benchmark/BENCHMARK_WALKTHROUGH.md; the benchmark/results/ tree it describes does not exist on disk.","ARM-LABEL CORRECTION: the matched-15 per-param F1 set (AUC 0.072 / Cmax 0.121 / PPB 0.340 / fecal 0.667 / urine 0.471) belongs to baseline_control, NOT to the table_shard arm it was first recorded against (table_shard is 0.222/0.393/0/0/0).","2026-07-23 FIRST LoRA result (real_gold_38row_allparam, trio-v2 value-presence, +/-2%, 2501 excluded): the 16-row priority18 fine-tune (armB_ckpt F1 0.460) BEATS the 32B-verified production pipeline (best stock 0.375) on all-param F1, entirely by lifting recall. AUC/Cmax are the fine-tune's weakest params (AUC 0.038, 28% of gold) and the #1 lever for the 647-row scale-up. Comparable only within this key (same 38-row set, same scorer, +/-2%).","2026-07-25 POOL scale-up (SAME key real_gold_38row_allparam, trio-v2 value-presence, +/-2%, 2501 excluded, same 930 gold items): the 808-row pool fine-tune (armB <script>
const DATA = JSON.parse(document.getElementById('atlas-data').textContent);
const HUE = DATA.hue;
const stageVar = i => (i<=0? 'var(--s0)': `var(--s${i})`);
const ST = DATA.stages;
const M = DATA.model.modules;
const E = DATA.model.edges;
const BR = DATA.model.bridges;
const modById = new Map(M.map(m=>[m.id,m]));
const stById = new Map(ST.map((s,i)=>[s.id,{...s,idx:i}]));
// adjacency
const adj = new Map(M.map(m=>[m.id,[]]));
for(const e of E){
  if(adj.has(e.s)&&adj.has(e.t)){
    adj.get(e.s).push({o:e.t,r:e.r,c:e.x});
    adj.get(e.t).push({o:e.s,r:e.r,c:e.x});
  }
}
const brSet = new Set(); const brPairs=[];
for(const b of BR){ brSet.add(b.s); brSet.add(b.t); brPairs.push([b.s,b.t]); }
const repoStageIdx = {}; ST.forEach((s,i)=>{ repoStageIdx[s.repo]=i; });
function moduleStageIdx(m){ // 0-based stage index (1..8) or 0 for docs/mem
  const s = ST.findIndex(st=>st.moduleIds.includes(m.id));
  return s<0 ? 0 : s+1;
}
// precompute each module's stage color index by which stage lists it (first)
const modStage = new Map();
ST.forEach((s,i)=>{ for(const id of s.moduleIds) if(!modStage.has(id)) modStage.set(id,i+1); });
for(const m of M) if(!modStage.has(m.id)) modStage.set(m.id,0);

let state={mode:'guided',stage:0,sel:null,hover:null};
const $=s=>document.querySelector(s);
const svg=$('#graph'); const SVGNS='http://www.w3.org/2000/svg';
const el=(n,a)=>{const x=document.createElementNS(SVGNS,n);for(const k in a)x.setAttribute(k,a[k]);return x;};

/* ---------------- RAIL ---------------- */
function buildRail(){
  const wrap=$('#stops'); wrap.innerHTML='';
  ST.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='stop'; d.style.setProperty('--hue',HUE[i]);
    d.setAttribute('role','button'); d.tabIndex=0;
    d.setAttribute('aria-current', state.mode==='guided'&&state.stage===i?'true':'false');
    const arti = s.spine && s.spine.length? s.spine[s.spine.length-1] : '';
    d.innerHTML=`<div class="bar"></div><div class="sn">S${i+1}</div>
      <div class="sl">${s.label}</div>

function layoutRadial(mods){
  const cx=W()/2, cy=H()/2, R=Math.min(W(),H())*0.42;

/* ---------------- 3D MESH (octagonal prism / sphere) ---------------- */
const cv=$('#mesh3d'); const ctx=cv.getContext('2d');
let MESH={shape:'octagon',yaw:0.5,pitch:-0.22,drag:false,auto:true,raf:0,pos:[],proj:[],built:null};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function build3D(shape){
  const N=ST.length, R=1.02, halfW=0.40, halfH=0.66;
  // each stage's god node -> stage index, so it can be pulled off the surface to the central axis
  const godOf=new Map(); ST.forEach((s,k)=>{ if(s.godModuleId) godOf.set(s.godModuleId,k+1); });
  // per-stage local phyllotaxis so each facet reads as an organised cluster
  const byStage=new Map(); for(let i=0;i<=N;i++) byStage.set(i,[]);
  for(const m of M){ const s=modStage.get(m.id)||0; byStage.get(s).push(m); }
  for(const [,arr] of byStage) arr.sort((a,b)=>b.deg-a.deg);
  const pos=[];
  for(const [st,arr] of byStage){
    const n=arr.length||1;
    arr.forEach((m,i)=>{
      let X,Y,Z;
      const t=(i+0.5)/n, ga=i*2.399963;
      if(godOf.has(m.id)){ // god node -> central hub
        if(shape==='sphere'){ // central axis, MIDDLE height of the stage's band; globe FLIPPED so S1 (most nodes) is the base
          X=0; Z=0; Y=-(1-(2*st-1)/N)*1.02;
        } else { // octagon: central ring, each god on its stage's slice radial bearing (Y = mid-height)
          const thG=((st-1)/N)*Math.PI*2, rc=0.30;
          X=rc*Math.cos(thG); Z=rc*Math.sin(thG); Y=0;
        }
      } else if(st===0){ // docs/memory: a slim core column on the axis
        const r=0.20*Math.sqrt(t);
        X=r*Math.cos(ga); Z=r*Math.sin(ga); Y=(t-0.5)*1.35;
      } else if(shape==='sphere'){
        // stage = latitude band, phyllotaxis within the band
        const b0=(st-1)/N, b1=st/N;
        const u=b0+(b1-b0)*t; const phi=Math.acos(1-2*u); const th=ga;
        X=Math.sin(phi)*Math.cos(th); Y=-Math.cos(phi); Z=Math.sin(phi)*Math.sin(th);
        X*=1.02;Y*=1.02;Z*=1.02;
      } else { // octagon: one flat facet per stage, arranged around the axis
        const th=((st-1)/N)*Math.PI*2;
        const rr=Math.sqrt(t);
        const u=Math.cos(ga)*rr*halfW, v=Math.sin(ga)*rr*halfH;
        X=R*Math.cos(th) - u*Math.sin(th);
        Z=R*Math.sin(th) + u*Math.cos(th);
        Y=v;
      }
      pos.push({m,X,Y,Z,st,god:godOf.has(m.id)});
    });
  }
  MESH.pos=pos; MESH.built=shape;
  MESH.idx=new Map(pos.map((p,i)=>[p.m.id,i]));
}
function proj3(p,W,H,yaw,pitch){
  const cy=Math.cos(yaw),sy=Math.sin(yaw);
  const x=p.X*cy - p.Z*sy, z=p.X*sy + p.Z*cy, y0=p.Y;
  const cp=Math.cos(pitch),sp=Math.sin(pitch);
  const y=y0*cp - z*sp, z2=y0*sp + z*cp;
  const D=3.1, f=D/(D+z2), S=Math.min(W,H)*0.40;
  return {x:W/2+x*f*S, y:H/2+y*f*S, f, z:z2};
}
// transparent wireframe under the nodes: globe meridians/parallels, or prism edges
function drawWire(W,H,yaw,pitch,shapeOverride){
  const S=shapeOverride||MESH.shape, GRID='170,188,218';
  // wireframe made more visible: ~1.8x alpha (capped) and a thicker default stroke
  const line=(pts,a,w)=>{ ctx.beginPath();
    pts.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
    ctx.strokeStyle=`rgba(${GRID},${Math.min(0.98,a*2.5)})`; ctx.lineWidth=w||2.3; ctx.stroke(); };
  if(S==='sphere'){
    const R=1.02;
    for(let i=1;i<9;i++){                    // parallels
      const phi=Math.PI*i/9, y=R*Math.cos(phi), r=R*Math.sin(phi), pts=[];
      for(let j=0;j<=72;j++){ const th=j/72*Math.PI*2;
        pts.push(proj3({X:r*Math.cos(th),Y:y,Z:r*Math.sin(th)},W,H,yaw,pitch)); }
      line(pts, i===Math.round(9/2)?0.20:0.11);
    }
    for(let i=0;i<12;i++){                    // meridians
      const th=i/12*Math.PI*2, pts=[];
      for(let j=0;j<=54;j++){ const phi=j/54*Math.PI;
        pts.push(proj3({X:R*Math.sin(phi)*Math.cos(th),Y:R*Math.cos(phi),Z:R*Math.sin(phi)*Math.sin(th)},W,H,yaw,pitch)); }
      line(pts,0.09);
    }
  } else if(S==='octagon'){
    const N=ST.length,R=1.02,hw=0.40,hh=0.66;
    // octagon vertices = the shared facet corners (u=+hw of each facet)
    const vert=(s,y)=>{ const th=(s%N)/N*Math.PI*2;
      return proj3({X:R*Math.cos(th)-hw*Math.sin(th), Y:y, Z:R*Math.sin(th)+hw*Math.cos(th)},W,H,yaw,pitch); };
    for(const [y,a] of [[-hh,0.22],[hh,0.22],[-hh/2,0.07],[0,0.10],[hh/2,0.07]]){
      const pts=[]; for(let s=0;s<=N;s++) pts.push(vert(s,y)); line(pts,a);
    }
    for(let s=0;s<N;s++) line([vert(s,-hh),vert(s,hh)],0.16);   // vertical edges
    for(let s=0;s<N;s++) line([vert(s,-hh),proj3({X:0,Y:-hh,Z:0},W,H,yaw,pitch)],0.05); // floor spokes
  }
}
function drawMesh3D(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const W=cv.clientWidth||900,H=cv.clientHeight||600;
  if(cv.width!==W*dpr||cv.height!==H*dpr){ cv.width=W*dpr; cv.height=H*dpr; }
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  if(MESH.built!==MESH.shape) build3D(MESH.shape);
  const {yaw,pitch}=MESH;
  const pr=MESH.pos.map(p=>({p,q:proj3(p,W,H,yaw,pitch)}));
  MESH.proj=pr;
  drawWire(W,H,yaw,pitch);
  // facet frames (octagon only) — the 8 stage planes
  if(MESH.shape==='octagon'){
    const N=ST.length,R=1.02,hw=0.40,hh=0.66;
    for(let s=1;s<=N;s++){
      const th=((s-1)/N)*Math.PI*2;
      const corners=[[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(([u,v])=>proj3({
        X:R*Math.cos(th)-u*Math.sin(th), Z:R*Math.sin(th)+u*Math.cos(th), Y:v},W,H,yaw,pitch));
      const avgz=corners.reduce((a,c)=>a+c.z,0)/4;
      ctx.beginPath(); corners.forEach((c,i)=>i?ctx.lineTo(c.x,c.y):ctx.moveTo(c.x,c.y)); ctx.closePath();
      const hue=HUE[(s-1)%HUE.length];
      ctx.fillStyle=hexA(hue, avgz>0?0.030:0.055); ctx.fill();
      ctx.strokeStyle=hexA(hue, avgz>0?0.42:0.72); ctx.lineWidth=2.5; ctx.stroke();
      // facet label
      const lab=proj3({X:R*Math.cos(th),Z:R*Math.sin(th),Y:-hh-0.10},W,H,yaw,pitch);
      if(lab.z<0.9){ ctx.font=`600 ${Math.max(9,11*lab.f)}px ui-monospace, monospace`;
        ctx.fillStyle=hexA(hue,Math.min(1,0.35+0.65*(1-lab.z))); ctx.textAlign='center';
        ctx.fillText(`S${s} ${ST[s-1].label}`,lab.x,lab.y); }
    }
  }
  // bridges through the interior — hand-off accent in HOT MAGENTA (was pale cyan, which blended into
  // the pale-blue wireframe). Distinct from every stage hue and from the grid.
  ctx.lineWidth=1.9;
  for(const b of BR){
    const ia=MESH.idx.get(b.s), ib=MESH.idx.get(b.t); if(ia==null||ib==null) continue;
    const A=pr[ia].q,B=pr[ib].q;
    ctx.strokeStyle=`rgba(255,77,170,${0.42+0.42*Math.max(0,1-(A.z+B.z)/2)})`;
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
  }
  // nodes, painter's algorithm (far first)
  const order=pr.map((o,i)=>i).sort((a,b)=>pr[b].q.z-pr[a].q.z);
  const focus=state.hover||state.sel;
  const nbr=new Set(); if(focus){ nbr.add(focus); (adj.get(focus)||[]).forEach(a=>nbr.add(a.o)); }
  for(const i of order){
    const {p,q}=pr[i]; const hue=p.st===0?'#64748b':HUE[(p.st-1)%HUE.length];
    const r=p.god?Math.max(6,(6.5+Math.sqrt(p.m.deg)*1.05)*q.f):Math.max(1.1,(2.0+Math.sqrt(p.m.deg)*1.35)*q.f);
    const dim=focus&&!nbr.has(p.m.id);
    const depth=Math.max(0.18,Math.min(1,1.25-q.z*0.55));
    if(p.god&&!dim){ ctx.beginPath(); ctx.arc(q.x,q.y,r+5*q.f,0,6.2832); ctx.strokeStyle=hexA(hue,0.55*depth); ctx.lineWidth=1.4; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(q.x,q.y,r,0,6.2832);
    ctx.fillStyle=hexA(hue,dim?0.07:(p.god?0.98:depth*(brSet.has(p.m.id)?0.98:0.72))); ctx.fill();
    if(brSet.has(p.m.id)&&!dim&&!p.god){ ctx.strokeStyle=`rgba(255,77,170,${0.85*depth})`; ctx.lineWidth=1.3; ctx.stroke(); }
    if(p.god&&!dim){ ctx.strokeStyle=hexA('#e7eefc',0.9); ctx.lineWidth=1.3; ctx.stroke(); }
    if(p.m.id===focus){ ctx.strokeStyle='#fff'; ctx.lineWidth=1.8; ctx.stroke(); }
    if((p.god||p.m.id===focus)&&!dim&&q.z<0.92){
      ctx.font=`600 ${Math.max(8,(p.god?10.5:11)*q.f)}px ui-monospace, monospace`; ctx.fillStyle='#e7eefc'; ctx.textAlign='center';
      ctx.fillText(short(p.m.file),q.x,q.y-r-6); }

}
function hexA(h,a){ const n=parseInt(h.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
// bright complementary of a stage hue (HSL: rotate hue 180deg, high S/L) -> "R,G,B" for rgba() composition
function complRGB(hex){
  const n=parseInt(hex.slice(1),16), r=((n>>16)&255)/255, g=((n>>8)&255)/255, b=(n&255)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn; let h=0;
  if(d){ h = mx===r?((g-b)/d+(g<b?6:0)) : mx===g?((b-r)/d+2) : ((r-g)/d+4); h/=6; }
  h=(h+0.5)%1; const s=0.85, l=0.62, q=l<0.5?l*(1+s):l+s-l*s, p=2*l-q;
  const tc=t=>{ t=(t+1)%1; return t<1/6?p+(q-p)*6*t : t<0.5?q : t<2/3?p+(q-p)*(2/3-t)*6 : p; };
  return `${Math.round(tc(h+1/3)*255)},${Math.round(tc(h)*255)},${Math.round(tc(h-1/3)*255)}`;
}

  for(const {p,q} of V.proj){ const d=(q.x-mx)**2+(q.y-my)**2; if(d<bd){bd=d;best=p;} }

}

/* ---------- per-stage 3D globe (the guided view's second shape) ---------- */
let GST={shape:'flat',yaw:0.4,pitch:-0.18,drag:false,auto:true,raf:0,pos:[],proj:[],built:-1,idx:new Map()};

function buildStage3D(i){
  const {shown,feSet,godId}=stageModules(i);
  // god node sits at the globe's CENTRE (the hub); everything else spirals on the surface (phyllotaxis)
  const ordered=[...shown];
  const gi=ordered.findIndex(m=>m.id===godId);
  if(gi>0) ordered.unshift(ordered.splice(gi,1)[0]);
  const n=ordered.length, R=1.0, pos=[];
  ordered.forEach((m,k)=>{
    let X,Y,Z;
    if(k===0 && godId){ X=0; Y=0; Z=0; }
    else{
      const t=(n<2)?0.5:(k/(n-1));
      const phi=Math.acos(1-2*(0.05+t*0.90));   // keep off the exact poles
      const th=k*2.399963;
      X=R*Math.sin(phi)*Math.cos(th); Y=R*Math.cos(phi); Z=R*Math.sin(phi)*Math.sin(th);
    }
    pos.push({m,X,Y,Z,god:m.id===godId,feat:feSet.has(m.id)||m.id===godId});
  });
  GST.pos=pos; GST.built=i; GST.idx=new Map(pos.map((p,k)=>[p.m.id,k]));
}

function drawStage3D(){
  const i=state.stage, hue=HUE[i%HUE.length];
  const complHue=complRGB(hue);   // bright complement of the stage colour, for hand-off markers
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const W=cv.clientWidth||900,H=cv.clientHeight||600;
  if(cv.width!==W*dpr||cv.height!==H*dpr){ cv.width=W*dpr; cv.height=H*dpr; }
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  if(GST.built!==i) buildStage3D(i);
  const {yaw,pitch}=GST;
  drawWire(W,H,yaw,pitch,'sphere');
  const pr=GST.pos.map(p=>({p,q:proj3(p,W,H,yaw,pitch)}));
  GST.proj=pr;
  const idset=new Set(GST.pos.map(p=>p.m.id));
  const focus=state.hover||state.sel;
  const nbr=new Set(); if(focus){ nbr.add(focus); (adj.get(focus)||[]).forEach(a=>nbr.add(a.o)); }
  // intra-stage edges, drawn behind the nodes
  const seen=new Set();
  for(const e of E){
    if(!idset.has(e.s)||!idset.has(e.t)) continue;
    const key=e.s<e.t?e.s+e.t:e.t+e.s; if(seen.has(key)) continue; seen.add(key);
    const A=pr[GST.idx.get(e.s)].q, B=pr[GST.idx.get(e.t)].q;
    const inc=focus&&(e.s===focus||e.t===focus);
    const depth=Math.max(.15,Math.min(1,1.2-(A.z+B.z)/2*.55));
    ctx.strokeStyle=inc?hexA(hue,.85):`rgba(147,164,192,${(focus?0.05:0.16)*depth})`;
    ctx.lineWidth=inc?1.6:1;
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
  }
  // nodes, far first
  const order=pr.map((o,k)=>k).sort((a,b)=>pr[b].q.z-pr[a].q.z);
  for(const k of order){
    const {p,q}=pr[k];
    const dim=focus&&!nbr.has(p.m.id);
    const depth=Math.max(.2,Math.min(1,1.25-q.z*.55));
    const r=(p.god?11:3.0+Math.sqrt(p.m.deg)*1.5)*q.f;
    const isBr=brSet.has(p.m.id);
    if(p.god){ ctx.beginPath(); ctx.arc(q.x,q.y,r+5*q.f,0,6.2832);
      ctx.strokeStyle=hexA(hue,dim?.06:.42*depth); ctx.lineWidth=1; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(q.x,q.y,r,0,6.2832);
    ctx.fillStyle=p.feat?hexA(hue,dim?.08:.92*depth):hexA('#0c1421',dim?.2:.85);
    ctx.fill();
    if(!p.feat){ ctx.strokeStyle=hexA(hue,dim?.08:.75*depth); ctx.lineWidth=1.3; ctx.stroke(); }
    if(isBr&&!dim){ ctx.strokeStyle=`rgba(${complHue},${.95*depth})`; ctx.lineWidth=2.4; ctx.stroke(); }
    if((p.feat||isBr||p.m.id===focus)&&!dim&&q.z<0.85){
      ctx.font=`${p.god?'600 ':''}${Math.max(8,(p.god?11:9.5)*q.f)}px ui-monospace, monospace`;
      ctx.fillStyle=p.god?'#e7eefc':hexA('#e7eefc',.72*depth);
      ctx.textAlign='center'; ctx.fillText(short(p.m.file),q.x,q.y-r-6);
    }
  }
}

function esc(s){return (s==null?'':''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function short(f){ if(!f)return '';const p=f.split('/');let n=p[p.length-1];
  if(p.length>1)n=p[p.length-2].slice(0,6)+'/'+n; return n.length>22?n.slice(0,21)+'…':n;}

  return esc(t).replace(/(\b[\w./]+\.py[:0-9]*)|(\bpass\d\w*)|(\-\-[\w-]+)|(\b\w+_\w+(?:\(\))?)/g,m=>`<code>${m}</code>`);

  document.querySelector('.gwrap').style.display=graphy?'':'none';
  $('#gtop').style.display=graphy?'':'none';
  $('#legend').style.display=graphy?'':'none';
  $('#ghint').style.display=graphy?'':'none';
  syncRail();
  // stop whichever 3D loop no longer applies; only release the canvas if NEITHER wants it
  if(mode!=='mesh'){ cancelAnimationFrame(MESH.raf); MESH.raf=0; }
  if(mode!=='guided'){ cancelAnimationFrame(GST.raf); GST.raf=0; }
  if(mode!=='mesh' && !(mode==='guided'&&GST.shape==='globe')){
    cv.classList.remove('on'); svg.style.display='';
  }
  if(mode==='mesh'){
    VIEW={k:1,x:0,y:0}; renderLeft(); renderRight();
    const flat=MESH.shape==='flat';
    cv.classList.toggle('on',!flat); svg.style.display=flat?'':'none';
    if(flat) drawMesh(); else { build3D(MESH.shape); start3D(); }
    meshTop();
  }
  else if(mode==='scoring'){ renderScoring(); }
  else if(mode==='diagrams'){ renderDiagrams(); }
  else { renderLeft(); goStage(state.stage); }
}

function armBarsHTML(sel){
  const rows=sel.filter(r=>typeof r.f1==='number'||typeof r.p==='number'||typeof r.r==='number');
  if(!rows.length) return `<div style="padding:40px;text-align:center;color:var(--faint2);font-family:var(--mono);font-size:12px">
    this group records no P/R/F1 — see the table (its numbers live in "context")</div>`;
  // GROUPED BY METRIC: one cluster per metric (Precision / Recall / F1), one bar per arm inside it,
  // coloured per arm so a single metric can be compared straight across every arm.
  const METS=[['p','Precision'],['r','Recall'],['f1','F1']];
  const col=i=>ARM_PAL[i%ARM_PAL.length];
  const leg=`<div class="armleg">${rows.map((r,i)=>
    `<span><i style="background:${col(i)}"></i>${esc(r.arm)}</span>`).join('')}</div>`;
  const W=1000,H=300,mL=52,mR=16,mT=18,mB=44, plotH=H-mT-mB;
  const gw=(W-mL-mR)/METS.length, inner=gw*0.74, n=rows.length, bw=inner/n;
  let s='';
  for(let g=0;g<=4;g++){ const v=g/4, y=mT+(1-v)*plotH;

        <text class="axlbl" x="${mL-8}" y="${y+4}" text-anchor="end">${v.toFixed(2)}</text>`; }
  METS.forEach(([k,lab],gi)=>{

    });

  });

  return leg+`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="arm comparison grouped by metric">${s}</svg>`;

function armTimeHTML(runs){
  // GROUPED BY METRIC: three stacked panels (Precision / Recall / F1), each plotting arm
  // families over versions. Lines stay per (arm_family × comparable_key) — never joined across
  // groups. Shared y-scale so the three panels are directly comparable.
  const METS=[['p','Precision'],['r','Recall'],['f1','F1']];
  const pts=runs.filter(r=>METS.some(([k])=>typeof r[k]==='number'));
  if(!pts.length) return `<div style="padding:40px;text-align:center;color:var(--faint2);font-family:var(--mono);font-size:12px">no P/R/F1 values recorded</div>`;
  const order=[...new Set(runs.map(r=>r.version))];
  const vals=[]; pts.forEach(r=>METS.forEach(([k])=>{ if(typeof r[k]==='number') vals.push(r[k]); }));
  let lo=Math.min(...vals),hi=Math.max(...vals);
  const pad=Math.max(0.03,(hi-lo)*0.15); lo=Math.max(0,lo-pad); hi=Math.min(1,hi+pad);
  const fams=[...new Set(pts.map(p=>p.arm_family))];
  const W=1000,mL=52,mR=16,mT=12,ph=132,gap=20,xLab=52;
  const X=v=>mL+(order.length<2?0.5:order.indexOf(v)/(order.length-1))*(W-mL-mR);
  const H=mT+METS.length*ph+(METS.length-1)*gap+xLab+18;
  let s='';
  METS.forEach(([mk,mlab],pi)=>{
    const top=mT+pi*(ph+gap), plotTop=top+18, plotH=ph-26;
    const Y=v=>plotTop+(1-(v-lo)/(hi-lo))*plotH;
    [lo,(lo+hi)/2,hi].forEach(gv=>{ s+=`<line class="gridln" x1="${mL}" y1="${Y(gv)}" x2="${W-mR}" y2="${Y(gv)}"/>
      <text class="axlbl" x="${mL-8}" y="${Y(gv)+4}" text-anchor="end">${gv.toFixed(2)}</text>`; });
    s+=`<text class="slbl" x="${mL}" y="${top+12}">${mlab}</text>`;
    const series=new Map();
    pts.forEach(p=>{ if(typeof p[mk]!=='number') return; const key=p.arm_family+'||'+p.comparable_key;
      if(!series.has(key)) series.set(key,[]); series.get(key).push(p); });
    for(const [key,arr] of series){
      const col=armFamHue(key.split('||')[0]);
      arr.sort((a,b)=>order.indexOf(a.version)-order.indexOf(b.version));
      if(arr.length>1) s+=`<polyline fill="none" stroke="${col}" stroke-width="2.7" stroke-opacity=".85"
        points="${arr.map(p=>`${X(p.version)},${Y(p[mk])}`).join(' ')}"/>`;
      arr.forEach(p=>{ s+=`<circle class="pt" cx="${X(p.version)}" cy="${Y(p[mk])}" r="5.5" fill="${col}" fill-opacity=".92"
        stroke="#0b111c" stroke-width="1.5"><title>${esc(p.arm)} · ${esc(p.version)}
${mlab} = ${p[mk]} (${esc(p.metric_kind||'')})
group: ${esc(p.comparable_key)}</title></circle>`; });
    }
    s+=`<line class="ax" x1="${mL}" y1="${Y(lo)}" x2="${W-mR}" y2="${Y(lo)}"/><line class="ax" x1="${mL}" y1="${plotTop}" x2="${mL}" y2="${plotTop+plotH}"/>`;
  });
  const lastBot=mT+(METS.length-1)*(ph+gap)+18+(ph-26);
  const step=Math.ceil(order.length/12);
  order.forEach((v,i)=>{ if(i%step) return;
    s+=`<text class="axlbl" x="${X(v)}" y="${lastBot+16}" text-anchor="end" transform="rotate(-38 ${X(v)} ${lastBot+16})">${esc(v).slice(0,22)}</text>`; });
  s+=fams.map((f,i)=>`<g transform="translate(${mL+i*150},${H-4})"><circle cx="5" cy="-4" r="4.5" fill="${armFamHue(f)}"/>
      <text class="slbl" x="15" y="0">${esc(f)}</text></g>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="height:auto" role="img" aria-label="arm evolution grouped by metric">${s}</svg>`;
}
