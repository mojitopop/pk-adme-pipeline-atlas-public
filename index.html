line::passes/verify_questions.py","pipeline::prompts.py","pipeline::config.py","pipeline::slice_only_extract.py","pipeline::event_compiler.py","pipeline::utils/export.py"]},{"id":"s5","label":"Distill","repo":"gold_extraction","dir":"gold_extraction_pipeline","resolved_dir":"gold_extraction_pipeline","title":"Sonnet gold distillation dataset (teacher labels)","hue":"#e879f9","one_line":"Sonnet teacher labels, then a 3-corpus verbatim-grounding + field-shape hardening loop rendered into slice training JSONL.","narrative":"S5 no longer ends at 'Sonnet extracted a flat ADME hint'. run_all.py's LOCKED prompt (system_prefix L85) and its Sonnet outputs are now the frozen INPUT to a large remediation stage operating over three parallel gold corpora: priority18_extractions_first_cleaning_manual/ (16 hand-curated rows, 488 PKV items), nuextract_oldcorpus_v108_candidate_json/ (366 rows) and nuextract_widenet_v108_candidate_json/ (555 rows). VERBATIM_REPAIR_WORKFLOW.md names the two disjoint downstream tracks: Track A (the live 373-row trainable set, of which priority18 is the only member of this stage) and Track B (oldCorpus/WideNet 'broad-corpus salvage', staged but not yet wired to any training renderer). Verbatim grounding is repaired in two mechanisms. Deterministic: deterministic_verbatim_span_locator.py returns only text sliced from the real source, so it carries ZERO generation risk and its confidence=='high' rows are auto-applied by apply_deterministic_verbatim_to_json_corpus.py; medium never occurs in practice. Generative: the ambiguous/none remainder goes to verbatim_repair_cluster_bundle/run_verbatim_repair.py, a stdlib-only Ollama/qwen2.5:14b bundle whose strict_source_contains() (L89) gate rejects any reply that is not an exact substring of the source; merge_repair_outputs.py reconciles shards by STATUS_RANK and cleanup_repair_outputs.py drops infra-noise rows. The measured result (workflow doc Sec.6, 2026-07-19) is 12,026/12,516 items grounded (96.1%) with a hard qwen floor of 490 unrepairable. reapply_verbatim_repairs_to_priority18_corpus_20260721.py closes the round trip the other way, folding the 259 repairs that only ever landed in the training JSONL back into the live corpus using the merge diff logs as truth and a three-way old/new/diverged safety rule rather than a blind copy. Alongside that runs a field-shape hardening sweep: apply_deterministic_field_recovery.py and apply_new_deterministic_classifiers.py fill only-null fields from each item's own grounding text (never the surrounding document, never overwrite), with the FLAG-NOT-SILENT-FIX rule stamping _ambiguous_<field> when a sentence names two candidates; pkv_shape_sanity_check.py enforces field-to-family scope from cited owner rulings with a DROP-ELIGIBLE / REPORT-ONLY severity split; unit_sanity_audit_20260721.py is a read-only cross-corpus unit tally with a deliberately absent --apply; deterministic_fed_fasted_drug_form_fill.py fills fed_fasted/drug_form only where the item's own verbatim_source is self-evidently explicit. pk_events are now derived in-corpus for all 3 corpora via the real event_compiler.build_event_view (apply_pk_events_derivation.py, 2026-07-20) but are explicitly FILTERED OUT of the training path. The stage's new tail is the slice training pipeline: build_slice_inventory.py (GPU/Ollama-bound, runs live v108 pass0/pass1 to cut per-compound ADME and per-category text slices) -> slice_json_to_training_cells.py (offline; keeps only PKV items whose grounding text is an exact substring of THAT slice) -> render_nuextract_slice_jsonl.py (offline; renders prompt/completion pairs by importing finetune/convert_synthgen_to_nuextract's build_compound_prompt + project_compound_target). Only the 3 baseline_* slice kinds render today; the 5 scenario kinds need a pass2_router prompt builder that does not exist yet and are counted-and-skipped. compile_review.py / outputs/compiled/ still exist and the contract is unchanged, but the directory is stale (16 files, last written 2026-07-16) and no post-2026-07-18 work touches it — it is legacy, not the live output.","blurb":"S5 no longer ends at 'Sonnet extracted a flat ADME hint'.","inputs":[["txt.frozen_cleaned_pk_text","db_table","s3"],["extraction values","file","s4"]],"outputs":[["outputs/compiled/*.json","file"]],"substeps":["run_all / batch_extract (Sonnet)","Codex review + compile_review","event_shape_v5 author + apply","verbatim QA (validate_verbatim_exactness)"],"spine":[],"diagrams":["04_distill_finetune_flow","01_end_to_end_flow"],"handoff_in":"Three corpus directories of extract_<row_id>.json arrive as frozen Sonnet output: priority18_extractions_first_cleaning_manual/ (16 files, 488 PKV items, Track A+B), nuextract_oldcorpus_v108_candidate_json/ (366) and nuextract_widenet_v108_candidate_json/ (555). Join key throughout is row_id, with the within-row item key row_id::compound_name::family::item_index (the 'index' column convention, originating in build_input_csv.py and reused by every locator/repair/merge/re-apply script). Authoritative source text is MariaDB raw_llm_txt.txt keyed on row_id (column frozen_cleaned_pk_text), SELECT-only. Live pipeline modules (schema.py, prompts.py, passes/pass0, passes/pass1, event_compiler) are imported from pk_new_nu_model_v108 via sys.path.insert, and finetune/verbatim_repair_merge_applied_*.json comes BACK from S6 for the reverse round trip.","handoff_out":"Two distinct exits. (1) Corpus exit: the hardened extract_<row_id>.json files themselves — verbatim_source repaired to 96.1% grounded (12,026/12,516), deterministic fields filled, shape violations dropped, pk_events derived — consumed by S6's finetune/convert_sonnet_distillation_to_nuextract.py, which today only reads priority18 (Track A). (2) Slice exit: slice_training_priority18_20260718/ (28-row smoke package: slice_inventory -> training_cells -> baseline_train.jsonl + skipped.jsonl + residual.jsonl + manifest.json), prompt/completion pairs rendered through the live pass2 baseline prompt builder, keyed by row_id + compound_name + slice_kind. The cluster bundle also hands off results/*_accepted.csv (index/original_vsrc/corrected_vsrc/status) directly to finetune/merge_verbatim_repairs_into_training.py. NOTE: outputs/compiled/*.json remains a valid contract but is stale (16 files, 2026-07-16) and feeds nothing current.","db_tables":[{"name":"raw_llm_txt.txt (columns row_id, drug_name, frozen_cleaned_pk_text)","mode":"read","writer_script":"read-only SELECT: deterministic_verbatim_span_locator.fetch_source_texts (L328), fix_precision_plusminus_fidelity.fetch_source_texts (L45), build_slice_inventory.load_rows_from_db (L134)"}],"invariants":["Locator spans are mechanically grounded: locate_span only ever returns text SLICED from the real source, so confidence=='high' rows are auto-applied with no review gate. Only 'high' is ever applied — 'medium' does not occur in practice across any of the 3 corpora.","Generative repair is gated, not trusted: run_verbatim_repair.strict_source_contains (L89) rejects any qwen reply that is not an exact substring of the source, and the reply must carry the 'VERBATIM_REPLACEMENT:' sentinel. Ungrounded output becomes fail_not_grounded, never an accepted repair.","FLAG-NOT-SILENT-FIX (owner instruction 2026-07-17): when a grounding sentence names >=2 candidates for the same field, the field stays null AND the item is stamped _ambiguous_<field> plus a CSV row. Silent abstention is indistinguishable from 'no signal' and is banned.","Fill-only, never overwrite: every deterministic classifier/recovery/fed_fasted pass writes ONLY into a currently-null field, and reads ONLY that PKV item's own grounding text — never surrounding paragraphs, never the whole document.","Every --apply writes a .bak_<stamp> per touched file plus a JSON diff log; dry-run is the default on every mutating script in the stage.","The reverse round trip is never a blind copy: reapply_verbatim_repairs uses the merge diff logs and skips+flags any item whose live value matches neither old nor new, because the corpus has been independently edited since (dedup, restructures, manual fills).","pkv_shape_sanity_check is explicitly NOT a blanket allow-list — schema.py's _PKV permits every field on every family (extra=allow) and several legitimate fields are populated only by downstream derive_* functions, so 'not in the prompts.py template' is not evidence of a bug. Only cited rules drop; everything else is left alone.","A field present with a null/empty value on the wrong family is the known Sonnet placeholder-stamping pattern, not a violation (_has_real_value L188).","Read-only means no --apply: unit_sanity_audit_20260721.py deliberately ships without one — threshold and regex are the owner's call.","DB access is strictly SELECT-only against raw_llm_txt.txt.frozen_cleaned_pk_text; missing row_ids are reported, never raised.","Track A / Track B separation: priority18 is the ONLY corpus in both tracks, so only priority18 fixes reach the live training JSONL. oldCorpus/WideNet repairs are real but dormant (measured 0/4664 and 0/4745 key matches against Track A).","pk_events are derived in-corpus for all 3 corpora via the real event_compiler.build_event_view, but are explicitly FILTERED OUT of the training path — convert_sonnet_distillation_to_nuextract.map_compound now counts the drop in OUT_OF_SCOPE rather than dropping silently.","Slice cells keep an item ONLY on exact grounding-substring match against THAT slice; items with no grounding text, or grounded elsewhere, are residualized with a reason, never guessed into the slice.","A slice target that projects to identity fields only is skipped — an empty completion would train 'emit nothing' on a real input.","Scenario slice kinds are counted-and-skipped, not silently dropped: pass2_router has no offline prompt builder (build_category_prompt/project_category_target do not exist anywhere yet).","unit_sanity_audit VENDORS evaluate.py's _norm_unit byte-comparably rather than importing across trees, because a cross-tree import into a version-numbered dir breaks the moment the active version bumps to v109."],"godDoc":{"god_node":"deterministic_verbatim_span_locator.py","why":"S5's centre of gravity moved from producing Sonnet labels to HARDENING them, and every hardening path is keyed on this script's output. locate_span() (L252) slices the smallest real-source span (paragraph -> sentence -> clause) containing an item's anchor numbers and stamps high/ambiguous/none; the resulting span_locator_report_{priority18,oldcorpus,widenet}_*.csv is (a) auto-applied by apply_deterministic_verbatim_to_json_corpus.py, (b) the exact source of the ambiguous/none remainder shipped to the qwen cluster bundle, (c) the input to the reviewed-change appliers (apply_reviewed_324/482_locator_changes.py), and (d) the origin of the row index convention row_id::compound_name::family::item_index that every repair, merge and re-apply script joins on. run_all.py (the previous god node) is untouched since 2026-06-29 and now sits UPSTREAM of the stage as the frozen teacher-prompt origin, not its spine.","scripts":[{"file":"deterministic_verbatim_span_locator.py","role":"God node: rule-based verbatim span locator. Zero generation risk (only slices real source text); its report is the join point of every repair path in the stage.","key_functions":[{"name":"locate_span","loc":"L252","does":"Paragraph -> sentence -> clause narrowing; requires ALL anchor numbers grounded; returns high/ambiguous/none."},{"name":"_resolve","loc":"L291","does":"Resolves tied candidates into a LocateResult carrying confidence + method + tied_candidates."},{"name":"_score_candidate","loc":"L225","does":"Family-keyword scoring (FAMILY_KEYWORDS L133) to break ties between equally-grounded spans."},{"name":"_anchor_numbers","loc":"L205","does":"Pulls the item's own numeric anchors (value/min/max/precision) that a span must contain."},{"name":"number_grounded_in","loc":"L88","does":" ound. The god node reads extract_<row_id>.json plus source text from priority18_final_spliced_rows.json (join key row_id) and calls map_compound (L518) -> map_pkv_item (L408) to reconcile the two schemas: category-1 passthrough (_PASSTHROUGH_KEYS L177, now including notes, half_life_type, auc_t_hours, and the 2026-07-20 additions absolute_or_relative and excreted_as), category-2 translation (auc_type via _AUC_TYPE_MAP L227; fed_fasted checked BEFORE Sonnet's raw fed_state; route->drug_form only off elimination params; verbatim_source via a 5-key fallback chain _VERBATIM_SOURCE_FALLBACK_KEYS L333), and category-3 drops that are counted in DROP_COUNTS and printed to stderr. NEW since 2026-07-18 in the converters themselves: (a) ratio_to_parent is no longer an invisible loss — map_ratio_to_parent_item (L503) maps the metabolite-level list, base._project_ratio_to_parent_item (L369) projects it, a new --ratio-to-parent CLI flag drives cfg.capture_ratio_to_parent, 'ratio_to_parent' joined _GATED_KEYS_TO_CFG (L817) so the preflight refuses any completion carrying it without the matching prompt slot, and run_ratio_to_parent_selftest (L780) is a standalone flag-ON/flag-OFF regression; (b) _count_residual_keys (L292) makes previously-silent `_residual_*` Track-B markers counted; (c) pk_events joined the OUT_OF_SCOPE counted-drop list in map_compound. THREE NEW POST-PROCESSING SCRIPTS now sit AFTER the trim + verbatim-rebuild steps, operating on the final *_trimmed_verbatim.jsonl in place rather than regenerating it: merge_verbatim_repairs_into_training.py folds the qwen cluster bundle's 1223 accepted verbatim_source repairs in, keyed on (row_id, compound_name, family_short, item_index) and guarded by an original_vsrc equality check (MISMATCH_skip is never applied); apply_accum_tts_to_training_jsonl.py surgically inserts reviewed accumulation_ratio/time_to_steady_state gold items into the priority18 completions only, explicitly BECAUSE a full converter re-run would revert the 10 qwen repairs that live only in the JSONL; audit_verbatim_grounding.py is the read-only honesty check over all *_trimmed_verbatim.jsonl, scoring every numeric val/min_val/max_val against the Context text (matcher ported from v108 utils/text_utils.number_grounded_in) and every vsrc as a fuzzy substring (MATCH>=0.90 / PARTIAL>=0.70), writing verbatim_grounding_audit_report.json. COUNT/FILENAME STATUS: the 373 figure still holds for the three date-pinned _20260717_ files (verified by real json parse: 301 candidates199 + 20 priority18 + 52 silver74 = 373), but a 2026-07-21 priority18 REGENERATION now coexists (sonnet_distillation_priority18_20260721*.jsonl, 19 examples), so the undated glob *_trimmed_verbatim.jsonl now matches 4 files / 392 lines — export_training_set_csv.py and audit_verbatim_grounding.py use that undated glob and will now double-count priority18, while merge_verbatim_repairs_into_training.py is date-pinned to _20260717_ and does not. The 0721 tranche is also byte-identical to its _trimmed input (0/19 lines carry meta.context_source): rebuild_prompts_with_verbatim_context.py found no completed summary for those id_rows and left the raw text untouched by design.","blurb":"S6 converts Codex-reviewed Sonnet extraction JSON (schema v5.1/v5.2) from ../gold_extraction_pipeline/ into NuExtract-2.0 LoRA training JSONL, one example per compound.","inputs":[["outputs/compiled/*.json","file","s5"]],"outputs":[["sonnet_distillation_*_trimmed_verbatim.jsonl (373)","file"]],"substeps":["convert_sonnet_distillation_to_nuextract (map_pkv_item)","rebuild_prompts_with_verbatim_context","trim_against_hand_gold (leakage)","export_training_set_csv (eyeball)"],"spine":[],"diagrams":["04_distill_finetune_flow","01_end_to_end_flow"],"handoff_in":"From S5 (Sonnet distillation / Codex review): per-row extraction files gold_extraction_pipeline/{priority18_extractions,priority18_extractions_first_cleaning_manual,distillation_extractions,nuextract_widenet_extractions}/extract_<row_id>.json (or outputs/compiled/compiled_*.json for the silver74 'parsed' shape), plus gold_extraction_pipeline/priority18_final_spliced_rows.json supplying pk_source_text + cid/unii/db_source. Join key: row_id (extraction_doc.row_id == spliced-rows dict key); db_source=='RCP' sets language FR. Two side channels also cross into the stage on row_id: verbatim_repair_cluster_bundle/results/*_accepted.csv (join (row_id, compound_name, family, item_index)) and gold_extraction_pipeline/field_audits/*_candidates.csv (join row_id + compound_name). The live prompts.py/config.cfg of the highest pk_new_nu_model_v* is imported at runtime.","handoff_out":"To S7 (NuExtract LoRA fine-tune, ../lora_training_v108/train_lora.py): sonnet_distillation_*_trimmed_verbatim.jsonl, each line {prompt, completion, meta}. The date-pinned canonical set is the three _20260717_ files = 373 examples (301 candidates199 / 20 priority18 / 52 silver74, verified by json parse 2026-07-22); a newer sonnet_distillation_priority18_20260721_trimmed_verbatim.jsonl (19 examples, raw-text context, no meta.context_source) sits alongside it, so an undated glob yields 4 files / 392 lines and double-counts priority18 — S7 must pick a tranche explicitly. Identity carried forward: meta.id_row (document_id) + meta.compound_name/compound_type, with meta.context_source flagging verbatim-rebuilt prompts. training_set_373_eyeball.csv and verbatim_grounding_audit_report.json are the parallel human/QA artifacts.","db_tables":[],"invariants":["train==inference, unchanged mechanism: the converters never reimplement the prompt. convert_synthgen_to_nuextract.py's _REPO block (L142-L169) resolves the highest-numbered pk_new_nu_model_v* carrying prompts.py (PK_REPO overrides), imports prompts + the SAME config.cfg singleton pass2.py reads, and build_compound_prompt (L581) calls prompts.build_nuextract_prompt on the frozen templates.","Gated-key preflight, now SEVEN keys: convert() refuses to write (sys.exit 1) if a completion carries auc_type / auc_t_hours / freq / dpd / int_h / prec / ratio_to_parent that the built prompt for that SAME example never demonstrated. ratio_to_parent was added 2026-07-21 — flag OFF must fail loudly, never drop silently (asserted by run_ratio_to_parent_selftest).","allowed_keys_by_field is derived from the exact template object just passed to build_nuextract_prompt (_allowed_keys_from_template L568), so it cannot drift from what the model was shown. Gated short-keys are deliberately EXEMPT from this structural prune so mismatches surface via the preflight instead.","No silent information loss: every field with no canonical destination is counted in DROP_COUNTS and printed to stderr — now including `_residual_*` Track-B markers (_count_residual_keys L292) and pk_events (map_compound OUT_OF_SCOPE list), both of which were previously dropped invisibly.","ratio_to_parent source provenance is never a model target: map_ratio_to_parent_item and _project_ratio_to_parent_item strip `source`; the pipeline stamps it post-hoc.","excreted_as is mapper-ready but NOT end-to-end: prompts.py's _ELIM_PKV has no such slot, so allowed_keys_by_field still prunes it out of real completions. The converter docstring says explicitly not to claim otherwise.","In-place repair over regeneration: apply_accum_tts_to_training_jsonl.py's docstring records that re-running the converter today would REVERT 10 qwen verbatim_source repairs that exist only in the JSONL (merge_verbatim_repairs_into_training.py never writes back into the extraction JSON). Any regeneration must re-apply the merge first.","Repair safety guard: an item's vsrc is only rewritten when the JSONL's current value equals (whitespace-collapsed) the bundle's original_vsrc for the same (row_id, compound_name, family, item_index) key. MISMATCH_skip rows are reported, never applied.","Both in-place patchers are dry-run by default, take a timestamped .bak of the whole file before writing, emit an item-level diff log, and are idempotent (vsrc-equality / already_applied_previously checks).","Verbatim-context rebuild is loss-tolerant: an id_row with no completed summary, or a prompt missing the '# Context:'/'NOTE:' markers, is kept UNTOUCHED rather than corrupted or dropped — which is why the 2026-07-21 priority18 tranche's _trimmed_verbatim output is byte-identical to its _trimmed input (0/19 rebuilt).","Leakage guard is document identity only: an example is dropped iff meta.id_row is a row_id key in the 39-row hand gold — deliberately not drug_id.","concentration_dependent must be the Literal string yes/no (a Codex Python bool is normalized, not passed through); fed_state normalizes to the terse fed|fasted vocabulary and unrecognized values are counted as drops, never guessed.","join key is row_id throughout: extraction docs join to priority18_final_spliced_rows.json on row_id, and meta.id_row carries it through trim, verbatim rebuild, the audit, and both repair merges (which further key on compound_name + family + item_index)."],"godDoc":{"god_node":"convert_sonnet_distillation_to_nuextract.py","why":"Still the central real-corpus converter of S6: Codex-reviewed Sonnet extraction JSON -> NuExtract training pairs, and the only script performing the Sonnet-schema -> canonical schema.py _PKV reconcile (map_pkv_item, now L408 — the previous spec's L293 and the '_map_pkv_item' name are both stale; the public name is map_pkv_item). It imports the sibling convert_synthgen_to_nuextract as `base` and calls base.build_compound_prompt (L581) / base.project_compound_target (L389) UNCHANGED, which import the live highest-numbered pk_new_nu_model_v* prompts.py — the concrete train==inference mechanism, still enforced exactly as before. Everything else in the stage (trim, verbatim rebuild, qwen repair merge, accum/tts patch, grounding audit, CSV export) is downstream post-processing on the JSONL this file emits.","scripts":[{"file":"convert_sonnet_distillation_to_nuextract.py","role":"God node: Sonnet extraction JSON -> NuExtract training JSONL. Field-by-field schema reconcile + counted drops; reuses the sibling converter's prompt builder and target projector so train==inference.","key_functions":[{"name":"map_pkv_item","loc":"L408","does":"One Sonnet PKV dict -> one canonical _PKV dict. _PASSTHROUGH_KEYS (L177), auc_type via _AUC_TYPE_MAP, fed_fasted-first then fed_state normalize, route->drug_form (elimination-aware), precision/precision_type, verbatim_source, concentration_dependent; unmapped keys counted via _count_drop (L404)."},{"name":"map_ratio_to_parent_item","loc":"L503","does":"NEW 2026-07-21. Maps the metabolite-level ratio_to_parent list (_RATIO_TO_PARENT_KEYS L497: ratio/min_val/max_val/unit/ratio_kind/parent_compound_key/study_condition/precision), dropping source provenance — the pipeline stamps that post-hoc, it is never a model target."},{"name":"map_compound","loc":"L518","does":"One Sonnet compounds[] entry -> canonical compound. Maps each PKV list, food_effect (L471), linearity (L484), ratio_to_parent; counts OUT_OF_SCOPE blocks — ddi_roles/population_pk/formulation/cyp_*/transporter_roles and, new since 2026-07-20, pk_events; plus enzymes_major/minor, ddi_elimination, activation_role/notes."},{"name":"_map_verbatim_source","loc":"L338","does":"Fills verbatim_source from a 5-key fallback chain (L333): verbatim_source -> source_note -> source_note_unvalidated -> source_note_unverified -> notes, mirroring gold_extraction_pipeline/slice_json_to_training_cells.py::_grounding_text. Flagged as approximation, not certified verbatim."},{"name":"_count_residual_keys","loc":"L292","does":"NEW 2026-07-19. Counts any present `_residual_*` Track-B marker on a PKV item / food_effect block / compound in DROP_COUNTS. Does not change WHETHER they are dropped (always were) — only makes the loss visible."},{"name":"convert","loc":"L651","does":"rglobs extraction files, joins to spliced rows on row_id (skips + reports rows with no source text), runs the preflight (base._scan_gated_keys_present vs this example's active_gated_keys), sys.exit(1) on violation, writes JSONL, prints DROP_COUNTS to stderr."}],"interacts_with":["convert_synthgen_to_nuextract.py (imported as base)","live prompts.py + config.cfg (via base._REPO)","variability_compiler._precision_surface_type","gold_extraction_pipeline/*_extractions/*.json","gold_extraction_pipeline/priority18_final_spliced_rows.json"]},{"file":"convert_synthgen_to_nuextract.py","role":"Sibling synthetic-gold converter; supplies the SHARED prompt-build and target-projection machinery the Sonnet converter imports as `base`. Its _REPO block is the train==inference anchor.","key_functions":[{"name":"_REPO resolution block","loc":"L142-L169","does":"PK_REPO env override else highest (major,minor) pk_new_nu_model_v* carrying prompts.py via _version_sort_key (L133); sys.path.insert, then `import prompts` and `from config import cfg` — the SAME singleton pass2.py reads."},{"name":"build_compound_prompt","loc":"L581","does":"Reconstructs pass2._build_single_compound_prompt: deep-copies frozen template/example, stamps identity, gates linearity, applies every cfg-gated slot mutation (auc_subtype, dose_regimen, precision, and now capture_ratio_to_parent for metabolites, L536/L682/L703), calls prompts.build_nuextract_prompt; returns (prompt, active_gated_keys, allowed_keys_by_field)."},{"name":"project_compound_target","loc":"L389","does":"Projects a mapped compound into the short-key target, pruning each PKV item via _project_pkv_item (L293) against allowed_keys_by_field; ratio_to_parent goes through _project_ratio_to_parent_item (L369), whose keys stay canonical because the live prompt shows them that way."},{"name":"_allowed_keys_from_template","loc":"L568","does":"Derives {short_field: frozenset(short_subkeys)} straight off the SAME fully-mutated template dict just handed to build_nuextract_prompt, so the allowed set can never drift from what the model was shown."},{"name":"_scan_gated_keys_present / _GATED_KEYS_TO_CFG","loc":"L833 / L817","does":"Recursively finds gated short-keys in a completion. The map now has SEVEN entries — auc_type, auc_t_hours, freq, dpd, int_h, prec, and NEW ratio_to_parent -> (cfg.capture_ratio_to_parent, --ratio-to-parent) — each carrying the cfg attr + CLI flag named in the failure message (_report_preflight_failure L849)."},{"name":"_find_leaked_keys","loc":"L1004","does":"Recursively collects post-extraction/internal keys (in _MATERIALIZED_DROP L252 or '_'-prefixed) that must never appear in a target; backs run_template_leak_selftest (L1161)."}],"interacts_with":["live prompts.py","config.cfg","convert_sonnet_distillation_to_nuextract.py (consumer)"]},{"file":"trim_against_hand_gold.py","role":"Leakage-trim step: drops any training example whose source document (meta.id_row) also appears in the 39-row hand eval gold. Document identity only, deliberately not drug_id.","key_functions":[{"name":"load_gold_row_ids","loc":"L48","does":"Loads wip_gold_claude_set.json (default path L45, the event_derivation_clone copy), asserts 'rows' is a dict keyed by row_id, returns a frozenset of those keys."},{"name":"trim_one","loc":"L59","does":"Streams a raw JSONL, drops lines whose meta.id_row is in the gold set, writes *_trimmed.jsonl, returns (kept, dropped, dropped_ids)."},{"name":"main","loc":"L83","does":"CLI: single --in/--out or --glob over sonnet_distillation_*_<date>.jsonl, --gold override; reports per-file counts and the unique dropped row_ids."}],"interacts_with":["sonnet_distillation_*_<date>.jsonl","gold_annotation_tool_simulator_.../event_derivation_clone/data/wip_gold_claude_set.json","dedup_split_guard.py (rationale mirror, not imported)"]},{"file":"rebuild_prompts_with_verbatim_context.py","role":"Verbatim-context rebuild: swaps each prompt's raw pk_source_text for the Pass-0+1 pk_text_summary so training text matches what inference is actually fed.","key_functions":[{"name":"load_summaries","loc":"L44","does":"Reads lora_training_v107/.../summarize_input.csv, keeps only summary_done rows, returns {id_row: pk_text_summary} and {id_row: verbatim_by_category} parsed from detected_compounds.raw."},{"name":"rebuild_prompt","loc":"L68","does":"Replaces only the text between '# Context:\\n' and the following '\\nNOTE:'; returns None when either marker is missing so the caller keeps the example untouched."},{"name":"main","loc":"L79","does":"Globs *_trimmed.jsonl, rebuilds context, stamps meta.context_source='pk_text_summary_verbatim_2026-07-14' (+ meta.verbatim_by_category), writes *_trimmed_verbatim.jsonl, reports rebuilt / no-summary / no-marker counts. On the 2026-07-21 priority18 tranche this rebuilt 0/19 — output is byte-identical to the input."}],"interacts_with":["*_trimmed.jsonl","lora_training_v107/lora_training_summarized_set/summarize_input.csv","*_trimmed_verbatim.jsonl"]},{"file":"merge_verbatim_repairs_into_training.py","role":"NEW (2026-07-18). Folds the qwen cluster bundle's accepted verbatim_source repairs into the final training JSONL in place — the merge step MASTER_TODO flagged as missing. Patches the JSONL ONLY; never writes back into the extraction JSON corpus.","key_functions":[{"name":"load_repairs","loc":"L64","does":"Loads qwen2.5_14b-instruct-q4_K_M_accepted.csv keyed by (row_id, compound_name, family_short, item_index), renaming long family names to the training-schema short ones via LONG_TO_SHORT (L45), warning on duplicate keys (last wins)."},{"name":"main (verdict classification)","loc":"L128-L152","does":"For each matched item compares whitespace-normalized current vsrc against the bundle's original_vsrc: safe_update / already_correct_noop / no_change_needed / already_applied_previously / MISMATCH_skip. Only safe_update is ever written."},{"name":"main (apply path)","loc":"L183-L212","does":"--apply only: .bak_<stamp> per file first, rewrites just the target item's vsrc, re-serializes completion compactly, emits verbatim_repair_merge_applied_<stamp>.json. Default is dry-run + verbatim_repair_merge_report.csv."},{"name":"TRAIN_GLOB","loc":"L43","does":"Date-pinned to sonnet_distillation_*_20260717_trimmed_verbatim.jsonl — so unlike the undated-glob scripts it does NOT pick up the newer 20260721 priority18 tranche."}],"interacts_with":["verbatim_repair_cluster_bundle/results/qwen2.5_14b-instruct-q4_K_M_accepted.csv","sonnet_distillation_*_20260717_trimmed_verbatim.jsonl (rewritten in place)","convert_synthgen_to_nuextract.py's _CANON_TO_SHORT (copied, not imported)"]},{"file":"apply_accum_tts_to_training_jsonl.py","role":"NEW (2026-07-19). Surgical in-place patch, explicitly NOT a regeneration: inserts reviewed accumulation_ratio / time_to_steady_state gold items into the priority18 training completions. Its docstring is the standing reason a full converter re-run is currently unsafe.","key_functions":[{"name":"load_filled_priority18_rows","loc":"L116","does":"Reads gold_extraction_pipeline/field_audits/{accumulation_ratio,time_to_steady_state}_candidates.csv (utf-8-sig), keeping only fill_status=='filled' AND corpus=='priority18' rows."},{"name":"build_short_item","loc":"L95","does":"Maps canonical CSV columns to the short completion keys via FIELD_MAP (L69: value->val, value_type->vtype, drug_form->form, fed_fasted->fed, precision->prec, n_subjects->n_subj, verbatim_source->vsrc, ...), skipping empties so the item stays sparse like the file's existing PKV items."},{"name":"main (match + idempotence)","loc":"L153-L197","does":"Matches on meta.id_row + case-insensitive meta.compound_name; skips a candidate whose vsrc already sits in that compound's family list; warns about candidate pairs with no line in this tranche. Touches only the two family keys, never `prompt`, never any other completion field."},{"name":"main (apply path)","loc":"L202-L215","does":"Default dry-run; --apply copies the whole file to .bak_<stamp> first, rewrites with json.dumps(ensure_ascii=False) compact single-line style, writes apply_accum_tts_to_training_jsonl_<stamp>.json diff log."}],"interacts_with":["gold_extraction_pipeline/field_audits/*_candidates.csv","sonnet_distillation_priority18_20260717_trimmed_verbatim.jsonl (target, hardcoded L61)","merge_verbatim_repairs_into_training.py (its docstring's stated reason for existing)"]},{"file":"audit_verbatim_grounding.py","role":"NEW (2026-07-18). Read-only honesty audit over the whole final corpus — no writes to the JSONL. Answers 'are the numbers and quotes in the completions actually present in the Context we train on'.","key_functions":[{"name":"extract_context","loc":"L47","does":"Pulls the Context slice using the exact same '# Context:\\n' / '\\nNOTE:' boundary logic as rebuild_prompt; a row with either marker missing is recorded in no_context_rows, not silently scored."},{"name":"number_grounded_in","loc":"L61","does":"Ported from v108 utils/text_utils.py — digit-boundary check over decimal/FR-comma/space-thousands variants, plus a deliberately-documented extra comma-thousands form the production helper lacks."},{"name":"_best_window_ratio","loc":"L123","does":"vsrc fuzzy grounding: anchor-window SequenceMatcher ratio max'd with token overlap, same scorer as lora_training_v107/validate_notes_against_verbatim.py so results are comparable to its earlier 157-item finding. MATCH>=0.90, PARTIAL>=0.70, else MISMATCH."},{"name":"main","loc":"L150","does":"Walks FILES (L34, the undated *_trimmed_verbatim glob) over 13 FAMILIES incl. accumulation_ratio/time_to_steady_state, scores val/min_val/max_val and vsrc per item, prints per-family and per-language rates, writes verbatim_grounding_audit_report.json with the ungrounded and mismatched rows."}],"interacts_with":["sonnet_distillation_*_trimmed_verbatim.jsonl (read-only)","verbatim_grounding_audit_report.json (output)","pk_new_nu_model_v108/utils/text_utils.py (matcher ported, not imported)"]},{"file":"export_training_set_csv.py","role":"Flattens the final examples into one review CSV (Context text + compact completion JSON per row). Its glob is undated (L18), so it now sees both priority18 tranches.","key_functions":[{"name":"extract_context","loc":"L25","does":"Pulls the Context slice between '# Context:' and 'NOTE:'; unlike the audit's version it tolerates a missing NOTE marker and takes the tail."},{"name":"main","loc":"L34","does":"Globs HERE/*_trimmed_verbatim.jsonl, writes training_set_373_eyeball.csv with id_row/drug_name/compound_name/compound_type/language/source_file/context_verbatim/completion_json/context_source."},{"name":"GLOB / OUT_CSV","loc":"L18-L19","does":"Hardcoded undated glob + the literal 373-named output filename — both now understate reality (4 files / 392 lines match the glob); the CSV name is not recomputed from the row count."}],"interacts_with":["*_trimmed_verbatim.jsonl","training_set_373_eyeball.csv"]},{"file":"dedup_split_guard.py","role":"Standalone (still NOT wired into the pipeline) train/eval duplication guard on drug_id AND document_id; documents why molecular-scaffold leakage is irrelevant to a text-extraction fine-tune.","key_functions":[{"name":"check_disjoint","loc":"L61","does":"Reports train ∩ eval overlaps on drug_id and document_id independently as a LeakageReport."},{"name":"assert_disjoint","loc":"L76","does":"Hard gate: raises AssertionError with detail if either overlap is non-empty."},{"name":"run_selftest","loc":"L94","does":"Stdlib-only selftest over clean / drug-collision / doc-collision / both cases."}],"interacts_with":["(reusable utility; trim_against_hand_gold.py reimplements its document-identity idea rather than importing it)"]}]},"moduleIds":["finetune::convert_sonnet_distillation_to_nuextract.py","finetune::convert_synthgen_to_nuextract.py","finetune::trim_against_hand_gold.py","finetune::rebuild_prompts_with_verbatim_context.py","finetune::merge_verbatim_repairs_into_training.py","finetune::apply_accum_tts_to_training_jsonl.py","finetune::audit_verbatim_grounding.py","finetune::export_training_set_csv.py","finetune::dedup_split_guard.py","finetune::_pkg","finetune::NUEXTRACT_FINETUNE_RECIPE.md","finetune::README.md","finetune::training_cells_table_report_20260728.md","finetune::CODEX_HANDOFF_lora_training_script_draft_20260718.md","finetune::_scratch_default/ab_default_identity_check.py","finetune::_scratch_default/ab_flags_matrix.py","finetune::_scratch_default/ab_flags_on_pass2_vs_converter.py","finetune::build_armB_slice_training.py","finetune::build_table_training_cells_20260728.py","finetune::clean_training_cells.py","finetune::split_pool_train_val_test.py"],"godModuleId":"finetune::convert_sonnet_distillation_to_nuextract.py","featuredIds":["finetune::convert_sonnet_distillation_to_nuextract.py","finetune::convert_synthgen_to_nuextract.py","finetune::trim_against_hand_gold.py","finetune::rebuild_prompts_with_verbatim_context.py","finetune::merge_verbatim_repairs_into_training.py","finetune::apply_accum_tts_to_training_jsonl.py","finetune::audit_verbatim_grounding.py","finetune::export_training_set_csv.py","finetune::dedup_split_guard.py"]},{"id":"s7","label":"Fine-tune","repo":"lora_training","dir":"lora_training_v*","resolved_dir":"lora_training_v108","title":"distilled JSONL  →  QLoRA fine-tune  →  LoRA adapter","hue":"#fb923c","one_line":"QLoRA-fine-tunes NuExtract-2.0-8B on the distilled JSONL and now scores each checkpoint in-training (generative all-param F1 + real held-out val loss), writing a text-only LoRA adapter plus its eval curves.","narrative":"Stage S7 (\"Fine-tune\") is a small dedicated trainer plus its own eval, not a pipeline clone. The CODE lives in lora_training_v108/: one god-node trainer (train_lora.py, now 1212 lines), three eval scripts (plot_gen_eval.py, score_all_params_v2.py, audit_example_loss.py), a meta-device probe (scripts/probe_lora_targets.py), eight YAML configs, cluster bootstrap/sbatch shells and dated runbooks. Training-set ASSEMBLY sits upstream in the workspace-root finetune/ toolchain (convert_sonnet_distillation_to_nuextract.py -> trim_against_hand_gold.py, plus the pool builders build_armB_slice_training.py / split_pool_train_val_test.py) which emits plain {prompt, completion, meta} JSONL joined on meta.id_row. train_lora.py consumes that file directly: load_config (L176) strict-validates the YAML into a TrainConfig; load_jsonl (L231) strict-checks every row; profile_split/apply_truncation_policy (L327/L373) render each row through the real AutoProcessor chat template, measure tokens per row and either hard-error or drop overlength rows; CompletionOnlyCollator.__call__ (L416) masks the prompt span to -100 and RuntimeErrors if a batch has zero label tokens; load_model_with_lora (L485) loads 4-bit NF4 via BitsAndBytesConfig, resolves the auto class at runtime (resolve_auto_model_class, L463), and attaches LoRA to modules discovered from the LIVE model by regex (discover_lora_targets, L537) with a two-stage visual-tower refusal (L550-552 and audit_trainable_modules L570-571). The central change since the previous spec: the eval now EXISTS and has been RUN. train_lora.py carries an in-training callback, make_generative_eval_callback / GenerativeEvalRetention (L766/L789), that on every save generates real predictions on a held-out val split, scores them with score_all_params_v2.score_pairs (the SAME instrument as the post-hoc report), prints P/R/F1 + value/range/phantom/misattribution breakdowns, appends one record per eval to gen_eval_scores.jsonl (L787/L947), tracks the best-by-val-F1 checkpoint (BEST_CHECKPOINT.txt) and prunes to every-Nth-plus-best; separately, HF loss-eval is now wired on against a genuinely disjoint val split (eval_strategy = steps when dev != train, build_training_args L1022), giving a real train-loss-vs-val-loss overfit curve. plot_gen_eval.py turns gen_eval_scores.jsonl + train_log.jsonl into a tidy long CSV and curve PNGs; score_all_params_v2.py is the all-parameter trio scorer (FIX1..FIX7 + GMFE) run both in-training and post-hoc; audit_example_loss.py computes per-example completion-only loss worst-first to surface noisy/mislabeled rows. A POOL run (Arm A vs Arm B, configs/real_run_pool_armB.yaml over the screened widenet+oldcorpus pool, 2,349 examples = train 2,051 / val 205 / test 93) has completed: checkpoint-1000 (best-by-val, step 1000/1539) scores hand-gold F1 0.537 (P 0.892 / R 0.384, 38-row) beating priority18 0.460 and best stock 0.375. CODE vs RUNTIME split is now physical: code stays in lora_training_v108/, but the heavy adapters/checkpoints/gen_eval_scores.jsonl/plots/train_log.jsonl land under lora_runtime_v108/outputs/<run>/ (cluster $LORA_CLUSTER_ROOT=/nfs/scratch/$USER/lora_runtime_v108), the runtime root deliberately renamed to stop colliding with the lora_training_v* glob.","blurb":"Stage S7 (\"Fine-tune\") is a small dedicated trainer plus its own eval, not a pipeline clone.","inputs":[["sonnet_distillation_*_trimmed_verbatim.jsonl","file","s6"],["NuExtract-2.0-8B base weights (HF cache)","artifact"]],"outputs":[["final_adapter/ (PEFT LoRA + tokenizer)","artifact"],["checkpoint-N/ · train_log.jsonl · length_profile.json","file"]],"substeps":["probe_lora_targets (196/196 language-only)","TrainConfig validate (unknown key = hard exit)","QLoRA train on cluster (expandable_segments OOM fix)","length_profile + train_log.jsonl","final_adapter + resumable checkpoints"],"spine":[],"diagrams":["04_distill_finetune_flow","01_end_to_end_flow"],"handoff_in":"One kind of file crosses the boundary: {prompt, completion, meta} JSONL joined on meta.id_row. For the current run it is finetune/pool_armB_20260725.{train,val,test}.jsonl (the screened widenet+oldcorpus pool, split BY ROW so no row crosses train/val/test); for the predecessors it is finetune/priority18_armB_slices_20260722.jsonl and finetune/sonnet_distillation_priority18_20260721_trimmed_verbatim.jsonl. These are produced upstream by finetune/convert_sonnet_distillation_to_nuextract.py -> trim_against_hand_gold.py (and, for the pool, build_armB_slice_training.py -> split_pool_train_val_test.py). trim_against_hand_gold.py diffs meta.id_row against the hand gold to guarantee no train/eval leakage. train_lora.py resolves paths relative to WORKSPACE_ROOT (__file__.resolve().parents[1], L44), so the cluster layout must place lora_training_v108/ and finetune/ as siblings under /nfs/scratch/$USER/LLM_Projects. No DB access at this stage.","handoff_out":"Out as filesystem artifacts under lora_runtime_v108/outputs/<run>/ (e.g. armB_pool): final_adapter/ (PEFT LoRA weights + tokenizer + train_config.json), checkpoint-N/ (adapter + optimizer/scheduler/rng state + trainer_state.json), BEST_CHECKPOINT.txt (best-by-val-F1), gen_eval_scores.jsonl (per-eval P/R/F1 + value/range/by_param/phantom breakdowns), train_log.jsonl (per-step loss/lr/grad_norm + eval_loss), length_profile.json, tb_logs/, and the plot_gen_eval.py PNGs + gen_eval_curve.csv. The adapter is applied by loading stock numind/NuExtract-2.0-8B and attaching it — removing it restores the baseline exactly, which is what makes the before/after comparison honest. Two evals already run against the held-out pool val DURING training: generative all-param F1 (the selection signal, via score_all_params_v2.score_pairs) and HF val loss (the overfit signal). The final, external verdict is the 38/39-row HAND gold, scored post-hoc by score_all_params_v2.py --gold wip_gold_claude_set.json --exclude-rows 2501 (currently run from lora_eval_cluster_bundle/eval_pool_armB.sh); the pool Arm B best checkpoint scored 0.537 there. Both the in-training and post-hoc scorer must reuse the SAME prompt construction as training or they measure prompt drift.","db_tables":[],"invariants":["The eval is NOT downstream anymore — it is inside this stage. train_lora.py's GenerativeEvalRetention callback (L766/L789) generates real val predictions on every save and scores them with score_all_params_v2.score_pairs, writing gen_eval_scores.jsonl. The pool Arm B run has completed with a real verdict (checkpoint-1000, hand-gold F1 0.537 > priority18 0.460 > best stock 0.375). Any atlas claim that S7 'has no eval' or that the consumer 'does not exist yet' is now false and must be removed.","In-training F1 and the post-hoc report share ONE metric definition. score_pairs (L601) uses the same row_bags + score_param as score_all_params_v2.main, so the F1 printed during training equals the F1 the final report would compute on the same pairs — the two are not allowed to drift.","Vision tower must stay frozen — twice. discover_lora_targets (L550-552) SystemExits if the regex catches any visual.* module, and audit_trainable_modules (L570-571) re-checks named_parameters after get_peft_model and refuses if any visual tensor requires grad. This guard caught the stale-prefix bug; never disable it.","LoRA targets are DISCOVERED from the live model, never assumed. A regex matching zero modules is a hard SystemExit that prints real projection names (L546) — it does not silently train nothing. scripts/probe_lora_targets.py derives the regex on the meta device instead of guessing.","Config is strict-fail: unknown YAML keys, a non-nuextract2_qwen25vl profile, non-transformers_sft backend, packing=true, completion_only_loss=false, both 4bit+8bit, or truncate_policy=truncate_context each SystemExit at load_config (L176-197). One JSONL row must remain one full example — packing is banned.","Loss is computed on the completion only. CompletionOnlyCollator masks the prompt span to -100 and RuntimeErrors if the mask leaves zero label tokens for the whole batch (L441) — a prompt that fills the window fails loudly rather than training on nothing.","audit_example_loss.py computes this SAME completion-only masked loss, loads its OWN 4-bit model instance, and is READ-ONLY on data — but it must NOT share a GPU with a live train (VRAM). Run it after training or on a second allocation.","Per-parameter val F1 — not loss or perplexity — is the real dataset-quality / generalisation signal. Loss/PPL over structured JSON is dominated by boilerplate tokens and self-distilled targets, so both plot_gen_eval.py and audit_example_loss.py flag it a WEAK aggregate gauge; its only informative use is the tail (highest-loss rows = likeliest mislabeled).","eval_loss with dev == train is training loss under another name. train_lora warns at load (L1092) and at train end (L757-761); the pool config fixes it by pointing dev_jsonl_path at a genuinely disjoint held-out val split, so its eval_loss is a real overfit signal that COMPLEMENTS (never replaces) the F1 selection signal.","Never lower max_seq_length as an OOM fix. Range-shaped items concentrate in the longest (prosed-table) rows, so any length filter is a biased sample; if a length OOMs the answer is a bigger card, not a shorter window (priority18: 16384 costs 6/45 range items, 12288 ~49%).","Zero id_row overlap between the training JSONL and the hand gold, enforced upstream by finetune/trim_against_hand_gold.py. Row 2501/posaconazole is a known 1-row leak into the pool, so the pool hand-gold eval reports 38-row (row 2501 excluded); if leakage is not controlled the number is meaningless.","Range capture is scored off min_val/max_val/range being populated (score_param's value-vs-range item kind), NEVER off value_type — most range-shaped items are labelled value/median/mean, and range_average is a pass4-provenance marker, not a range flag.","score_all_params_v2's local unit-canonicalizer (FIX2, glyph-folding µ/·/hr/litre etc.) is LOCAL to this scorer and does NOT touch the governed evaluate.py — the training-side eval may normalise units more aggressively than the production evaluator without changing pipeline behaviour.","The gen-eval subset is fixed ONCE as a seeded sample (not a prefix, L806) so every checkpoint scores the SAME rows and 'best' is comparable across saves; and batch generation uses LEFT padding (mandatory for a decoder-only model) with a byte-identical selftest + auto-fallback to sequential on mismatch.","VRAM is reported as BOTH allocated and reserved (_vram, L659-673). Reporting reserved alone once produced a confident-and-wrong 'needs an H100' call — a large alloc/reserved gap means allocator fragmentation, not capacity (the reason PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True is set at L1060).","The auto-model class is resolved at runtime, not imported by name: AutoModelForImageTextToText (transformers 5.6.2, cluster) with an AutoModelForVision2Seq fallback, failing loudly with the version if neither exists (resolve_auto_model_class, L463-482).","Provenance travels with the weights: train_config.json is written to the output root and copied into every checkpoint (on_save, L614-617) and into final_adapter (L1197), so no adapter exists without the exact config that produced it. BEST_CHECKPOINT.txt records which checkpoint won by val F1.","CODE and RUNTIME are separate trees. Code + input data live in lora_training_v108/ (and workspace-root finetune/); all heavy artifacts (adapters, checkpoints, gen_eval_scores.jsonl, plots, train_log.jsonl, hf_cache) land in lora_runtime_v108/ (cluster $LORA_CLUSTER_ROOT). The runtime root was renamed off lora_training_v108 specifically to stop it colliding with the lora_training_v* glob — never scp outputs into the code tree.","Never record an absence in this workspace from a Grep miss. Root .gitignore is an allowlist (first rule /*) and ignores lora_training_v108/, lora_runtime_v108/ and finetune/; ripgrep-based tools return empty with no error. Use ls/Glob/direct reads, and run rg --no-ignore before declaring anything absent."],"godDoc":{"god_node":"train_lora.py","why":"The stage's contract lives in one 1212-line file. train_lora.py owns the TrainConfig every YAML validates against, JSONL loading and strict shape checks, chat-template rendering, token profiling and the truncation policy, the completion-only loss mask, 4-bit quantization, live-model LoRA target discovery plus the two-stage visual-tower refusal, the Trainer wiring, the progress/VRAM callback, and now BOTH evals: the in-training generative all-param F1 callback (which imports score_all_params_v2 and writes gen_eval_scores.jsonl) and the HF held-out val-loss path. Configs, the probe, the three eval scripts and the runbooks all exist to feed or verify it; score_all_params_v2 is imported directly by it, so the eval graph is spliced into this node rather than downstream of it.","scripts":[{"file":"train_lora.py","role":"God-node trainer: YAML->TrainConfig validation, JSONL loading, chat-template token profiling, completion-only masking, 4-bit + live-model LoRA attach with the two-stage visual-tower refusal, Trainer loop, the in-training generative F1 + retention callback, HF held-out val-loss, adapter save. 1212 lines.","key_functions":[{"name":"load_config","loc":"L176","does":"Parses YAML into TrainConfig; SystemExits on unknown keys, non-nuextract2_qwen25vl profile, non-transformers_sft backend, packing=true, completion_only_loss=false, both 4bit+8bit, or truncate_policy=truncate_context (deliberately unimplemented)."},{"name":"CompletionOnlyCollator.__call__","loc":"L416","does":"Tokenizes full text, sets labels=-100 over padding and the prompt span; RuntimeErrors if the batch exceeds max_seq_length (L428) or if the mask leaves zero label tokens for the whole batch (L441)."},{"name":"discover_lora_targets / audit_trainable_modules","loc":"L537 / L561","does":"Matches lora_target_regex against the LIVE model's named_modules (SystemExit + sample projection names if zero match, L546), refuses any visual.* target (L550-552), then re-audits named_parameters after get_peft_model and refuses again if any visual tensor requires grad (L570-571)."},{"name":"make_generative_eval_callback / GenerativeEvalRetention","loc":"L766 / L789","does":"On each save (every generative_eval_every_n_saves) generates real val predictions (batched, left-padded greedy with a byte-identical selftest + auto-fallback), scores with score_all_params_v2.score_pairs (L784), appends a full record to gen_eval_scores.jsonl (L787/L947), tracks best-by-val-F1 (BEST_CHECKPOINT.txt) and prunes to every-Nth + best (L967-980)."},{"name":"run","loc":"L1043","does":"Orchestrates: sets HF_HOME and PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True (L1060, the OOM-fragmentation fix), profiles, honours --profile-lengths/--dry-run, warns if dev==train (L1092), wires the log/progress/gen-eval callbacks (L1149-1167), trains with resume_from_checkpoint, saves final_adapter (L1195)."},{"name":"build_training_args","loc":"L993","does":"Builds TrainingArguments; eval_strategy = 'steps' when a real dev split exists else 'no' (L1022), so HF loss-eval runs against the held-out val split; disables HF save_total_limit while the every-Nth+best retention callback is the sole pruner (L1028)."}],"interacts_with":["configs/*.yaml","finetune/pool_armB_20260725.{train,val}.jsonl","score_all_params_v2.py (imported for in-training scoring)","scripts/probe_lora_targets.py","lora_runtime_v108/outputs/<run>/","transformers/peft/bitsandbytes"]},{"file":"plot_gen_eval.py","role":"Turns a run's logs into curve graphs + a tidy CSV. Reads gen_eval_scores.jsonl (per-eval P/R/F1/value/range/by_param/phantoms) and train_log.jsonl (per-step loss/lr/grad_norm + per-eval eval_loss). CPU-only; CSV always written, PNGs only if matplotlib imports. 241 lines.","key_functions":[{"name":"_ppl","loc":"L44","does":"Perplexity = exp(loss), exponent clamped to 700 so a transient early-loss spike never crashes a plot. Perplexity is derived retroactively from logged losses (no run restart) and is flagged a WEAK dataset-quality gauge; per-param val F1 is the real signal."},{"name":"load","loc":"L55","does":"Reads a JSONL of records and sorts by step, so eval records arrive in training order regardless of file append order."},{"name":"main","loc":"L64","does":"Auto-discovers train_log.jsonl beside the scores file, emits gen_eval_curve.csv (long/tidy) plus the PNGs: overall F1/P/R, value-vs-range F1, per-param F1, train-loss-vs-val-F1, train-vs-val loss (overfit curve), perplexity, lr/grad-norm."}],"interacts_with":["lora_runtime_v108/outputs/<run>/gen_eval_scores.jsonl","lora_runtime_v108/outputs/<run>/train_log.jsonl","matplotlib (optional)"]},{"file":"score_all_params_v2.py","role":"All-parameter trio scorer v2 (Sonnet / NuExtract-2 / qwen2.5:32b vs the hand JSON gold), implementing FIX1..FIX7 + the GMFE/within-fold overlay. Its score_pairs() is imported by train_lora for the in-training eval, so in-training F1 and the post-hoc report share ONE metric. 665 lines.","key_functions":[{"name":"score_pairs","loc":"L601","does":"The in-training entry point: for each (pred_text, gold) it salvage-parses, bags per param via row_bags, scores via score_param, and returns flat P/R/F1/tp/fp/fn plus value/range/by_param/phantoms/misattributed/pred_unparsed — the exact record shape written to gen_eval_scores.jsonl."},{"name":"score_param","loc":"L255","does":"Item<->item match within a (compound,param) bag: rep within tol OR intervals overlap; phantom-guard against matched gold; splits tp/fp/fn into value vs range kinds (FIX1)."},{"name":"canonicalize_gold / align_compound_bags","loc":"L302 / L213","does":"canonical gold-scope collapse to one rep per (compound x param x context-bucket) (FIX3); name-aligned compound bag matching (FIX5)."},{"name":"misattributions / gmfe_stats / prf","loc":"L349 / L368 / L381","does":"FIX4 right-value-wrong-parameter counting (unit-dimension gated, a subset of phantoms); GMFE geometric-mean fold-error + %within-2/3-fold on matched continuous pairs; the shared precision/recall/F1 helper."},{"name":"main / parse_tol","loc":"L414 / L406","does":"The post-hoc CLI over an arms directory vs gold (--gold, --exclude-rows, --granularity, --gold-scope, --compound-aware); parse_tol reads the tolerance spec. The unit canonicalizer (FIX2) is LOCAL to this scorer and does not touch the governed evaluate.py."}],"interacts_with":["train_lora.py (imports score_pairs for in-training eval)","wip_gold_claude_set.json (post-hoc gold)","lora_eval_cluster_bundle/ (post-hoc adapter-vs-gold scoring)"]},{"file":"audit_example_loss.py","role":"Per-example completion-only loss over a split, worst-first, to surface noisy/mislabeled training rows. Computes the SAME prompt-masked loss train_lora optimizes. Runs on a NODE with the 4-bit model, READ-ONLY on data, loads its OWN model instance. 218 lines.","key_functions":[{"name":"load_model_for_eval","loc":"L70","does":"Loads the base model in the SAME 4-bit config as training but WITHOUT the LoRA training wrapper (no get_peft_model / prepare_for_kbit); with --adapter, stacks a trained checkpoint via PeftModel so the audit reflects what that checkpoint could/could not fit."},{"name":"main","loc":"L108","does":"Reuses train_lora.load_config / setup_processor / CompletionOnlyCollator, runs each example through model(**batch) under no_grad, records loss/perplexity/n_completion_tokens, sorts worst-first, and writes a utf-8-sig .csv + full-meta .jsonl (error rows sink to the bottom)."},{"name":"_ppl / _preview","loc":"L56 / L66","does":"Clamped exp(loss) perplexity and a whitespace-collapsed target preview for the CSV. The docstring is explicit that this loss is a WEAK aggregate gauge; its VALUE is the tail (highest-loss = likeliest-mislabeled rows), complementing per-param val F1."}],"interacts_with":["train_lora.py (imports load_config/setup_processor/CompletionOnlyCollator/resolve_auto_model_class)","configs/real_run_pool_armB.yaml","finetune/pool_armB_20260725.{train,val}.jsonl"]},{"file":"scripts/probe_lora_targets.py","role":"Meta-device model-tree probe: derives and self-checks the LoRA target regex without reading weights or touching a GPU. Exists because a guessed prefix (model.layers) matched nothing under transformers 5.6.2.","key_functions":[{"name":"main (auto-class resolve + meta build)","loc":"L40","does":"Prefers AutoModelForImageTextToText, falls back to AutoModelForVision2Seq, builds the model under accelerate.init_empty_weights (no VRAM), enumerates named_modules and splits projections into visual vs non-visual."},{"name":"main (regex derivation + self-check)","loc":"L98","does":"Collapses layer indices to N, emits a paste-ready lora_target_regex, then re-applies it: reports matched/total non-visual projections and asserts 0 visual leaks (the verified 196/196, 0-visual result), returning 1 on any leak."}],"interacts_with":["numind/NuExtract-2.0-8B config","configs/*.yaml (lora_target_regex)","train_lora.py:discover_lora_targets"]},{"file":"configs/real_run_pool_armB.yaml","role":"The current scale-up run: POOL (widenet+oldcorpus, 2,349 ex) Arm B, 3 epochs, lora_r 8 / dropout 0.10 / weight_decay 0.01, max_seq_length 8192, BOTH evals on. Outputs to lora_runtime_v108/outputs/armB_pool.","key_functions":[{"name":"eval_enabled / dev_jsonl_path","loc":"L69 / L70","does":"true, with dev pointed at the disjoint pool val split (not train) — so HF eval_loss is REAL held-out val loss, the classic overfit signal complementing the F1 eval."},{"name":"generative_eval_* block","loc":"L134-L150","does":"generative_eval_enabled true, val = pool_armB val, cap 96 gens/save, max_new_tokens 4096, tol 0.02, every 2nd save (~200 steps), batch_size 8 (left-padded, byte-identical selftest). Scored by score_all_params_v2 -> gen_eval_scores.jsonl; this F1 is the SELECTION signal."},{"name":"keep_every_nth_checkpoint / keep_best_checkpoint","loc":"L153 / L154","does":"Keep every 10th save + best-by-val-F1; HF save_total_limit auto-disabled. Fix for priority18 Arm B where save_total_limit:3 nearly lost the winning checkpoint-80."},{"name":"output_dir / hf_home","loc":"L71 / L60","does":"$LORA_OUTPUT_DIR/armB_pool and $LORA_CLUSTER_ROOT/hf_cache; on the cluster $LORA_CLUSTER_ROOT=/nfs/scratch/$USER/lora_runtime_v108, keeping ALL weights/checkpoints/eval in the runtime tree, never the code tree."}],"interacts_with":["train_lora.py","finetune/pool_armB_20260725.{train,val}.jsonl","lora_runtime_v108/outputs/armB_pool/","POOL_ARMB_LAUNCH_RUNBOOK_20260725.md"]},{"file":"configs/real_run_priority18_armB.yaml","role":"The priority18 Arm B predecessor: one ADME slice in, JSON for that slice out (structural citation, no vsrc). The run the pool config scaled up from; hand-gold baseline to beat was F1 0.460.","key_functions":[{"name":"train_jsonl_path / dev_jsonl_path","loc":"L38 / L39","does":"Both point at finetune/priority18_armB_slices_20260722.jsonl (44 baseline cells / 173 items / 16 rows) — dev==train here, which is exactly why its eval_loss was uninformative and the pool run switched to a disjoint split."},{"name":"output_dir","loc":"L40","does":"$LORA_OUTPUT_DIR/armB_priority18 — same runtime routing as the pool run; artifacts land under lora_runtime_v108/outputs/."}],"interacts_with":["train_lora.py","finetune/build_armB_slice_training.py","ARM_A_VS_ARM_B_TRAINING_RUNBOOK_20260722.md"]},{"file":"POOL_ARMB_LAUNCH_RUNBOOK_20260725.md (workspace root)","role":"The current cluster runbook: self-contained launch procedure + state for the pool Arm B run. Records the CODE-vs-RUNTIME path rule, the literal scp/tmux/srun blocks, the two evals, and the finished result. If it disagrees with the config, the config wins.","key_functions":[{"name":"Cluster layout rule","loc":"The rule that ends the scp confusion","does":"CODE+DATA the run READS -> /nfs/scratch/$USER/LLM_Projects/{lora_training_v108, finetune}/ (scp here); OUTPUTS+hf_cache it WRITES -> /nfs/scratch/$USER/lora_runtime_v108/ (never scp here). The rename killed the lora_training_v108 name collision that caused every stale-config incident."},{"name":"LAUNCH + healthy-run checklist","loc":"LAUNCH / What you should see","does":"The literal push, tmux-on-login-node, srun -p gpu-l40,gpu-a40, module load + conda activate nuextract_lora, the exact env exports, and the launch command; plus the expected log lines (205 val ex, batch selftest PASS, eval_loss + [gen-eval] F1)
