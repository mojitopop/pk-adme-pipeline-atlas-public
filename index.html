  P.forEach((row,gi)=>{
    const cx=mL+gi*gw+gw/2, x0=cx-inner/2;
    if(gi>0) s+=`<line class="gridln" x1="${mL+gi*gw}" y1="${mT}" x2="${mL+gi*gw}" y2="${mT+plotH}" stroke-opacity=".22"/>`;
    selArms.forEach((a,i)=>{
      const sc=row.scores[a.key]; if(!sc||typeof sc[met]!=='number') return;
      const v=sc[met], h=v*plotH, x=x0+i*bw, y=mT+plotH-h, col=armHueIn(arms,a.key);
      s+=`<rect x="${x+bw*0.12}" y="${y}" width="${Math.max(2,bw*0.76)}" height="${Math.max(1,h)}" rx="2" fill="${col}" fill-opacity=".9">
            <title>${esc(a.label)} — ${esc(row.param)}
${metLab} = ${v.toFixed(3)}  (tp ${sc.tp} · fp ${sc.fp} · fn ${sc.fn} · gold ${sc.gold})</title></rect>`;
      if(n<=3 && v>=0.02) s+=`<text class="vlbl" x="${x+bw*0.5}" y="${y-3}" text-anchor="middle" fill="${col}">${v.toFixed(2)}</text>`;
    });
    // Reference targets: dashed line + marker over the group. These are annotations, never ranked arms.
    targets.forEach((target,ti)=>{ const t=(target.by_param||{})[row.param];
      const tv=(t && typeof t[met]==='number') ? t[met] : (t && typeof t.coverage==='number' ? t.coverage : null);
      if(typeof tv==='number'){ const ty=mT+plotH-tv*plotH, lx0=cx-inner/2-3, lx1=cx+inner/2+3, col=targetColor(target), dx=(ti-(targets.length-1)/2)*9;
        s+=`<line x1="${lx0}" y1="${ty}" x2="${lx1}" y2="${ty}" stroke="${col}" stroke-width="2" stroke-dasharray="5 3" stroke-opacity=".97"/>
            <path d="M${cx+dx-4.5} ${ty} L${cx+dx} ${ty-4.5} L${cx+dx+4.5} ${ty} L${cx+dx} ${ty+4.5} Z" fill="${col}" fill-opacity=".97">
              <title>${esc(target.label)} · ${esc(target.eval_set||'')}
${esc(target.metric_label||metLab)} = ${tv.toFixed(3)}${t&&t.exact!==undefined?` · exact ${t.exact}/${t.gold} · review ${t.approx}`:''}
${esc(target.legend||'reference target')}</title></path>`; } });
    const ly=mT+plotH+13;
    s+=`<text class="axlbl" x="${cx}" y="${ly}" text-anchor="end" transform="rotate(-40 ${cx} ${ly})">${esc(row.param).slice(0,22)} ·${row.gold_ref}</text>`;
  });
  s+=`<line class="ax" x1="${mL}" y1="${mT+plotH}" x2="${W-mR}" y2="${mT+plotH}"/><line class="ax" x1="${mL}" y1="${mT}" x2="${mL}" y2="${mT+plotH}"/>`;
  return leg+`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="per-parameter ${metLab} by arm, one cluster per parameter${targets.length?', with reference target overlays':''}">${s}</svg>`;
}

/* ---- breakdowns: pick a DIMENSION (category / composition / db_source), one cluster per subset ---- */
const BMETS=[['f1','F1'],['r','Recall'],['p','Precision']];
function bscore(dimKey,subKey,armKey){
  const d=(BREAKD.scores||{})[dimKey]||{}; const s=d[subKey]||{}; return s[armKey]||null;
}
function renderBreakdowns(){
  const V=$('#scoreView');
  const dims=BREAKD.dimensions||[], arms=BREAKD.arms||[], meta=BREAKD.meta||{};
  if(!dims.length){ V.innerHTML=scoreTabsHTML()+`<div class="vsub">No breakdown data. Run <code>_build/gen_scores.py</code> and rebuild.</div>`; return; }
  if(!scoreState.bDim||!dims.some(d=>d.key===scoreState.bDim)) scoreState.bDim=dims[0].key;
  const dim=dims.find(d=>d.key===scoreState.bDim);
  const met=scoreState.bMetric||dim.default_metric||'f1', metLab=(BMETS.find(m=>m[0]===met)||['','F1'])[1];
  if(!scoreState.bArms) scoreState.bArms=arms.filter(a=>a.default).map(a=>a.key);
  let selKeys=scoreState.bArms.filter(k=>arms.some(a=>a.key===k));
  if(!selKeys.length){ selKeys=arms.filter(a=>a.default).map(a=>a.key); scoreState.bArms=selKeys; }
  const selArms=arms.filter(a=>selKeys.includes(a.key));
  V.innerHTML=scoreTabsHTML()+`
    <div class="vsub">Per-parameter <b>breakdowns</b> on the full gold (${esc(meta.lens||'')}), full-gold arms
      only. Pick a dimension; each cluster is a subset, each bar an arm.</div>
    <div class="chips" id="bDim" style="margin-bottom:4px">${dims.map(d=>`<button class="chipbtn" style="--gh:#fbbf24"
      aria-pressed="${d.key===dim.key}" onclick="window.__bdim('${esc(d.key)}')">${esc(d.label)}</button>`).join('')}</div>
    <div class="caveat"${dim.confounded?' style="border-left-color:#fb923c;background:rgba(251,146,60,.06)"':''}>${dim.confounded?'<b>Read RECALL.</b> ':''}${esc(dim.note||'')}</div>
    <div class="chips">${BMETS.map(([k,l])=>`<button class="chipbtn" style="--gh:#fbbf24"
      aria-pressed="${k===met}" onclick="window.__bmetric('${k}')">${l}</button>`).join('')}</div>
    <div class="chips" id="bArms">${arms.map(a=>{const on=selKeys.includes(a.key),c=armHueIn(arms,a.key);
      return `<button class="chipbtn" style="--gh:${c}" aria-pressed="${on}" title="${esc(a.status||a.label)}" onclick="window.__barm('${esc(a.key)}')">
        <span style="color:${c}">${on?'●':'○'}</span> ${esc(a.label)}</button>`;}).join('')}</div>
    <div class="chartbox">${breakdownBarsHTML(dim,arms,selArms,met)}</div>
    <div class="vhead" style="font-size:14px;margin:18px 0 8px">${esc(dim.label)} · ${dim.subsets.length} subsets · ${selArms.length} arm${selArms.length>1?'s':''} · ${metLab}${dim.confounded?' (recall)':''}</div>
    <div style="overflow:auto;max-height:40vh;border:1px solid var(--line);border-radius:12px">
    <table class="stbl"><thead><tr><th>Arm</th>${dim.subsets.map(sb=>`<th style="text-align:right">${esc(sb.label)}</th>`).join('')}</tr></thead>
    <tbody>${selArms.map(a=>`<tr><td class="v" style="color:${armHueIn(arms,a.key)}">${esc(a.label)}</td>
      ${dim.subsets.map(sb=>{const blk=bscore(dim.key,sb.key,a.key); return `<td class="num">${(!blk||!blk.gold)?'<span style=\"color:var(--faint2)\">n/a</span>':(typeof blk[met]==='number'?blk[met].toFixed(3):'—')}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div>
    ${meta.source?`<div class="caveat" style="border-left-color:var(--s2);background:rgba(56,189,248,.05);color:var(--dim);margin-top:14px">Source: <code>${esc(meta.source)}</code></div>`:''}`;
}
function breakdownBarsHTML(dim,arms,selArms,met){
  const subs=dim.subsets||[], metLab=(BMETS.find(m=>m[0]===met)||['','F1'])[1];
  if(!selArms.length) return `<div style="padding:40px;text-align:center;color:var(--faint2);font-family:var(--mono);font-size:12px">select at least one arm</div>`;
  const leg=`<div class="armleg">${selArms.map(a=>`<span><i style="background:${armHueIn(arms,a.key)}"></i>${esc(a.label)}</span>`).join('')}</div>`;
  const W=1000,H=344,mL=48,mR=16,mT=18,mB=76, plotH=H-mT-mB;
  const gw=(W-mL-mR)/subs.length, inner=gw*0.8, n=selArms.length, bw=inner/n;
  let s='';
  for(let g=0;g<=4;g++){ const v=g/4, y=mT+(1-v)*plotH;
    s+=`<line class="gridln" x1="${mL}" y1="${y}" x2="${W-mR}" y2="${y}"/>
        <text class="axlbl" x="${mL-8}" y="${y+4}" text-anchor="end">${v.toFixed(2)}</text>`; }
  subs.forEach((sb,gi)=>{
    const cx=mL+gi*gw+gw/2, x0=cx-inner/2;
    if(gi>0) s+=`<line class="gridln" x1="${mL+gi*gw}" y1="${mT}" x2="${mL+gi*gw}" y2="${mT+plotH}" stroke-opacity=".22"/>`;
    selArms.forEach((a,i)=>{
      const blk=bscore(dim.key,sb.key,a.key), x=x0+i*bw, col=armHueIn(arms,a.key);
      if(!blk||!blk.gold){ s+=`<text x="${x+bw*0.5}" y="${mT+plotH-3}" text-anchor="middle" fill="var(--faint2)" font-size="8">n/a</text>`; return; }
      const v=blk[met]; if(typeof v!=='number') return;
      const h=v*plotH, y=mT+plotH-h;
      s+=`<rect x="${x+bw*0.12}" y="${y}" width="${Math.max(2,bw*0.76)}" height="${Math.max(1,h)}" rx="2" fill="${col}" fill-opacity=".9">
            <title>${esc(a.label)} — ${esc(sb.label)}
${metLab} = ${v.toFixed(3)}  (gold ${blk.gold})</title></rect>`;
      if(n<=4 && v>=0.02) s+=`<text class="vlbl" x="${x+bw*0.5}" y="${y-3}" text-anchor="middle" fill="${col}">${v.toFixed(2)}</text>`;
    });
    s+=`<text class="slbl" x="${cx}" y="${H-mB+22}" text-anchor="middle">${esc(sb.label).slice(0,20)}</text>`;
  });
  s+=`<line class="ax" x1="${mL}" y1="${mT+plotH}" x2="${W-mR}" y2="${mT+plotH}"/><line class="ax" x1="${mL}" y1="${mT}" x2="${mL}" y2="${mT+plotH}"/>`;
  return leg+`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(dim.label)} ${metLab} by arm, one cluster per subset">${s}</svg>`;
}

function renderScoring(){
  if(scoreState.tab==='arms') return renderArms();
  if(scoreState.tab==='params') return renderParams();
  if(scoreState.tab==='breakdowns') return renderBreakdowns();
  const V=$('#scoreView');
  const groups=[...new Set(SCOR.runs.map(r=>r.group))]
    .sort((a,b)=>Object.keys(GROUP_META).indexOf(a)-Object.keys(GROUP_META).indexOf(b));
  if(!groups.includes(scoreState.group)) scoreState.group=groups[0];
  const gm=GROUP_META[scoreState.group]||{label:scoreState.group,hue:'#a78bfa',desc:''};
  const runs=SCOR.runs.filter(r=>r.group===scoreState.group);
  const METRICS=[['l1_f1','L1 F1'],['l1_p','L1 precision'],['l1_r','L1 recall'],['scenario','scenario / L2']];
  V.innerHTML=`
    ${scoreTabsHTML()}
    <div class="vsub">Parsed from <code>SCORING_EVOLUTION.md</code> — ${SCOR.runs.length} runs across ${SCOR.eval_sets.length} eval sets.
      Each point is one recorded evaluation. Lines connect runs <em>within the same eval set only</em>.</div>
    <div class="caveat"><b>Eval sets are not mutually comparable.</b> ${esc(gm.desc)}
      Comparing an F1 from one set against another says nothing — switch groups below rather than reading across them.</div>
    <div class="chips" id="scGroups">${groups.map(g=>{const m=GROUP_META[g]||{label:g,hue:'#a78bfa'};
      return `<button class="chipbtn" style="--gh:${m.hue}" aria-pressed="${g===scoreState.group}" onclick="window.__scg('${g}')">
        <span style="color:${m.hue}">●</span> ${esc(m.label)} <span style="color:var(--faint2)">${SCOR.runs.filter(r=>r.group===g).length}</span></button>`;}).join('')}</div>
    <div class="chips">${METRICS.map(([k,l])=>`<button class="chipbtn" style="--gh:${gm.hue}" aria-pressed="${k===scoreState.metric}" onclick="window.__scm('${k}')">${l}</button>`).join('')}</div>
    <div class="chartbox">${chartHTML(runs,scoreState.metric,gm.hue)}</div>
    <div class="vhead" style="font-size:14px;margin:18px 0 8px">All ${runs.length} runs · ${esc(gm.label)}</div>
    <div style="overflow:auto;max-height:46vh;border:1px solid var(--line);border-radius:12px">
    <table class="stbl"><thead><tr><th>Version</th><th>Eval set</th><th style="text-align:right">P</th>
      <th style="text-align:right">R</th><th style="text-align:right">F1</th><th>Status</th><th>Key move</th></tr></thead>
    <tbody>${runs.map(r=>`<tr><td class="v">${esc(r.version)}</td><td class="v" style="color:var(--dim2)">${esc(r.eval_set)}</td>
      <td class="num">${fmtN(r.l1_p)}</td><td class="num">${fmtN(r.l1_r)}</td><td class="num">${fmtN(r.l1_f1)}</td>
      <td class="st st-${esc(r.status||'')}">${esc(r.status||'—')}</td><td>${esc(r.key_move||'')}</td></tr>`).join('')}</tbody></table></div>
    ${SCOR.notes&&SCOR.notes.length?`<div class="vhead" style="font-size:14px;margin:20px 0 8px">Caveats from the ledger</div>
      ${SCOR.notes.map(n=>`<div class="caveat" style="border-left-color:var(--s2);background:rgba(56,189,248,.05);color:var(--dim)">${esc(n)}</div>`).join('')}`:''}`;
}
function fmtN(v){ return (typeof v==='number')? v.toFixed(3) : '<span style="color:var(--faint2)">—</span>'; }
function chartHTML(runs,metric,hue){
  const pts=runs.map((r,i)=>({r,i,v:r[metric]})).filter(p=>typeof p.v==='number');
  if(!pts.length) return `<div style="padding:40px;text-align:center;color:var(--faint2);font-family:var(--mono);font-size:12px">
    no ${metric} values recorded for this group — see the table below</div>`;
  const W=1000,H=340,mL=44,mR=16,mT=16,mB=64;
  const vals=pts.map(p=>p.v); let lo=Math.min(...vals),hi=Math.max(...vals);
  const pad=Math.max(0.02,(hi-lo)*0.15); lo=Math.max(0,lo-pad); hi=Math.min(1,hi+pad);
  if(hi-lo<0.05){lo=Math.max(0,lo-0.03);hi=Math.min(1,hi+0.03);}
  const X=i=>mL+(runs.length<2?0.5:(i/(runs.length-1)))*(W-mL-mR);
  const Y=v=>mT+(1-(v-lo)/(hi-lo))*(H-mT-mB);
  // series per eval_set
  const sets=[...new Set(pts.map(p=>p.r.eval_set))];
  const PAL=['#38bdf8','#fbbf24','#e879f9','#34d399','#a78bfa','#fb923c','#2dd4bf','#fb7185'];
  let s='';
  // gridlines
  for(let g=0;g<=4;g++){ const v=lo+(hi-lo)*g/4;
    s+=`<line class="gridln" x1="${mL}" y1="${Y(v)}" x2="${W-mR}" y2="${Y(v)}"/>
        <text class="axlbl" x="${mL-8}" y="${Y(v)+3}" text-anchor="end">${v.toFixed(2)}</text>`; }
  sets.forEach((st,si)=>{
    const c=PAL[si%PAL.length], sp=pts.filter(p=>p.r.eval_set===st).sort((a,b)=>a.i-b.i);
    if(sp.length>1) s+=`<polyline fill="none" stroke="${c}" stroke-width="2.7" stroke-opacity=".9"
      points="${sp.map(p=>`${X(p.i)},${Y(p.v)}`).join(' ')}"/>`;
    sp.forEach(p=>{ s+=`<circle class="pt" cx="${X(p.i)}" cy="${Y(p.v)}" r="6" fill="${c}" fill-opacity=".9"
      stroke="#0b111c" stroke-width="1.5"><title>${esc(p.r.version)} · ${esc(p.r.eval_set)}
${metric} = ${p.v}${p.r.status?'  ('+esc(p.r.status)+')':''}
${esc((p.r.key_move||'').slice(0,150))}</title></circle>`; });
  });
  // x labels (thinned)
  const step=Math.ceil(runs.length/14);
  runs.forEach((r,i)=>{ if(i%step) return;
    s+=`<text class="axlbl" x="${X(i)}" y="${H-mB+16}" text-anchor="end"
      transform="rotate(-42 ${X(i)} ${H-mB+16})">${esc(r.version).slice(0,18)}</text>`; });
  s+=`<line class="ax" x1="${mL}" y1="${H-mB}" x2="${W-mR}" y2="${H-mB}"/>
      <line class="ax" x1="${mL}" y1="${mT}" x2="${mL}" y2="${H-mB}"/>`;
  // legend
  s+=sets.map((st,si)=>`<g transform="translate(${mL+si*168},${H-14})">
      <circle cx="5" cy="-4" r="4.5" fill="${PAL[si%PAL.length]}"/>
      <text class="slbl" x="15" y="0">${esc(st)}</text></g>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img"
    aria-label="scoring chart">${s}</svg>`;
}
window.__scg=g=>{scoreState.group=g;renderScoring();};
window.__scm=m=>{scoreState.metric=m;renderScoring();};

/* ---------------- DIAGRAMS ---------------- */
const DIAGS = DATA.diagrams || [];
const diagById = new Map(DIAGS.map(d=>[d.id,d]));
let diagAll=false, diagPick=null;
function stageDiagrams(i){
  const ids=(ST[i]&&ST[i].diagrams)||[];
  const ds=ids.map(id=>diagById.get(id)).filter(Boolean);
  return ds.length?ds:DIAGS.slice(0,1);
}
function renderDiagrams(){
  const V=$('#diagView');
  if(!DIAGS.length){ V.innerHTML=`<div class="vhead">Diagrams</div>
    <div class="vsub">No diagrams found. Run <code>_build/restyle_svgs.py</code>, then rebuild.</div>`; return; }
  if(diagAll){
    V.innerHTML=`<button class="backbtn" onclick="window.__dall(false)">← back to S${state.stage+1} ${esc(ST[state.stage].label)}</button>
      <div class="vhead">All pipeline diagrams</div>
      <div class="vsub">The hand-drawn architecture diagrams, recoloured into the atlas palette so they read as one
        system. Originals stay untouched in <code>pipeline_diagrams/</code>; these copies live in <code>diagrams/</code>.</div>
      <div class="dgrid">${DIAGS.map(d=>`<div class="dcard" role="button" tabindex="0"
        onclick="window.__dpick('${d.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.__dpick('${d.id}')}">
        <div class="dt">${esc(d.title)}<i>${esc(d.id.slice(0,2))}</i></div>
        <div class="dsvg">${d.svg}</div></div>`).join('')}</div>`;
    return;
  }
  const i=state.stage, hue=HUE[i%HUE.length], ds=stageDiagrams(i);
  V.style.setProperty('--hue',hue);
  const cur=(diagPick&&ds.find(d=>d.id===diagPick))||ds[0];
  V.innerHTML=`
    <div class="sbig" style="--hue:${hue}"><span class="num" style="font-size:22px">S${i+1}</span>
      <span style="font-size:16px;font-weight:600">${esc(ST[i].label)}</span>
      <span class="rp" style="margin-left:6px">${esc(ST[i].repo)}</span></div>
    <div class="vsub" style="margin:8px 0 12px">${esc(ST[i].title)} — the diagrams that cover this stage.
      Step stages with the rail or ←/→; the diagram follows.</div>
    <div class="dstrip" style="--hue:${hue}">
      ${ds.map(d=>`<button aria-pressed="${d.id===cur.id}" onclick="window.__dpick('${d.id}')">${esc(d.title)}</button>`).join('')}
      <button onclick="window.__dall(true)" style="margin-left:auto">▤ all ${DIAGS.length} diagrams</button>
    </div>
    <div class="dfocus">${cur.svg}</div>
    <div class="vsub" style="margin-top:10px"><code>diagrams/${esc(cur.id)}.svg</code></div>`;
}
window.__dall=b=>{diagAll=b;renderDiagrams();$('#diagView').scrollTop=0;};
window.__dpick=id=>{diagPick=id;diagAll=false;setMode('diagrams');$('#diagView').scrollTop=0;};
function togglePlay(){
  if(playTimer){ clearInterval(playTimer); playTimer=null; }
  else { playTimer=setInterval(()=>{ if(state.stage>=ST.length-1){clearInterval(playTimer);playTimer=null;renderLeft();return;} goStage(state.stage+1);},2600); }
  const p=$('#play'); if(p)p.textContent=playTimer?'❚❚':'▶';
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const stagey=(state.mode==='guided'||state.mode==='diagrams');
  if(e.key==='ArrowRight'){ if(!stagey)setMode('guided'); goStage(state.stage+1);}
  if(e.key==='ArrowLeft'){ if(!stagey)setMode('guided'); goStage(state.stage-1);}
  if(e.key==='Escape'){state.sel=null;renderRight();applyDim();$('#sres').classList.remove('on');}
  if(e.key==='m'||e.key==='M'){setMode(state.mode==='mesh'?'guided':'mesh');}
});

/* ---------- search ---------- */
const q=$('#q'),sres=$('#sres');
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase(); if(!v){sres.classList.remove('on');return;}
  const hits=M.filter(m=>m.file.toLowerCase().includes(v)||m.repo.toLowerCase().includes(v))
    .sort((a,b)=>b.deg-a.deg).slice(0,40);
  sres.innerHTML=hits.map(m=>{const si=modStage.get(m.id);const hue=si>0?HUE[si-1]:'#64748b';
    return `<div onclick="window.__pick('${m.id.replace(/'/g,"\\'")}')"><span class="dot" style="background:${hue}"></span>${esc(m.file)}<span class="rp">S${si||'·'} ${esc(m.repo)}</span></div>`;}).join('')||'<div class="empty" style="padding:10px">no match</div>';
  sres.classList.add('on');
});
window.__pick=id=>{ q.value='';sres.classList.remove('on'); const si=modStage.get(id);
  if(si>0){setMode('guided');goStage(si-1,()=>selectModule(id));} else {selectModule(id);} };
document.addEventListener('click',e=>{ if(!e.target.closest('.search'))sres.classList.remove('on'); });

/* ---------- boot ---------- */
$('#mGuided').onclick=()=>setMode('guided');
$('#mMesh').onclick=()=>setMode('mesh');
$('#mScore').onclick=()=>setMode('scoring');
$('#mDiag').onclick=()=>{diagAll=false;diagPick=null;setMode('diagrams');};
$('#tLeft').onclick=()=>{$('#right').classList.remove('show');$('#left').classList.toggle('show');};
$('#tRight').onclick=()=>{$('#left').classList.remove('show');$('#right').classList.toggle('show');};
$('#counts').innerHTML=`<b>${DATA.counts.nodes.toLocaleString()}</b> nodes · <b>${DATA.counts.edges.toLocaleString()}</b> edges<br><b>${DATA.counts.communities}</b> communities · <b>${BR.length}</b> bridges`;
buildRail();
document.documentElement.style.setProperty('--hue',HUE[0]);
renderLeft(); renderRight(); drawGuided();
window.addEventListener('resize',()=>{
  if(state.mode==='mesh'){ if(MESH.shape==='flat') drawMesh(); /* 3D re-sizes inside its own loop */ }
  else if(state.mode==='guided') drawGuided();
});
</script>
</body>
